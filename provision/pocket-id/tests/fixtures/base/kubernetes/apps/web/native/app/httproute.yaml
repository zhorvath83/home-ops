---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: native
spec:
  hostnames:
    - "${APP}.${PUBLIC_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: networking
      sectionName: https
    - name: envoy-internal
      namespace: networking
      sectionName: https
  rules:
    - backendRefs:
        - name: native
          port: 80
