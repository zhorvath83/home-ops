---
# Source of truth for Pocket ID groups and OIDC clients. Apply: just pocket-id apply
# The map key is the client_id (and the ExternalSecret field prefix); friendly_name is
# only what the IdP shows to the user.
# gate: envoy -> protected by components/gateway-oidc; native -> the app speaks OIDC itself.
# Every published hostname must be a clients subdomain or an exempt key (lint.sh, pre-commit + CI).
groups:
  media_users:
    friendly_name: Media users
  infra_admins:
    friendly_name: Infrastructure admins
  calibre-web-automated_users:
    friendly_name: Calibre users
  calibre-web-automated_admins:
    friendly_name: Calibre admins
  pingvin-share-x_admins:
    friendly_name: Pingvin Share admins
  paperless_admins:
    friendly_name: Paperless admins
  paperless_users:
    friendly_name: Paperless users
  paperless_coparents:
    friendly_name: Paperless co-parents
  sure_admins:
    friendly_name: Sure admins
  sure_users:
    friendly_name: Sure users
  mealie_admins:
    friendly_name: Mealie admins
  mealie_users:
    friendly_name: Mealie users
  home-gallery_users:
    friendly_name: Home Gallery users

clients:
  bazarr:
    friendly_name: Bazarr
    gate: envoy
    subdomain: subs
    groups:
      - media_users
  sonarr:
    friendly_name: Sonarr
    gate: envoy
    subdomain: shows
    groups:
      - media_users
  radarr:
    friendly_name: Radarr
    gate: envoy
    subdomain: movies
    groups:
      - media_users
  prowlarr:
    friendly_name: Prowlarr
    gate: envoy
    subdomain: indexers
    groups:
      - media_users
  qbittorrent:
    friendly_name: qBittorrent
    gate: envoy
    subdomain: bt
    groups:
      - media_users
  subsyncarr:
    friendly_name: Subsyncarr
    gate: envoy
    subdomain: subsync
    groups:
      - media_users
  maintainerr:
    friendly_name: Maintainerr
    gate: envoy
    subdomain: maintainerr
    groups:
      - media_users
  seerr:
    friendly_name: Seerr
    gate: envoy
    subdomain: reqs
    groups:
      - media_users
  hubble-ui:
    friendly_name: Hubble UI
    gate: envoy
    subdomain: hubble
    groups:
      - infra_admins
  echo-server:
    friendly_name: Echo Server
    gate: envoy
    subdomain: echo
    groups:
      - infra_admins
  grafana:
    friendly_name: Grafana
    gate: native
    subdomain: grafana
    callback_path: /login/generic_oauth
    groups:
      - infra_admins
  pingvin-share-x:
    friendly_name: Pingvin Share
    gate: native
    subdomain: share
    callback_path: /api/oauth/callback/oidc
    pkce_enabled: false
    groups:
      - pingvin-share-x_admins
  calibre-web-automated:
    friendly_name: Calibre-Web
    gate: native
    subdomain: books
    callback_path: /login/generic/authorized
    pkce_enabled: false
    groups:
      - calibre-web-automated_users
      - calibre-web-automated_admins
  crowdsec-web-ui:
    friendly_name: Crowdsec Web UI
    gate: native
    subdomain: crowdsec
    callback_path: /api/auth/oidc/callback
    pkce_enabled: false
    groups:
      - infra_admins
  homepage:
    friendly_name: Homepage
    gate: native
    subdomain: dash
    callback_path: /api/auth/callback/homepage-oidc
    groups:
      - infra_admins
  backrest:
    friendly_name: Backrest
    gate: envoy
    subdomain: backup
    groups:
      - infra_admins
  home-gallery:
    friendly_name: Home Gallery
    gate: envoy
    subdomain: fenykepek
    groups:
      - home-gallery_users
  paperless-gpt:
    friendly_name: Paperless GPT
    gate: envoy
    subdomain: paperless-gpt
    groups:
      - infra_admins
  kopia:
    friendly_name: Kopia
    gate: envoy
    subdomain: pvbackup
    groups:
      - infra_admins
  victoria-logs:
    friendly_name: Victoria Logs
    gate: envoy
    subdomain: logs
    groups:
      - infra_admins
  mealie:
    friendly_name: Mealie
    gate: native
    subdomain: recipes
    callback_path: /login
    groups:
      - mealie_admins
      - mealie_users
  paperless:
    friendly_name: Paperless
    gate: native
    subdomain: docs
    callback_path: /accounts/oidc/pocket-id/login/callback/
    # Swift Paperless reuses this client_id and redeems the code itself with PKCE, no secret.
    is_public: true
    extra_callback_urls:
      - x-paperless://oidc-callback
    groups:
      - paperless_admins
      - paperless_users
      - paperless_coparents
  actual:
    friendly_name: Actual Budget
    gate: native
    subdomain: pfm
    callback_path: /openid/callback
    groups:
      - infra_admins
  wallos:
    friendly_name: Wallos
    gate: native
    subdomain: subscriptions
    callback_path: ""
    pkce_enabled: false
    groups:
      - infra_admins
  # Path segment = sure's built-in env-driven OIDC provider name, fixed to openid_connect upstream.
  sure:
    friendly_name: Sure
    gate: native
    subdomain: fin
    callback_path: /auth/openid_connect/callback
    groups:
      - sure_admins
      - sure_users
  open-webui:
    friendly_name: Open WebUI
    gate: native
    subdomain: chat
    callback_path: /oauth/oidc/callback
    groups:
      - infra_admins
  # OIDC is configured in the CrossWatch UI (Settings > UI Settings > Security); the local login stays as recovery.
  crosswatch:
    friendly_name: CrossWatch
    gate: native
    subdomain: crosswatch
    callback_path: /api/app-auth/oidc/callback
    groups:
      - media_users

# Hostnames published without a Pocket ID gate. reason, control and gateways are mandatory;
# temporary: true needs tracking: <BM permalink> and warns on every lint run.
exempt:
  idm:
    reason: The identity provider itself.
    control: Passkey-only; the public route returns 403 for X-API-KEY, setup, signup and internal paths.
    gateways:
      - envoy-external
      - envoy-internal
  flux-webhook:
    reason: GitHub webhook receiver, machine caller.
    control: Route SecurityPolicy allows only the GitHub hooks CIDRs; Flux Receiver HMAC token.
    gateways:
      - envoy-external
  "*":
    reason: Plain-HTTP to HTTPS redirect, no backend.
    control: RequestRedirect only, http listener only (admission policy).
    gateways:
      - envoy-external
      - envoy-internal
    redirect_only: true
  jellyfin:
    reason: TV and mobile clients cannot follow a browser OIDC redirect.
    control: Jellyfin's own login; LAN-only (envoy-internal).
    gateways:
      - envoy-internal
