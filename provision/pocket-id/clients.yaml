---
# Source of truth for Pocket ID groups and OIDC clients. Apply: just pocket-id apply
# The map key is the client_id (and the ExternalSecret field prefix); friendly_name is
# only what the IdP shows to the user.
# gate: envoy -> protected by components/gateway-oidc; native -> the app speaks OIDC itself.
groups:
  media_users:
    friendly_name: Media users
  infra_admins:
    friendly_name: Infrastructure admins
  calibre-web-automated_users:
    friendly_name: Calibre users
  calibre-web-automated_admins:
    friendly_name: Calibre admins
  pingvin-share-x_admins:
    friendly_name: Pingvin Share admins
  paperless_admins:
    friendly_name: Paperless admins
  paperless_users:
    friendly_name: Paperless users
  mealie_admins:
    friendly_name: Mealie admins
  mealie_users:
    friendly_name: Mealie users

clients:
  bazarr:
    friendly_name: Bazarr
    gate: envoy
    subdomain: subs
    groups:
      - media_users
  sonarr:
    friendly_name: Sonarr
    gate: envoy
    subdomain: shows
    groups:
      - media_users
  radarr:
    friendly_name: Radarr
    gate: envoy
    subdomain: movies
    groups:
      - media_users
  prowlarr:
    friendly_name: Prowlarr
    gate: envoy
    subdomain: indexers
    groups:
      - media_users
  qbittorrent:
    friendly_name: qBittorrent
    gate: envoy
    subdomain: bt
    groups:
      - media_users
  subsyncarr:
    friendly_name: Subsyncarr
    gate: envoy
    subdomain: subsync
    groups:
      - media_users
  maintainerr:
    friendly_name: Maintainerr
    gate: envoy
    subdomain: maintainerr
    groups:
      - media_users
  seerr:
    friendly_name: Seerr
    gate: envoy
    subdomain: reqs
    groups:
      - media_users
  suggestarr:
    friendly_name: SuggestArr
    gate: envoy
    subdomain: suggestarr
    groups:
      - media_users
  hubble-ui:
    friendly_name: Hubble UI
    gate: envoy
    subdomain: hubble
    groups:
      - infra_admins
  echo-server:
    friendly_name: Echo Server
    gate: envoy
    subdomain: echo
    groups:
      - infra_admins
  grafana:
    friendly_name: Grafana
    gate: native
    subdomain: grafana
    callback_path: /login/generic_oauth
    groups:
      - infra_admins
  pingvin-share-x:
    friendly_name: Pingvin Share
    gate: native
    subdomain: share
    callback_path: /api/oauth/callback/oidc
    pkce_enabled: false
    groups:
      - pingvin-share-x_admins
  calibre-web-automated:
    friendly_name: Calibre-Web
    gate: native
    subdomain: books
    callback_path: /login/generic/authorized
    pkce_enabled: false
    groups:
      - calibre-web-automated_users
      - calibre-web-automated_admins
  crowdsec-web-ui:
    friendly_name: Crowdsec Web UI
    gate: native
    subdomain: crowdsec
    callback_path: /api/auth/oidc/callback
    pkce_enabled: false
    groups:
      - infra_admins
  homepage:
    friendly_name: Homepage
    gate: native
    subdomain: dash
    callback_path: /api/auth/callback/homepage-oidc
    groups:
      - infra_admins
  backrest:
    friendly_name: Backrest
    gate: envoy
    subdomain: backup
    groups:
      - infra_admins
  paperless-gpt:
    friendly_name: Paperless GPT
    gate: envoy
    subdomain: paperless-gpt
    groups:
      - infra_admins
  kopia:
    friendly_name: Kopia
    gate: envoy
    subdomain: pvbackup
    groups:
      - infra_admins
  victoria-logs:
    friendly_name: Victoria Logs
    gate: envoy
    subdomain: logs
    groups:
      - infra_admins
  mealie:
    friendly_name: Mealie
    gate: native
    subdomain: recipes
    callback_path: /login
    groups:
      - mealie_admins
      - mealie_users
  paperless:
    friendly_name: Paperless
    gate: native
    subdomain: docs
    callback_path: /accounts/oidc/pocket-id/login/callback/
    groups:
      - paperless_admins
      - paperless_users
  actual:
    friendly_name: Actual Budget
    gate: native
    subdomain: pfm
    callback_path: /openid/callback
    groups:
      - infra_admins
  wallos:
    friendly_name: Wallos
    gate: native
    subdomain: subscriptions
    callback_path: ""
    pkce_enabled: false
    groups:
      - infra_admins
