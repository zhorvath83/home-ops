---
name: "Update GitHub Hooks Networks"
on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"
env:
  POLICY_FILE: kubernetes/apps/flux-system/flux-instance/app/github/securitypolicy.yaml

permissions:
  contents: write
  pull-requests: write

jobs:
  update-github-hooks-networks:
    name: Update GitHub Hooks Networks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests ruamel.yaml

      - name: Update GitHub Hooks Networks
        id: update
        run: |
          OUTPUT=$(python .github/scripts/update_github_hooks_networks.py)
          {
            echo "changes<<EOF"
            echo "${OUTPUT}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          branch: github-action/update-github-hooks-networks
          delete-branch: true
          title: "chore(github-action): update github hooks networks"
          signoff: true
          commit-message: "chore(github-action): update github hooks networks"
          body: |
            Update GitHub webhook source ranges in the flux-webhook route
            SecurityPolicy (Envoy geo gate exception).

            **Updated files:**
            - `${{ env.POLICY_FILE }}` - SecurityPolicy `allow-github-hooks` clientCIDRs

            **Changes:**
            ```
            ${{ steps.update.outputs.changes }}
            ```

            Source: https://api.github.com/meta (hooks)
          labels: |
            renovate/github-action

      - name: Debug Git Diff
        if: failure()
        run: |-
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add .
          git diff --cached --name-status
          git status
