---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Flate

on:
  pull_request:
    branches:
      - main
    paths:
      - "kubernetes/**"
      - ".mise.toml"
      - ".github/workflows/flate.yaml"
  push:
    branches:
      - main
    paths:
      - "kubernetes/**"
      - ".mise.toml"
      - ".github/workflows/flate.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  test:
    name: Flate - Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup flate
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: aqua:home-operations/flate
          cache: false

      # Full tree on purpose: also catches breakage the diff does not reach (removed upstream chart, flate bump).
      - name: Run flate test
        run: flate test --path kubernetes/flux/cluster --strict-substitutions --no-progress

  diff:
    if: ${{ github.event_name == 'pull_request' }}
    name: Flate - Diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # sticky diff comment
    strategy:
      matrix:
        kind:
          - hr
          - ks
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup flate
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: aqua:home-operations/flate
          cache: false

      - name: Run flate diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          KIND: ${{ matrix.kind }}
        run: >-
          flate diff "$KIND"
          --path kubernetes/flux/cluster
          --base "$BASE_SHA"
          --strict-substitutions
          --no-progress
          --output github
          > "$RUNNER_TEMP/diff.md"

      - name: Add or Update Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          KIND: ${{ matrix.kind }}
        with:
          script: |
            const fs = require("node:fs");
            const { KIND, RUNNER_TEMP } = process.env;
            const MAX_CHARS = 60000; // GitHub rejects comment bodies above 65536 characters
            let diff = fs.readFileSync(`${RUNNER_TEMP}/diff.md`, "utf8").trim();
            if (!diff) return;
            if (diff.length > MAX_CHARS) {
              diff = `${diff.slice(0, MAX_CHARS)}\n... (truncated, run flate diff ${KIND} locally for the full output)`;
            }
            const label = { hr: "HelmRelease", ks: "Kustomization" }[KIND];
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const sha = context.payload.pull_request.head.sha;
            const marker = `<!-- Sticky Pull Request Comment${issue_number}/kubernetes/${KIND} -->`;
            const body = [
              marker,
              `<details open><summary>${label} diff</summary>`,
              "",
              "```diff",
              diff,
              "```",
              "",
              "</details>",
              "",
              `<sub>Generated by flate for [\`${sha.slice(0, 7)}\`](${context.payload.pull_request.html_url}/commits/${sha})</sub>`,
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  success:
    if: ${{ !cancelled() }}
    needs:
      - test
      - diff
    name: Flate - Success
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "All jobs passed or skipped" && echo "$RESULTS"
