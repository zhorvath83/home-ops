---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Workflow Lint

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".mise.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".mise.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup linters
        uses: jdx/mise-action@v5
        with:
          install_args: aqua:rhysd/actionlint aqua:zizmorcore/zizmor aqua:koalaman/shellcheck
          cache: false

      - name: Run actionlint
        run: actionlint

      # Online audits (impostor-commit, known-vulnerable-actions) cover Renovate action bumps, which never run pre-commit.
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format github .github/workflows
