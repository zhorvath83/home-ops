---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: suggestarr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # AD-023: envoy-internal ingress (LAN admin UI) + internet egress (TMDB + Gemini LLM)
      labels:
        ingress.home.arpa/allow-gateway-internal: "true"
        egress.home.arpa/allow-world: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      suggestarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/ciuse99/suggestarr
              # renovate: image=ciuse99/suggestarr
              tag: v2.10.1@sha256:b5fd5ed1223655dd007363a65ef91f5b9b18a10f4aaf283be5bc9cca50f21712
            env:
              SUGGESTARR_PORT: &port 5000
              LOG_LEVEL: info
              # SSO is enforced by the envoy-oidc gate; Cilium (allow-gateway-internal) makes the gate the only ingress path, so disabling SuggestArr's own login is safe.
              SUGGESTARR_AUTH_DISABLED: "true"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: false
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 15m
                memory: 384Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: suggestarr
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: SuggestArr
          gethomepage.dev/group: Media
          gethomepage.dev/icon: suggest-arr.png
        hostnames:
          - "${APP_SUBDOMAIN}.${PUBLIC_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: suggestarr
        globalMounts:
          - path: /app/config/config_files
      tmp:
        type: emptyDir
