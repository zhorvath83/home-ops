---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
# LAN-only: envoy-internal, never envoy-external. The Trakt ZIP upload + P1 measurement
# come from the LAN; the app stays off the public internet while the import is unverified.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crosswatch
spec:
  hostnames:
    - "crosswatch.${PUBLIC_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: networking
      sectionName: https
  rules:
    - backendRefs:
        - name: crosswatch
          port: 8787
