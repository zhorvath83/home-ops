---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crosswatch
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # AD-023: gateway ingress via the CCNP label; allow-world egress because Jellyfin
      # matching needs TMDb metadata. Narrow to custom-egress once the destinations settle.
      labels:
        ingress.home.arpa/allow-gateway-internal: "true"
        egress.home.arpa/allow-world: "true"
      securityContext:
        # 1000 matches the image's baked-in appuser (APP_UID default); at 10001 the
        # entrypoint's id lookup fails and logs "cannot find name for user ID".
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      crosswatch:
        containers:
          app:
            image:
              # renovate: datasource=docker depName=ghcr.io/cenodude/crosswatch
              repository: ghcr.io/cenodude/crosswatch
              tag: 0.11.2@sha256:52ee71679284c55a712d9127e1e64e74b71f563c499f3e8b01e554219a88a337
            env:
              WEB_PORT: &port 8787
              RUNTIME_DIR: /config
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            # /healthz is the documented health endpoint and stays unauthenticated
            # while / redirects to the login page.
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 768Mi
    service:
      app:
        controller: crosswatch
        ports:
          http:
            port: *port
    route:
      app:
        # LAN-only: envoy-internal, never envoy-external. The Trakt ZIP upload + P1 measurement
        # come from the LAN; the app stays off the public internet while the import is unverified.
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: CrossWatch
          gethomepage.dev/group: Media
          gethomepage.dev/icon: crosswatch.svg
        hostnames:
          - "crosswatch.${PUBLIC_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: crosswatch
        globalMounts:
          - path: /config
      # Starlette spools multipart uploads via /tmp; readOnlyRootFilesystem needs a writable /tmp.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
