---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # AD-023 vocabulary: envoy-internal (ingress-from-gateway-internal CCNP) + internet egress (TMDB + radarr.video API) via the allow-world-egress CCNP
      labels:
        ingress.home.arpa/allow-gateway-internal: "true"
        egress.home.arpa/allow-world: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      radarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 7.0.1.10859@sha256:ffe1f4d7c30b33a1e1256e14ace0eefddf120b37d8defceba208e9c190772f8d
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: &port 7878
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: false
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 5m
                memory: 200Mi
              limits:
                memory: 1Gi
    service:
      app:
        controller: radarr
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Radarr
          gethomepage.dev/group: Arr Stack
          gethomepage.dev/icon: radarr.svg
        hostnames:
          - "${APP_SUBDOMAIN}.${PUBLIC_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: radarr
        globalMounts:
          - path: /config
      nfs-nas-media:
        type: nfs
        server: ${NAS_IP}
        path: /media
        globalMounts:
          - path: /media
      tmp:
        type: emptyDir
    # radarr (AD-023): the *arr named consumers on the API port; envoy ingress via the gateway CCNPs.
    networkpolicies:
      main:
        type: cilium
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: arr-search
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: bazarr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: prowlarr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: seerr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: recyclarr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: maintainerr
            toPorts:
              - ports:
                  - port: "7878"
                    protocol: TCP
