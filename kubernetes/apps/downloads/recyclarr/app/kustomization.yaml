---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled # scripts carry shell ${VAR}; skip Flux envsubst
configMapGenerator:
  - name: recyclarr-config
    files:
      - recyclarr.yml=config/recyclarr.yml
      - settings.yml=config/settings.yml
      - sonarr-hungarian.json=config/custom-formats/sonarr/hungarian.json
      - sonarr-not-hungarian-or-original.json=config/custom-formats/sonarr/not-hungarian-or-original.json
      - sonarr-remux.json=config/custom-formats/sonarr/remux.json
      - sonarr-bluray.json=config/custom-formats/sonarr/bluray.json
      - radarr-hungarian.json=config/custom-formats/radarr/hungarian.json
      - radarr-not-hungarian-or-original.json=config/custom-formats/radarr/not-hungarian-or-original.json
      - radarr-remux.json=config/custom-formats/radarr/remux.json
      - radarr-bluray.json=config/custom-formats/radarr/bluray.json
      - fix-radarr-language.sh=config/scripts/fix-radarr-language.sh
