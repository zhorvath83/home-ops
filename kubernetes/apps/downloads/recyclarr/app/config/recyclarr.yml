---
# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
# recyclarr sync for Sonarr + Radarr — priority order HUN dub > quality > size.
# (see BM docs/progress/arr-config-sync for the full planning framework)
#
# ---- SHARED SCORING MODEL — read this before touching any score in this file ----
#
# Neither Sonarr nor Radarr ranks releases by a weighted total. Both run their
# DownloadDecisionComparer as CompareQuality -> CompareCustomFormatScore -> ... and short-circuit
# on the first non-zero result, and both UpgradableSpecifications return "upgrade allowed" on a
# better quality tier before they compute any CF score. So with separate quality tiers a non-HUN
# 2160p always beats a HUN 1080p, at ANY Hungarian score. Raising the Hungarian score alone
# changes nothing — the score is a tiebreaker within a tier, not a weight across tiers.
#
# The lever is quality grouping: QualityProfile.GetIndex() defaults to respectGroupOrder=false,
# so every member of ONE quality group yields the same index, CompareQuality returns 0, and the
# whole decision falls through to the CF score. Both profiles therefore collapse every allowed
# quality into a single group, and resolution is re-expressed as a CF score. That is what turns
# the score into a real weight and makes "HUN > quality > size" actually hold.
#
# The shared ladder (each rung must outrank the sum of everything below it):
#   HUN dub               26000
#   2160p / 1080p         20000 / 10000  720p is the 0 baseline on both apps
#   remux                 -5000  demotes a remux below a plain release of the same resolution
#   release-group tier    <= 3300   Sonarr: WEB Tier 01 1700; Radarr: + BHDStudio 1000, hallowed 600
#   HDR                     500
#   audio (DD+ ATMOS)       135    Radarr only
#   streaming service     <= 1575  Sonarr: 19 service CFs at 75 + HD/UHD boost 150; Radarr: MA+CRiT 40
#   Repack/Proper             7
#   junk veto            -60000
#
# Worst-case sum of every rung below resolution, taking the max within each mutually exclusive
# family (tier, audio, repack) and the sum where CFs can stack (service, encode group):
# Sonarr 3782, Radarr 3982. Take the larger, M = 3982. The invariants:
#   resolution step 10000 > M                          -> resolution outranks tier/HDR/audio/svc
#   remux penalty 5000 > M                             -> a plain release always beats a remux
#                                                         of the same resolution, loaded or not
#   2160p remux 20000-5000 = 15000 > 10000 + M = 13982 -> a 4K remux still beats any 1080p
#   1080p remux 10000-5000 =  5000 >     0 + M =  3982 -> a 1080p remux still beats any 720p
#   max non-HUN = 20000 + M = 23982 < 26000            -> HUN wins at every resolution
#   max total   = 26000 + 20000 + M = 49982 < 60000    -> every junk veto stays a real veto
#   until_score = 46000 = bare HUN 2160p, non-remux    -> the CF cutoff actually latches
#
# The remux penalty is what forced the 10000 step. It has to exceed M to be a guarantee rather
# than a hope (a remux carrying a Bluray tier CF would otherwise outscore a plain release), and
# once it does, the step has to exceed penalty + M or a 4K remux would fall below a 1080p WEB.
#
# Touching any score means re-deriving all of the above. A veto that is not more negative than
# the max total silently stops being one: at the guide's -10000 a HUN 2160p LQ release would net
# a positive score and get grabbed.
#
# Known gap: there is no rung below 720p, so a 480p release scores the same as a 720p one. Harmless
# while SD sits outside both profiles (it is rejected at the quality gate regardless), but admitting
# SD requires a negative 480p rung first, or SD would tie with 720p and never upgrade.
#
# Recyclarr note: the flat custom_formats entries below deliberately override the guide/CF-group
# scores — recyclarr resolves a conflict with "first value wins" and processes custom_formats
# before CF groups. Each override shows up in the sync log as an INFO "conflicting scores" line.
sonarr:
  series:
    base_url: http://sonarr.downloads.svc.cluster.local:8989
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true
    media_management:
      propers_and_repacks: do_not_prefer
    media_naming:
      episodes:
        anime: default
        daily: default
        rename: true
        standard: default
      season: default
      series: plex-imdb
    quality_definition:
      type: series
      # Size is the LOWEST priority lever, so it is enforced as a cap per quality, never by
      # excluding a source. Every quality the profile allows gets an explicit max, because the
      # `series` defaults leave Bluray/HDTV/Remux at max=unlimited. preferred = ~60% of max
      # (recyclarr requires preferred <= max, and every max here clears the guide's min).
      # MB/min; for a 45-minute episode multiply by 45 to get MB.
      qualities:
        - name: WEBDL-2160p
          max: 200
          preferred: 120
        - name: WEBRip-2160p
          max: 200
          preferred: 120
        - name: WEBDL-1080p
          max: 100
          preferred: 60
        - name: WEBRip-1080p
          max: 100
          preferred: 60
        - name: WEBDL-720p
          max: 50
          preferred: 30
        - name: WEBRip-720p
          max: 50
          preferred: 30
        # Bluray runs at a higher bitrate than WEB by design, so it gets more headroom than the
        # WEB rung at the same resolution — but a hard ceiling all the same.
        - name: Bluray-2160p
          max: 300
          preferred: 180
        - name: Bluray-1080p
          max: 150
          preferred: 90
        - name: Bluray-720p
          max: 80
          preferred: 48
        # Remux caps are the point of allowing Remux at all: admit a normal one, reject the
        # bloated tail. Calibrated on the library: existing 4K remuxes run 411 MB/min median,
        # 499 max, so 400 would have rejected 16 of 25. 550 is ~25 GB for a 45-minute episode.
        - name: Bluray-2160p Remux
          max: 550
          preferred: 330
        - name: Bluray-1080p Remux
          max: 250
          preferred: 150
        # Broadcast captures carry Hungarian dubs; cap them at the WEB rung of the same resolution.
        - name: HDTV-1080p
          max: 100
          preferred: 60
        - name: HDTV-720p
          max: 50
          preferred: 30
    quality_profiles:
      - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7 # WEB-2160p (Combined)
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: HD-UHD
          until_score: 46000 # bare HUN 2160p, non-remux (26000 + 20000) — the CF cutoff
        # One group instead of the guide's tiers — see the shared scoring model header. The guide
        # profile is WEB-only ("covers: WEBDL 1080p, 2160p"), which silently gated out Bluray,
        # HDTV and Remux — and those are exactly where the Hungarian dubs live: 93% of the files
        # at an excluded quality were Hungarian, against 64% inside. A quality left out of the
        # profile also indexes as 0, so it is permanently cutoff-unmet and any allowed release
        # outranks it on quality before scoring runs. Size is handled by the caps above instead.
        qualities:
          - name: HD-UHD
            qualities:
              - Bluray-2160p Remux
              - Bluray-2160p
              - WEBRip-2160p
              - WEBDL-2160p
              - Bluray-1080p Remux
              - Bluray-1080p
              - WEBRip-1080p
              - WEBDL-1080p
              - HDTV-1080p
              - Bluray-720p
              - WEBRip-720p
              - WEBDL-720p
              - HDTV-720p
    custom_format_groups:
      # [Optional] Language Profiles is auto-synced for this profile; its only default member
      # (Language: Not Original, -10000) cancels the HUN boost to -100 and rejects every
      # Hungarian dub. home-ops-not-hungarian-or-original already covers third-language dubs.
      skip:
        - 74aff4168620ed49dcc67e92b2c2a5b4 # [Optional] Language Profiles
      add:
        - trash_id: e3f37512790f00d0e89e54fe5e790d1c # [Optional] Golden Rule UHD
        - trash_id: 85fae4a2294965b75710ef2989c850eb # [Streaming Services] HD/UHD boost
        - trash_id: 59c3af66780d08332fdc64e68297098f # [Unwanted] Unwanted Formats (LQ/BR-DISK incl.)
    # Scores follow the shared ladder in the file header — do not change one in isolation.
    custom_formats:
      - trash_ids:
          - home-ops-hungarian-language
        assign_scores_to:
          - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7
            score: 26000
      - trash_ids:
          - 290078c8b266272a5cc8e251b5e2eb0b # 1080p
        assign_scores_to:
          - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7
            score: 10000
      - trash_ids:
          - 1bef6c151fa35093015b0bfef18279e5 # 2160p
        assign_scores_to:
          - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7
            score: 20000
      # Demote remux below a plain release of the same resolution. Local CF, since the guide has
      # no "is this a remux" format: Sonarr's SourceSpecification value 7 (BlurayRaw) matches
      # Bluray-1080p Remux and Bluray-2160p Remux and nothing else.
      - trash_ids:
          - home-ops-remux
        assign_scores_to:
          - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7
            score: -5000
      # Junk vetoes, overridden from the guide's -10000 to clear the 49982 max positive total.
      - trash_ids:
          - 9c11cd3f07101cdba90a2d81cf0e56b4 # LQ
          - e2315f990da2e2cbfc9fa5b7a6fcfe48 # LQ (Release Title)
          - 85c61753df5da1fb2aab6f2a47426b09 # BR-DISK
          - 15a05bc7c1a36e2b57fd628f8977e2fc # AV1
          - 32b367365729d530ca1c124a0b180c64 # Bad Dual Groups
          - fbcb31d8dabd2a319072b84fc0b7249c # Extras
          - 23297a736ca77c0fc8e70f8edd7ee56c # Upscaled
          - 9b64dff695c2115facf1b6ea59c9bd07 # x265 (no HDR/DV)
        assign_scores_to:
          - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7
            score: -60000
      # Block third-language dubs: only HUN or Original wanted. Sonarr has no profile language
      # gate, so this CF is the sole mechanism that rejects non-HUN/non-Original dubs.
      - trash_ids:
          - home-ops-not-hungarian-or-original
        assign_scores_to:
          - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7
            score: -60000
radarr:
  movies:
    base_url: http://radarr.downloads.svc.cluster.local:7878
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true
    media_management:
      propers_and_repacks: do_not_prefer
    media_naming:
      folder: plex-imdb
      movie:
        rename: true
        standard: plex-imdb
    quality_definition:
      type: movie
      # `movie`, not sqp-uhd: sqp-uhd only defines 8 qualities and recyclarr hard-errors on a
      # cap for any quality outside its guide type ("does not exist in the guide for type"),
      # which rules out capping Bluray-1080p/720p and HDTV-1080p/720p. `movie` covers all 14.
      # Not sqp-streaming either: its 85.7 MB/min 720p cap would reject large HUN 720p releases,
      # against HUN > size. Size is the lowest priority lever, so it is enforced as a cap per
      # quality, never by excluding a source — and `movie` defaults every max to 2000, so EVERY
      # quality the profile allows must be listed here or it is effectively uncapped.
      # preferred = ~60% of max (recyclarr requires preferred <= max, and every max here clears
      # the guide's min). MB/min; for a 120-minute film multiply by 120 to get MB. No min floors
      # (Upscaled CF covers fakes).
      qualities:
        - name: WEBDL-2160p
          max: 300
          preferred: 180
        - name: WEBRip-2160p
          max: 300
          preferred: 180
        - name: Bluray-2160p
          max: 300
          preferred: 180
        - name: WEBDL-1080p
          max: 150
          preferred: 90
        - name: WEBRip-1080p
          max: 150
          preferred: 90
        - name: Bluray-1080p
          max: 200
          preferred: 120
        - name: Bluray-720p
          max: 100
          preferred: 60
        - name: WEBDL-720p
          max: 100
          preferred: 60
        - name: WEBRip-720p
          max: 100
          preferred: 60
        # Remux caps are the point of allowing Remux at all: admit a normal one, reject the
        # bloated tail. Calibrated on the same 4K remux population as Sonarr (411 median,
        # 499 max MB/min). 550 is ~66 GB for a 2-hour film, 300 is ~36 GB.
        - name: Remux-2160p
          max: 550
          preferred: 330
        - name: Remux-1080p
          max: 300
          preferred: 180
        # Broadcast captures carry Hungarian dubs; cap them at the WEB rung of the same resolution.
        - name: HDTV-1080p
          max: 150
          preferred: 90
        - name: HDTV-720p
          max: 100
          preferred: 60
    quality_profiles:
      - trash_id: 5128baeb2b081b72126bc8482b2a86a0 # [SQP] SQP-1 (2160p)
        reset_unmatched_scores:
          enabled: true
        # Profile default minFormatScore=1000 would reject every non-HUN release (no tier CF
        # groups are added); lower to 0 so an untagged non-HUN release stays available as
        # fallback. Junk is rejected by the -35000 vetoes below, not by this floor.
        min_format_score: 0
        upgrade:
          allowed: true
          until_quality: HD-UHD
          until_score: 46000 # bare HUN 2160p, non-remux (26000 + 20000) — the CF cutoff
        # One group instead of the guide's four tiers — see the shared scoring model header.
        # Mirrors the Sonarr member set: SQP-1 already allowed WEB and Bluray, and HDTV + Remux
        # are added for the same reason as on Sonarr — every Radarr file at an excluded quality
        # is Hungarian, and an excluded quality indexes as 0, so it is permanently cutoff-unmet
        # and any allowed release outranks it on quality before scoring runs.
        qualities:
          - name: HD-UHD
            qualities:
              - Remux-2160p
              - Bluray-2160p
              - WEBDL-2160p
              - WEBRip-2160p
              - Remux-1080p
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p
              - HDTV-720p
    custom_format_groups:
      add:
        - trash_id: ff204bbcecdd487d1cefcefdbf0c278d # [Optional] Golden Rule UHD
          assign_scores_to:
            - trash_id: 5128baeb2b081b72126bc8482b2a86a0
        - trash_id: 15b1cf0b6f1a1493856a4355907affee # [Unwanted] Unwanted Formats SQP
    # Scores follow the shared ladder in the file header — do not change one in isolation.
    custom_formats:
      - trash_ids:
          - home-ops-hungarian-language
        assign_scores_to:
          - trash_id: 5128baeb2b081b72126bc8482b2a86a0
            score: 26000
      - trash_ids:
          - 820b09bb9acbfde9c35c71e0e565dad8 # 1080p
        assign_scores_to:
          - trash_id: 5128baeb2b081b72126bc8482b2a86a0
            score: 10000
      - trash_ids:
          - fb392fb0d61a010ae38e49ceaa24a1ef # 2160p
        assign_scores_to:
          - trash_id: 5128baeb2b081b72126bc8482b2a86a0
            score: 20000
      # The guide's own 720p CF scores 5, which would make the 720p rung differ between the two
      # apps for no reason. Pin it to the shared 0 baseline.
      - trash_ids:
          - b2be17d608fc88818940cd1833b0b24c # 720p
        assign_scores_to:
          - trash_id: 5128baeb2b081b72126bc8482b2a86a0
            score: 0
      # Demote remux below a plain release of the same resolution. Local CF, since the guide has
      # no "is this a remux" format: Radarr's QualityModifierSpecification value 5 (REMUX).
      - trash_ids:
          - home-ops-remux
        assign_scores_to:
          - trash_id: 5128baeb2b081b72126bc8482b2a86a0
            score: -5000
      # Block third-language dubs: only HUN or Original wanted. Replaces the hard "Original"
      # language gate (reconciled to "Any" by fix-radarr-language.sh) so non-HUN dubs are vetoed.
      - trash_ids:
          - home-ops-not-hungarian-or-original
        assign_scores_to:
          - trash_id: 5128baeb2b081b72126bc8482b2a86a0
            score: -60000
      # Every junk veto SQP-1 carries, at one magnitude that clears the 49982 max positive total.
      # LQ/BR-DISK/AV1/3D are not members of the SQP Unwanted group and were already listed here;
      # the rest come from that group at the guide's -10000 and are overridden to match.
      - trash_ids:
          - 90a6f9a284dff5103f6346090e6280c8 # LQ
          - e204b80c87be9497a8a6eaff48f72905 # LQ (Release Title)
          - ed38b889b31be83fda192888e2286d83 # BR-DISK
          - cae4ca30163749b891686f95532519bd # AV1
          - b8cd450cbfa689c0259a01d9e29ba3d6 # 3D
          - b6832f586342ef70d9c128d40c07b872 # Bad Dual Groups
          - cc5e51a9e85a6296ceefe097a77f12f4 # BCORE
          - cc444569854e9de0b084ab2b8b1532b2 # Black and White Editions
          - 2f22d89048b01681dde8afe203bf2e95 # DTS X
          - 8e109e50e0a0b83a5098b056e13bf6db # DTS-HD HRA
          - dcf3ec6938fa32445f590a4da84256cd # DTS-HD MA
          - 923b6abef9b17f937fab56cfcf89e1f1 # DV (w/o HDR fallback)
          - 0a3f082873eb454bde444150b70253cc # Extras
          - e6886871085226c3da1830830146846c # Generated Dynamic HDR
          - c465ccc73923871b3eb1802042331306 # Line/Mic Dubbed
          - 712d74cd88bceb883ee32f773656b1f5 # Sing-Along Versions
          - 3cafb66171b47f226146a0770576870f # TrueHD
          - 496f355514737f7d83bf7aa4d24f8169 # TrueHD ATMOS
          - bfd8eb01832d646a0a89c4deb46f8564 # Upscaled
          - 839bea857ed2c0a8e084f3cbdbd65ecb # x265 (no HDR/DV)
        assign_scores_to:
          - trash_id: 5128baeb2b081b72126bc8482b2a86a0
            score: -60000
