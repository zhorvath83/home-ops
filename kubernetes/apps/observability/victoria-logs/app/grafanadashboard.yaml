---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
# The chart emits its dashboards as ConfigMaps (dashboards.enabled); referenced here by name.
# Queries Prometheus. The vector dashboard needs vector.enabled (unused).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: victoria-logs-victorialogs-single-node
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderRef: observability
  configMapRef:
    name: victoria-logs-victorialogs-single-node
    key: victorialogs-single-node.json
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus
