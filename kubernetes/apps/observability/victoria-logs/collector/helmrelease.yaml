---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-collector
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: victoria-logs-collector
  values:
    fullnameOverride: victoria-logs-collector
    # AD-023 V5e: close ingress (default-deny) except the Prometheus scrape via the CCNP; the collector has no probes and no other ingress.
    podLabels:
      ingress.home.arpa/allow-prometheus: "true"
    global:
      image:
        registry: quay.io
    podMonitor:
      enabled: true
    remoteWrite:
      - url: http://victoria-logs-server.observability.svc.cluster.local:9428
    # Rootless baseline. The SA token stays mounted (serviceAccount.automount defaults
    # true): --kubernetesCollector enriches logs via the API and the SA RBAC is minimal
    # (get/list/watch on nodes/namespaces/pods) — disabling it would break log collection.
    podSecurityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      enabled: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    # tmpDataPath moved off /var/lib/vl-collector (chart default): that path sits under
    # the read-only /var/lib hostPath mount, so non-root vlagent inherits the old root
    # pod's root-owned persistent-queue and EACCES-purges. An emptyDir at a clean path
    # is writable and free of that stale data.
    extraArgs:
      tmpDataPath: /vlagent-data
    persistence:
      volume:
        emptyDir: {}
