---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-logs
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: victoria-logs
  components:
    - ../../../../components/gateway-oidc
  dependsOn:
    - name: onepassword-connect
      namespace: external-secrets
    - name: pocket-id
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/observability/victoria-logs/app
  postBuild:
    substitute:
      APP: victoria-logs
      APP_SUBDOMAIN: logs
      # chart-generated HTTPRoute is named victoria-logs-server, not ${APP}
      HTTPROUTE_NAME: victoria-logs-server
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  timeout: 5m
  wait: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-logs-collector
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: victoria-logs-collector
  dependsOn:
    - name: victoria-logs
  interval: 1h
  path: ./kubernetes/apps/observability/victoria-logs/collector
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  timeout: 5m
  wait: false
