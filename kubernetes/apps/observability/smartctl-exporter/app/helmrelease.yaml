---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: smartctl-exporter
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: smartctl-exporter
  values:
    fullnameOverride: smartctl-exporter
    # Both disks are NVMe; the exporter matches the filter on the bare device name (nvme0), not the /dev path.
    config:
      device_include: "nvme.*"
    # Exporter reads /dev and serves metrics — no Kubernetes API need.
    rbac:
      create: false
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    podLabels:
      ingress.home.arpa/allow-prometheus: "true"
    serviceMonitor:
      enabled: true
      attachMetadata:
        node: true
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_endpoint_node_name
          targetLabel: instance
    prometheusRules:
      enabled: false
  # Chart hardcodes privileged:true (NVMe ioctl needs the device cgroup only privileged
  # opens; drop-ALL+SYS_RAWIO fails EPERM) and exposes no automount value — drop the SA token.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: smartctl-exporter-0
            patch: |-
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: smartctl-exporter-0
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
