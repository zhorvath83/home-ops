---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
# Same namespace as the Grafana instance → no cross-namespace import.
# Dashboard 24922 over 22604: it adds a SATA row driven by smartctl_device_attribute, so the
# ATA disk on the NAS is covered alongside the NVMe drives. Datasource input is DS_PROMETHEUS.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: smartctl-exporter
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderRef: observability
  url: https://grafana.com/api/dashboards/24922/revisions/1/download
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus
