---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: openwrt
spec:
  # jobName controls the `job` label (the operator owns the rendered job_name); the
  # grafana.com 18153 OpenWRT dashboard filters on job=openwrt.
  jobName: openwrt
  staticConfigs:
    - targets:
        - "${ROUTER_IP}:9100"
  metricRelabelings:
    - sourceLabels:
        - __name__
      regex: "^go_.*"
      action: drop
    # V4: drop node_network interface metadata (no dashboard consumer; the grafana
    # 18153 OpenWRT dashboard uses traffic families, not metadata).
    - sourceLabels:
        - __name__
      regex: "^node_network_(flags|device_id|dormant|iface_link_mode|transmit_queue_length|carrier.*|address_assign_type|name_assign_type|net_dev_group|protocol_type)"
      action: drop
