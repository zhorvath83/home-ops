---
# yaml-language-server: $schema=https://json.schemastore.org/prometheus.rules.test.json
# promtool unit tests for prometheusrules/node-temperature.yaml.
# Two coretemp sensors (package + one core) prove the max-by-instance aggregation; an NVMe sensor
# above its own max proves the coretemp chip filter. Thresholds mirror the live k8s-cp0 values
# (max 80, crit 100). Run via `just k8s test-prom-rules`.
rule_files:
  - ./.extracted_prometheus_rules.yaml
evaluation_interval: 1m
tests:
  # === NodeCPUTemperatureHigh ===
  # (1) Positive + `>=` boundary: the core sits exactly at max (80) for 16m, the package below.
  # Fires after `for: 15m`; $value is the hottest sensor. NVMe at 90 > its 83 max is ignored.
  - interval: 1m
    input_series:
      - series: 'node_hwmon_temp_celsius{instance="n1:9100",chip="platform_coretemp_0",sensor="temp1"}'
        values: '70x20'
      - series: 'node_hwmon_temp_celsius{instance="n1:9100",chip="platform_coretemp_0",sensor="temp2"}'
        values: '80x20'
      - series: 'node_hwmon_temp_max_celsius{instance="n1:9100",chip="platform_coretemp_0",sensor="temp1"}'
        values: '80x20'
      - series: 'node_hwmon_temp_max_celsius{instance="n1:9100",chip="platform_coretemp_0",sensor="temp2"}'
        values: '80x20'
      - series: 'node_hwmon_temp_crit_celsius{instance="n1:9100",chip="platform_coretemp_0",sensor="temp2"}'
        values: '100x20'
      - series: 'node_hwmon_temp_celsius{instance="n1:9100",chip="nvme_nvme0",sensor="temp1"}'
        values: '90x20'
      - series: 'node_hwmon_temp_max_celsius{instance="n1:9100",chip="nvme_nvme0",sensor="temp1"}'
        values: '83x20'
    alert_rule_test:
      - eval_time: 14m
        alertname: NodeCPUTemperatureHigh
        exp_alerts: []
      - eval_time: 16m
        alertname: NodeCPUTemperatureHigh
        exp_alerts:
          - exp_labels:
              alertname: NodeCPUTemperatureHigh
              severity: warning
              instance: n1:9100
            exp_annotations:
              summary: Node CPU temperature above the sensor high threshold
              description: |-
                The hottest CPU sensor on n1:9100 is at 80 C, at or above its
                high threshold for 15 minutes. Check fan, airflow and dust before it reaches the
                critical threshold and the CPU starts thermal throttling.
      - eval_time: 16m
        alertname: NodeCPUTemperatureCritical
        exp_alerts: []
  # (2) Negative + boundary NO-fire: one degree below max for the whole window, and the NVMe
  # sensor over its own max alone does not fire either.
  - interval: 1m
    input_series:
      - series: 'node_hwmon_temp_celsius{instance="n1:9100",chip="platform_coretemp_0",sensor="temp1"}'
        values: '79x20'
      - series: 'node_hwmon_temp_max_celsius{instance="n1:9100",chip="platform_coretemp_0",sensor="temp1"}'
        values: '80x20'
      - series: 'node_hwmon_temp_crit_celsius{instance="n1:9100",chip="platform_coretemp_0",sensor="temp1"}'
        values: '100x20'
      - series: 'node_hwmon_temp_celsius{instance="n1:9100",chip="nvme_nvme0",sensor="temp1"}'
        values: '90x20'
      - series: 'node_hwmon_temp_max_celsius{instance="n1:9100",chip="nvme_nvme0",sensor="temp1"}'
        values: '83x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: NodeCPUTemperatureHigh
        exp_alerts: []
      - eval_time: 16m
        alertname: NodeCPUTemperatureCritical
        exp_alerts: []
  # === NodeCPUTemperatureCritical ===
  # (3) Positive + `>=` boundary: the package reaches crit (100) at 5m and holds; fires after
  # `for: 2m`, not before.
  - interval: 1m
    input_series:
      - series: 'node_hwmon_temp_celsius{instance="n1:9100",chip="platform_coretemp_0",sensor="temp1"}'
        values: '75x5 100x10'
      - series: 'node_hwmon_temp_max_celsius{instance="n1:9100",chip="platform_coretemp_0",sensor="temp1"}'
        values: '80x15'
      - series: 'node_hwmon_temp_crit_celsius{instance="n1:9100",chip="platform_coretemp_0",sensor="temp1"}'
        values: '100x15'
    alert_rule_test:
      - eval_time: 6m
        alertname: NodeCPUTemperatureCritical
        exp_alerts: []
      - eval_time: 8m
        alertname: NodeCPUTemperatureCritical
        exp_alerts:
          - exp_labels:
              alertname: NodeCPUTemperatureCritical
              severity: critical
              instance: n1:9100
            exp_annotations:
              summary: Node CPU temperature at the sensor critical threshold
              description: |-
                The hottest CPU sensor on n1:9100 is at 100 C, at or above its
                critical threshold. The CPU is thermal throttling and the node may shut down.
  # (4) Negative boundary: one degree below crit does not fire Critical.
  - interval: 1m
    input_series:
      - series: 'node_hwmon_temp_celsius{instance="n1:9100",chip="platform_coretemp_0",sensor="temp1"}'
        values: '99x15'
      - series: 'node_hwmon_temp_crit_celsius{instance="n1:9100",chip="platform_coretemp_0",sensor="temp1"}'
        values: '100x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: NodeCPUTemperatureCritical
        exp_alerts: []
