---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: grafana
spec:
  selector:
    matchLabels:
      dashboards: grafana
  endpoints:
    - port: grafana
      metricRelabelings:
        # P1.3: drop all grafana self-observability metrics (no dashboard/rule
        # consumes grafana_*; we run no Grafana-internal dashboard).
        - sourceLabels:
            - "__name__"
          regex: "grafana_.*"
          action: drop
        - sourceLabels:
            - "__name__"
          regex: "^go_.*"
          action: drop
