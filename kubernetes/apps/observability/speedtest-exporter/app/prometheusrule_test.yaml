---
# yaml-language-server: $schema=https://json.schemastore.org/prometheus.rules.test.json
# promtool unit tests for app/prometheusrule.yaml, covering the four speedtest alerts.
#
# speedtest-exporter scrapes every 20m, so the speedtest_* gauges are stale ~15m of each cycle and
# the alerts use range aggregation (absent_over_time / max_over_time / min_over_time) sized to that
# cadence. promtool does NOT model the 5m Prometheus staleness (samples placed via values: are
# "present" at their timestamps), so these tests validate the WINDOW LOGIC of the range functions
# with dense 1m samples and healthy-prefix-then-degradation transitions (same idiom as the crowdsec
# blocklist max_over_time[50h] / absent_over_time[26h] tests). The live staleness-robustness is a
# property of the range functions reading the TSDB, not something the unit test exercises.
#
# Windows: absent_over_time[30m] (30m > 20m interval + jitter); max/min_over_time[40m] (40m = 2x
# interval -> last 2 scrapes). The threshold alerts have NO `for:` — the 40m window is the gate, so
# a fire case models a healthy prefix (above-threshold, or low-latency for ping) for 40m then the
# degraded value for >=41m; the alert first fires at t=80m (40m after degradation starts, when the
# last healthy sample ages out of the window) -> eval at 81m. exp_annotations asserted so a broken
# template fails the suite. The speedtest_* gauges carry {endpoint, instance="speedtest", job,
# namespace, service} (pod dropped by the serviceMonitor metricRelabeling); max/min_over_time keep
# these labels. absent_over_time carries only the selector label (job).
# Run via `just k8s test-prom-rules` (recipe copies this test + .extracted_prometheus_rules.yaml into a temp dir).
rule_files:
  - ./.extracted_prometheus_rules.yaml
evaluation_interval: 1m
tests:
  # === SpeedtestExporterAbsent === absent_over_time(up{job="speedtest-exporter"}[30m]), no for:.
  # absent_over_time carries the selector's job label -> exp_labels carry alertname + severity + job.
  # 30m = 30m. With no series at all the range is empty at any eval (fires immediately); the 30m
  # window gates only the "was present, then stopped" boundary case (c).
  # (a) Fire: no up series at all. absent_over_time[30m] returns {job=speedtest-exporter}=1; fires.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 31m
        alertname: SpeedtestExporterAbsent
        exp_alerts:
          - exp_labels:
              alertname: SpeedtestExporterAbsent
              severity: critical
              job: speedtest-exporter
            exp_annotations:
              summary: "speedtest-exporter has disappeared from Prometheus target discovery"
              description: "No up sample for the speedtest-exporter scrape target in the last 30m (absent_over_time[30m]) — internet-link monitoring is blind (no download/upload/ping data flowing). 30m is greater than the 20m scrape interval plus jitter, so a single late scrape does not fire."
  # (b) No-fire: up is present (value 1) across the 30m window — absent_over_time is empty, quiet at 31m.
  - interval: 1m
    input_series:
      - series: 'up{job="speedtest-exporter"}'
        values: '1x32'
    alert_rule_test:
      - eval_time: 31m
        alertname: SpeedtestExporterAbsent
        exp_alerts: []
  # (c) 30m-window boundary pin: a single up sample at t=0, then nothing. At eval 29m the sample is
  # still inside [t-30m,t] -> absent_over_time empty -> no fire. At eval 31m the sample has aged out
  # -> absent_over_time=1 -> fires. Pins the 30m range window.
  - interval: 1m
    input_series:
      - series: 'up{job="speedtest-exporter"}'
        values: '1'
    alert_rule_test:
      - eval_time: 29m
        alertname: SpeedtestExporterAbsent
        exp_alerts: []
      - eval_time: 31m
        alertname: SpeedtestExporterAbsent
        exp_alerts:
          - exp_labels:
              alertname: SpeedtestExporterAbsent
              severity: critical
              job: speedtest-exporter
            exp_annotations:
              summary: "speedtest-exporter has disappeared from Prometheus target discovery"
              description: "No up sample for the speedtest-exporter scrape target in the last 30m (absent_over_time[30m]) — internet-link monitoring is blind (no download/upload/ping data flowing). 30m is greater than the 20m scrape interval plus jitter, so a single late scrape does not fire."
  # === SpeedtestSlowInternetDownload === max_over_time(speedtest_download_bits_per_second[40m]) < 500000000, no for:.
  # 40m = 2x the 20m interval -> last 2 scrapes. max_over_time < threshold means BOTH scrapes in the
  # window are below (the higher one is still below). exp_labels carry the gauge labels + alertname/severity.
  # (d) Fire: healthy 6e8 for 40m, then 4e8 (<5e8) for 42m. max_over_time[40m]==4e8 first holds at t=80m
  # (40m after degradation starts, last healthy 6e8 ages out); eval at 81m -> firing.
  - interval: 1m
    input_series:
      - series: 'speedtest_download_bits_per_second{endpoint="http",instance="speedtest",job="speedtest-exporter",namespace="observability",service="speedtest-exporter"}'
        values: '600000000x40 400000000x42'
    alert_rule_test:
      - eval_time: 81m
        alertname: SpeedtestSlowInternetDownload
        exp_alerts:
          - exp_labels:
              alertname: SpeedtestSlowInternetDownload
              severity: warning
              endpoint: http
              instance: speedtest
              job: speedtest-exporter
              namespace: observability
              service: speedtest-exporter
            exp_annotations:
              summary: "Internet download speed below 500 Mbit/s"
              description: "speedtest-exporter reports download below 500 Mbit/s (5e8 bit/s) across the last 2 scrapes (max_over_time[40m] < 5e8; 40m = 2x the 20m scrape interval). A single transient slow scrape does not fire — both scrapes in the window must be below."
  # (e) No-fire healthy: 6e8 throughout — max_over_time[40m]=6e8, condition false, quiet at 81m.
  - interval: 1m
    input_series:
      - series: 'speedtest_download_bits_per_second{endpoint="http",instance="speedtest",job="speedtest-exporter",namespace="observability",service="speedtest-exporter"}'
        values: '600000000x82'
    alert_rule_test:
      - eval_time: 81m
        alertname: SpeedtestSlowInternetDownload
        exp_alerts: []
  # (f) No-fire transient: 6e8 for 40m, then 4e8 for 20m (one slow scrape period), then 6e8 (recovered).
  # The 20m of 4e8 can never fill a 40m all-low window while prior/after 6e8 samples are still in it,
  # so max_over_time[40m] stays 6e8 and the alert never fires — a single transient slow scrape does not page.
  - interval: 1m
    input_series:
      - series: 'speedtest_download_bits_per_second{endpoint="http",instance="speedtest",job="speedtest-exporter",namespace="observability",service="speedtest-exporter"}'
        values: '600000000x40 400000000x20 600000000x22'
    alert_rule_test:
      - eval_time: 81m
        alertname: SpeedtestSlowInternetDownload
        exp_alerts: []
  # (g) No-fire boundary: 6e8 for 40m, then exactly 5e8 (the threshold) for 42m. max_over_time[40m]=5e8,
  # strict `<` does not fire at the threshold.
  - interval: 1m
    input_series:
      - series: 'speedtest_download_bits_per_second{endpoint="http",instance="speedtest",job="speedtest-exporter",namespace="observability",service="speedtest-exporter"}'
        values: '600000000x40 500000000x42'
    alert_rule_test:
      - eval_time: 81m
        alertname: SpeedtestSlowInternetDownload
        exp_alerts: []
  # === SpeedtestSlowInternetUpload === max_over_time(speedtest_upload_bits_per_second[40m]) < 200000000, no for:.
  # (h) Fire: healthy 3e8 for 40m, then 1e8 (<2e8) for 42m. Fires at 81m.
  - interval: 1m
    input_series:
      - series: 'speedtest_upload_bits_per_second{endpoint="http",instance="speedtest",job="speedtest-exporter",namespace="observability",service="speedtest-exporter"}'
        values: '300000000x40 100000000x42'
    alert_rule_test:
      - eval_time: 81m
        alertname: SpeedtestSlowInternetUpload
        exp_alerts:
          - exp_labels:
              alertname: SpeedtestSlowInternetUpload
              severity: warning
              endpoint: http
              instance: speedtest
              job: speedtest-exporter
              namespace: observability
              service: speedtest-exporter
            exp_annotations:
              summary: "Internet upload speed below 200 Mbit/s"
              description: "speedtest-exporter reports upload below 200 Mbit/s (2e8 bit/s) across the last 2 scrapes (max_over_time[40m] < 2e8; 40m = 2x the 20m scrape interval). A single transient slow scrape does not fire — both scrapes in the window must be below."
  # (i) No-fire healthy: 3e8 throughout, quiet at 81m.
  - interval: 1m
    input_series:
      - series: 'speedtest_upload_bits_per_second{endpoint="http",instance="speedtest",job="speedtest-exporter",namespace="observability",service="speedtest-exporter"}'
        values: '300000000x82'
    alert_rule_test:
      - eval_time: 81m
        alertname: SpeedtestSlowInternetUpload
        exp_alerts: []
  # (j) No-fire transient: 3e8 for 40m, 1e8 for 20m, 3e8 for 22m — single slow period, never fires at 81m.
  - interval: 1m
    input_series:
      - series: 'speedtest_upload_bits_per_second{endpoint="http",instance="speedtest",job="speedtest-exporter",namespace="observability",service="speedtest-exporter"}'
        values: '300000000x40 100000000x20 300000000x22'
    alert_rule_test:
      - eval_time: 81m
        alertname: SpeedtestSlowInternetUpload
        exp_alerts: []
  # (k) No-fire boundary: 3e8 for 40m, then exactly 2e8 for 42m. max_over_time[40m]=2e8, strict `<` does not fire.
  - interval: 1m
    input_series:
      - series: 'speedtest_upload_bits_per_second{endpoint="http",instance="speedtest",job="speedtest-exporter",namespace="observability",service="speedtest-exporter"}'
        values: '300000000x40 200000000x42'
    alert_rule_test:
      - eval_time: 81m
        alertname: SpeedtestSlowInternetUpload
        exp_alerts: []
  # === SpeedtestHighPingLatency === min_over_time(speedtest_ping_latency_milliseconds[40m]) > 20, no for:.
  # min_over_time > 20 means BOTH scrapes in the window are above 20 (the lower one is still above).
  # min is used (not max) so a single low-latency scrape in the window keeps it quiet.
  # (l) Fire: healthy 15 for 40m, then 25 (>20) for 42m. min_over_time[40m]==25 first holds at t=80m; eval 81m.
  - interval: 1m
    input_series:
      - series: 'speedtest_ping_latency_milliseconds{endpoint="http",instance="speedtest",job="speedtest-exporter",namespace="observability",service="speedtest-exporter"}'
        values: '15x40 25x42'
    alert_rule_test:
      - eval_time: 81m
        alertname: SpeedtestHighPingLatency
        exp_alerts:
          - exp_labels:
              alertname: SpeedtestHighPingLatency
              severity: warning
              endpoint: http
              instance: speedtest
              job: speedtest-exporter
              namespace: observability
              service: speedtest-exporter
            exp_annotations:
              summary: "Internet ping latency above 20 ms"
              description: "speedtest-exporter reports ping above 20 ms across the last 2 scrapes (min_over_time[40m] > 20; 40m = 2x the 20m scrape interval). min_over_time is used so a single low-latency scrape in the window keeps it quiet — both scrapes must be high to fire."
  # (m) No-fire healthy: 15 throughout, quiet at 81m.
  - interval: 1m
    input_series:
      - series: 'speedtest_ping_latency_milliseconds{endpoint="http",instance="speedtest",job="speedtest-exporter",namespace="observability",service="speedtest-exporter"}'
        values: '15x82'
    alert_rule_test:
      - eval_time: 81m
        alertname: SpeedtestHighPingLatency
        exp_alerts: []
  # (n) No-fire transient: 15 for 40m, 25 for 20m (one high-latency scrape period), 15 for 22m. The 20m
  # of 25 can never fill a 40m all-high window while prior/after 15 samples are in it, so min_over_time
  # stays 15 and the alert never fires — a single transient high-ping scrape does not page.
  - interval: 1m
    input_series:
      - series: 'speedtest_ping_latency_milliseconds{endpoint="http",instance="speedtest",job="speedtest-exporter",namespace="observability",service="speedtest-exporter"}'
        values: '15x40 25x20 15x22'
    alert_rule_test:
      - eval_time: 81m
        alertname: SpeedtestHighPingLatency
        exp_alerts: []
  # (o) No-fire boundary: 15 for 40m, then exactly 20 for 42m. min_over_time[40m]=20, strict `>` does not fire.
  - interval: 1m
    input_series:
      - series: 'speedtest_ping_latency_milliseconds{endpoint="http",instance="speedtest",job="speedtest-exporter",namespace="observability",service="speedtest-exporter"}'
        values: '15x40 20x42'
    alert_rule_test:
      - eval_time: 81m
        alertname: SpeedtestHighPingLatency
        exp_alerts: []
