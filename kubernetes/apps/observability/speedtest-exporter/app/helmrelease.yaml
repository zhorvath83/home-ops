---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: speedtest-exporter
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    # heathcliff26/speedtest-exporter: config file is optional — without the -config arg
    # below it silently runs all-defaults (port 8080, cache 5m).
    configMaps:
      config:
        enabled: true
        includeInChecksum: true
        data:
          config.yaml: |-
            logLevel: info
            port: 9798
            instance: speedtest
            # cache <= scrape interval: a failed result is cached for the full TTL
            cache: 20m
            persistCache: true
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # AD-023 vocabulary: prometheus scrape + internet egress (allow-world) — not envoy-routed (scrape-only)
      labels:
        ingress.home.arpa/allow-prometheus: "true"
        egress.home.arpa/allow-world: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      speedtest-exporter:
        type: deployment
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/heathcliff26/speedtest-exporter
              tag: v1.8.0
            args:
              - -config
              - /config/config.yaml
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 32Mi
              limits:
                memory: 128Mi
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /config
      # exporter cache file path is hardcoded to /cache/speedtest-result.json
      cache:
        type: emptyDir
        globalMounts:
          - path: /cache
    service:
      app:
        controller: speedtest-exporter
        ports:
          http:
            port: 9798
    serviceMonitor:
      app:
        serviceName: speedtest-exporter
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 20m
            scrapeTimeout: 5m
            relabelings:
              - sourceLabels: []
                targetLabel: instance
                replacement: speedtest
            metricRelabelings:
              - action: labeldrop
                # ip/isp change with the WAN IP — dropping avoids a new series per IP change
                regex: (ip|isp|pod)
