---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vmalert-logs
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: vmalert-logs
  values:
    global:
      image:
        registry: quay.io
    # Stateless rule evaluator, no Kubernetes API need.
    serviceAccount:
      create: true
      automountToken: false
    server:
      fullnameOverride: vmalert-logs
      # AD-023: custom-egress (VictoriaLogs + Alertmanager only, ciliumnetworkpolicy.yaml) + prometheus scrape via CCNP.
      podLabels:
        egress.home.arpa/custom-egress: "true"
        ingress.home.arpa/allow-prometheus: "true"
      datasource:
        url: http://victoria-logs-server.observability.svc.cluster.local:9428
      notifier:
        url: http://alertmanager-operated.observability.svc.cluster.local:9093
      # Rules come from the kustomize-generated ConfigMap; configCheckInterval reloads them without a
      # restart, and a failed reload keeps the old rules (VMAlertLogsConfigReloadFailed).
      configMap: vmalert-logs-rules
      extraArgs:
        rule.defaultRuleType: vlogs
        configCheckInterval: 1m
        external.label: source=vmalert-logs
      podSecurityContext:
        enabled: true
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        enabled: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    serviceMonitor:
      enabled: true
