---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-pushgateway
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: prometheus-pushgateway
  values:
    replicaCount: 1
    # StatefulSet + PVC so pushed metrics survive a pod restart — otherwise a restart
    # blanks the blocklist-import freshness signal and false-fires CrowdSecBlocklistImportMetricsAbsent.
    runAsStatefulSet: true
    persistentVolume:
      enabled: true
      size: 1Gi
      storageClass: democratic-csi-local-hostpath
    automountServiceAccountToken: false
    serviceAccount:
      create: false
    podLabels:
      ingress.home.arpa/allow-prometheus: "true"
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    # namespace: chart defaults serviceMonitor.namespace to "monitoring", which does not
    # exist here -> Helm upgrade fails (HIBA 2). Release namespace instead.
    # honorLabels: retain the pushed job="crowdsec-blocklist-import" label so the
    # CrowdSecBlocklistImport* rule selectors match; without it Prometheus overwrites
    # job with the scrape target's and the alerts never fire.
    serviceMonitor:
      enabled: true
      namespace: observability
      honorLabels: true
