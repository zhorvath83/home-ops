---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/httproutefilter_v1alpha1.json
# pocket-id admin API hardening not usable from the public gateway.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: pocket-id-deny-403
spec:
  directResponse:
    contentType: text/plain
    statusCode: 403
    body:
      type: Inline
      inline: "Forbidden\n"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pocket-id-external
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Pocket-ID
    gethomepage.dev/group: Security
    gethomepage.dev/icon: pocket-id.svg
spec:
  hostnames:
    - "id.${PUBLIC_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: networking
      sectionName: https
  rules:
    # Bootstrap / signup paths — first-run only, not needed once IdP is set up.
    - matches:
        - path:
            type: PathPrefix
            value: /setup
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: pocket-id-deny-403
    - matches:
        - path:
            type: PathPrefix
            value: /signup
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: pocket-id-deny-403
    - matches:
        - path:
            type: PathPrefix
            value: /st/
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: pocket-id-deny-403
    - matches:
        - path:
            type: PathPrefix
            value: /api/signup
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: pocket-id-deny-403
    # Standing admin API token — never usable from the public gateway.
    - matches:
        - path:
            type: PathPrefix
            value: /
          headers:
            - type: RegularExpression
              name: X-API-KEY
              value: .+
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: pocket-id-deny-403
    # Everything else (OIDC protocol, UI, admin UI cookie calls, self-service) → backend.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pocket-id
          port: 1411
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pocket-id-internal
spec:
  hostnames:
    - "id.${PUBLIC_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: networking
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pocket-id
          port: 1411
