---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # AD-023 vocabulary: envoy-routed (allow-gateway-external + -internal) + prometheus scrape (ServiceMonitor)
      labels:
        ingress.home.arpa/allow-gateway-external: "true"
        ingress.home.arpa/allow-gateway-internal: "true"
        ingress.home.arpa/allow-prometheus: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      pocket-id:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # renovate: datasource=docker depName=ghcr.io/pocket-id/pocket-id
              repository: ghcr.io/pocket-id/pocket-id
              tag: v2.13.0-distroless@sha256:ccb590169770feb5b23ba16d49386514a2c26a77e95bb687b442ae09f17c15da
            env:
              APP_URL: "https://idm.${PUBLIC_DOMAIN}"
              PORT: &port 1411
              HOST: 0.0.0.0
              # pocket-id v2.11 reads TLS_CERT/TLS_KEY as file PATHS, not base64
              TLS_CERT: /certs/tls.crt
              TLS_KEY: /certs/tls.key
              DB_CONNECTION_STRING: "/app/data/pocket-id.db"
              # GeoLite2 mmdb is auto-refreshed on startup + by a cron job; keep it
              # out of the backed-up PVC.
              GEOLITE_DB_PATH: "/app/geolite/GeoLite2-City.mmdb"
              TRUST_PROXY: "10.244.0.0/16"
              ALLOW_INSECURE_CALLBACK_URLS: "false"
              ANALYTICS_DISABLED: "true"
              VERSION_CHECK_DISABLED: "true"
              LOG_LEVEL: info
              LOG_JSON: "true"
              # OTel metrics
              METRICS_ENABLED: "true"
              OTEL_METRICS_EXPORTER: "prometheus"
              OTEL_EXPORTER_PROMETHEUS_HOST: "0.0.0.0"
              OTEL_EXPORTER_PROMETHEUS_PORT: "9464"
            envFrom:
              - secretRef:
                  name: pocket-id-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                    scheme: HTTPS
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 20m
                memory: 96Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: pocket-id
        ports:
          http:
            port: *port
          metrics:
            port: 9464
            targetPort: 9464
    serviceMonitor:
      app:
        serviceName: pocket-id
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
    persistence:
      data:
        existingClaim: pocket-id
        advancedMounts:
          pocket-id:
            app:
              - path: /app/data
      geolite:
        type: emptyDir
        advancedMounts:
          pocket-id:
            app:
              - path: /app/geolite
      tmp:
        type: emptyDir
      certs:
        type: secret
        name: pocket-id-tls
        defaultMode: 0400
        advancedMounts:
          pocket-id:
            app:
              - path: /certs
