---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # AD-023 vocabulary: envoy-routed (allow-gateway-external + -internal) + prometheus scrape (ServiceMonitor)
      labels:
        ingress.home.arpa/allow-gateway-external: "true"
        ingress.home.arpa/allow-gateway-internal: "true"
        ingress.home.arpa/allow-prometheus: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      pocket-id:
        annotations:
          # cert-sync sidecar re-syncs pocket-id-tls into /certs hourly (atomic mv);
          # pocket-id fsnotify reloads — no pod restart on cert rotation.
          reloader.stakater.com/secret: "pocket-id-secret"
        initContainers:
          cert-seed:
            image:
              repository: public.ecr.aws/docker/library/busybox
              tag: 1.38.0
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              limits:
                memory: 32Mi
            command:
              - "/bin/sh"
              - "-c"
            args:
              - |
                [ -f /certs-src/tls.crt ] && [ -f /certs-src/tls.key ] || { echo "cert source missing"; exit 1; }
                cp /certs-src/tls.crt /certs/tls.crt
                cp /certs-src/tls.key /certs/tls.key
                echo "cert seeded"
        containers:
          app:
            image:
              # renovate: datasource=docker depName=ghcr.io/pocket-id/pocket-id
              repository: ghcr.io/pocket-id/pocket-id
              tag: v2.14.0-distroless@sha256:e0f83a42a78d0759b6d2d8c7380ef0fa8a4c95dfa01ad88740a073ae9cc4ba94
            env:
              APP_URL: "https://idm.${PUBLIC_DOMAIN}"
              PORT: &port 1411
              HOST: 0.0.0.0
              TLS_CERT_FILE: /certs/tls.crt
              TLS_KEY_FILE: /certs/tls.key
              DB_CONNECTION_STRING: "/app/data/pocket-id.db"
              # GeoLite2 mmdb is auto-refreshed on startup + by a cron job; keep it
              # out of the backed-up PVC.
              GEOLITE_DB_PATH: "/app/geolite/GeoLite2-City.mmdb"
              TRUST_PROXY: "10.244.0.0/16"
              ALLOW_INSECURE_CALLBACK_URLS: "false"
              ANALYTICS_DISABLED: "true"
              VERSION_CHECK_DISABLED: "true"
              LOG_LEVEL: info
              LOG_JSON: "true"
              # OTel metrics
              METRICS_ENABLED: "true"
              OTEL_METRICS_EXPORTER: "prometheus"
              OTEL_EXPORTER_PROMETHEUS_HOST: "0.0.0.0"
              OTEL_EXPORTER_PROMETHEUS_PORT: "9464"
              # UI_CONFIG_DISABLED=true makes env override the admin UI for every setting
              # below; each override var is pinned so the global override is deterministic.
              UI_CONFIG_DISABLED: "true"
              APP_NAME: "IdP"
              SESSION_DURATION: "60"
              HOME_PAGE_URL: "/settings/account"
              REQUIRE_USER_EMAIL: "true"
              # true: OIDC clients (mealie, wallos) require a verified-email claim;
              # passkey is the actual auth, so this is safe.
              EMAILS_VERIFIED: "true"
              ALLOW_OWN_ACCOUNT_EDIT: "true"
              ALLOW_USER_SIGNUPS: "disabled"
              DISABLE_ANIMATIONS: "false"
              ACCENT_COLOR: "default"
              # LDAP unused here; gate off (attribute maps left to defaults).
              LDAP_ENABLED: "false"
              EMAIL_LOGIN_NOTIFICATION_ENABLED: "true"
              EMAIL_ONE_TIME_ACCESS_AS_ADMIN_ENABLED: "true"
              EMAIL_API_KEY_EXPIRATION_ENABLED: "true"
              EMAIL_VERIFICATION_ENABLED: "true"
              # Passkey-only posture: do not enable the email-code login bypass.
              EMAIL_ONE_TIME_ACCESS_AS_UNAUTHENTICATED_ENABLED: "false"
              # WebAuthn policy is also overridden by UI_CONFIG_DISABLED; pin to defaults.
              WEBAUTHN_USER_VERIFICATION: "required"
              WEBAUTHN_ALLOW_SYNCED_PASSKEYS: "true"
              WEBAUTHN_AUTHENTICATOR_ATTACHMENT: "any"
              # Keep Client ID Metadata Document clients disabled.
              CIMD_URL_ALLOWLIST: "[]"
            envFrom:
              - secretRef:
                  name: pocket-id-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                    scheme: HTTPS
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 20m
                memory: 96Mi
              limits:
                memory: 512Mi
          cert-sync:
            image:
              repository: public.ecr.aws/docker/library/busybox
              tag: 1.38.0
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 5m
                memory: 8Mi
              limits:
                memory: 32Mi
            command:
              - "/bin/sh"
              - "-c"
            args:
              - |
                sync_cert() {
                  [ -f /certs-src/tls.crt ] && [ -f /certs-src/tls.key ] || { echo "cert source missing"; return 1; }
                  if ! cmp -s /certs-src/tls.crt /certs/tls.crt; then
                    cp /certs-src/tls.crt /certs/.tls.crt.tmp && mv -f /certs/.tls.crt.tmp /certs/tls.crt
                    echo "tls.crt updated"
                  fi
                  if ! cmp -s /certs-src/tls.key /certs/tls.key; then
                    cp /certs-src/tls.key /certs/.tls.key.tmp && mv -f /certs/.tls.key.tmp /certs/tls.key
                    echo "tls.key updated"
                  fi
                  return 0
                }
                sync_cert
                while true; do sleep 3600; sync_cert; done
    service:
      app:
        controller: pocket-id
        ports:
          http:
            port: *port
          metrics:
            port: 9464
            targetPort: 9464
    serviceMonitor:
      app:
        serviceName: pocket-id
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
            metricRelabelings:
              - sourceLabels:
                  - __name__
                regex: "http_server_request_body_size_bytes_(bucket|sum|count)|http_server_response_body_size_bytes_(bucket|sum|count)|http_server_request_duration_seconds_(bucket|sum|count)|http_client_request_.*_(bucket|sum|count)"
                action: drop
    persistence:
      data:
        existingClaim: pocket-id
        advancedMounts:
          pocket-id:
            app:
              - path: /app/data
      geolite:
        type: emptyDir
        advancedMounts:
          pocket-id:
            app:
              - path: /app/geolite
      tmp:
        type: emptyDir
      certs-runtime:
        type: emptyDir
        globalMounts:
          - path: /certs
      certs-src:
        type: secret
        name: pocket-id-tls
        defaultMode: 0400
        advancedMounts:
          pocket-id:
            cert-seed:
              - path: /certs-src
                readOnly: true
            cert-sync:
              - path: /certs-src
                readOnly: true
