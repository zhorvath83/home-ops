---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pocket-id-secret
    creationPolicy: Owner
    template:
      data:
        ENCRYPTION_KEY: "{{ .POCKET_ID_ENCRYPTION_KEY }}"
        MAXMIND_LICENSE_KEY: "{{ .MAXMIND_LICENSE_KEY }}"
        # SMTP2GO relay (shared HomeOps/smtp2go item); port 465 is implicit TLS, so SMTP_TLS=tls.
        SMTP_HOST: "{{ .smtp2go_smtp_hostname }}"
        SMTP_PORT: "{{ .smtp2go_smtp_port }}"
        SMTP_FROM: "{{ .smtp2go_smtp_from }}"
        SMTP_USER: "{{ .smtp2go_smtp_user }}"
        SMTP_PASSWORD: "{{ .smtp2go_smtp_password }}"
        SMTP_TLS: "tls"
        SMTP_SKIP_CERT_VERIFY: "false"
  dataFrom:
    - extract:
        key: pocket-id
    - extract:
        key: maxmind
    - extract:
        key: smtp2go
      rewrite:
        - regexp:
            source: "(.*)"
            target: "smtp2go_$1"
