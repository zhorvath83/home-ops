---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  # Shared Postgres for apps needing a real SQL server (currently sure only).
  # pg_dumpall for backups authenticates via the operator-managed postgres-superuser secret.
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie@sha256:39add80f5b1e573e2f6b641c66fd1a2f8dede67ca0330e870285bc1078551390
  instances: 1
  enableSuperuserAccess: true
  inheritedMetadata:
    labels:
      ingress.home.arpa/allow-prometheus: "true"
  storage:
    size: 10Gi
    storageClass: democratic-csi-local-hostpath
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 1Gi
