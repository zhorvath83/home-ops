---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Daily pg_dumpall to the NAS /backups plane; resticprofile carries it offsite (01:00 run
# includes the fresh dump). No PITR: worst case 1 day of data loss, restore is manual.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres-backup
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    controllers:
      backup:
        type: cronjob
        cronjob:
          concurrencyPolicy: Forbid
          schedule: "17 0 * * *"
          suspend: false
          successfulJobsHistory: 1
          failedJobsHistory: 3
        containers:
          app:
            image:
              repository: ghcr.io/cloudnative-pg/postgresql
              tag: 18-standard-trixie@sha256:79be0d10e78b7ac4520cf6c5db199a8bb7f6de53b3229f47e90cab5865528a0d
            env:
              PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: postgres-superuser
                    key: password
            command:
              - /bin/bash
              - "-c"
              - |
                set -euo pipefail
                mkdir -p /backups/postgres
                # write to .partial first so a failed dump never counts toward the 14 kept files
                out="/backups/postgres/postgres-$(date +%F).sql.gz"
                pg_dumpall -h postgres-rw -U postgres | gzip > "${out}.partial"
                mv "${out}.partial" "${out}"
                # keep the newest 14 dumps locally; older ones stay in the resticprofile history
                ls -1t /backups/postgres/postgres-*.sql.gz | tail -n +15 | xargs -r rm -f
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 5m
                memory: 64Mi
              limits:
                memory: 256Mi
    persistence:
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
      backups:
        type: nfs
        server: ${NAS_IP}
        path: /backups
        globalMounts:
          - path: /backups
