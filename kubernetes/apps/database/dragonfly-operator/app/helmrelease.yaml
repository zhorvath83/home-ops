---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dragonfly-operator
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: dragonfly-operator
  values:
    # No CNP: the manager only talks to the API server and its webhook (baseline in-cluster egress).
    manager:
      resources:
        requests:
          cpu: 5m
          memory: 64Mi
        limits:
          memory: 256Mi
