---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# homepage (AD-023): envoy ingress via the ingress-from-gateway-external + -internal CCNPs; custom-egress opt-out makes this CNP the sole egress source.
# OIDC to the public issuer rides the allow-gateways CCNP (envoy-internal :10443); DNS rides allow-dns-egress.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homepage
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: homepage
      app.kubernetes.io/instance: homepage
      app.kubernetes.io/controller: homepage
  egress:
    # Kubernetes API: mode-cluster HTTPRoute discovery, pod-selector status dots, and the resources widget via metrics.k8s.io.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP
    # OpenWeatherMap: the weather widget is server-side, it holds the API token.
    - toFQDNs:
        - matchName: "api.openweathermap.org"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
