---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wallos
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # AD-023 vocabulary: envoy-routed (ingress-from-gateway-external + -internal CCNPs) + internet egress (allow-world-egress CCNP)
      labels:
        ingress.home.arpa/allow-gateway-external: "true"
        ingress.home.arpa/allow-gateway-internal: "true"
        egress.home.arpa/allow-world: "true"
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      wallos:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/ellite/wallos
              tag: 5.4.2@sha256:316f26e13265958e7946ef98ff600516fddc51d698ee98bd1ae1577e5e00789f
            env:
              PUID: 1000
              PGID: 1000
              # OIDC via Pocket ID (passkey-only). Secret via envFrom wallos-secret.
              # OIDC_ISSUER triggers .well-known discovery; group enforcement at the IdP (infra_admins).
              OIDC_ENABLED: "true"
              OIDC_PROVIDER_NAME: "IdM"
              OIDC_CLIENT_ID: "wallos"
              OIDC_ISSUER: "https://idm.${PUBLIC_DOMAIN}"
              OIDC_REDIRECT_URL: "https://subscriptions.${PUBLIC_DOMAIN}"
              # end_session_endpoint is not in wallos' discovery map, so set it explicitly.
              OIDC_LOGOUT_URL: "https://idm.${PUBLIC_DOMAIN}/api/oidc/end-session"
              OIDC_USER_IDENTIFIER: "sub"
              OIDC_SCOPES: "openid email profile"
              OIDC_AUTO_CREATE_USER: "true"
              # Password login disabled — OIDC (Pocket ID) is the only login path; removes the local fallback.
              OIDC_DISABLE_PASSWORD_LOGIN: "true"
              # Bypass wallos' SSRF guard for the in-cluster IdP: idm.* resolves (k8s-gateway
              # split DNS) to an RFC1918 IP that FILTER_FLAG_NO_PRIV_RANGE blocks.
              SSRF_ALLOWLIST: "idm.${PUBLIC_DOMAIN}"
            envFrom:
              - secretRef:
                  name: wallos-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health.php
                    port: &port 80
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              # /var/www/html/startup.sh: line 3: can't create /var/log/startup.log: Read-only file system
              readOnlyRootFilesystem: false
              # ERROR: [pool www] failed to setgid(82): Operation not permitted (1)
              # capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 48M
              limits:
                memory: 256M
    service:
      app:
        controller: wallos
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Wallos
          gethomepage.dev/group: PFM
          gethomepage.dev/icon: wallos
        hostnames:
          - "subscriptions.${PUBLIC_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        existingClaim: wallos
        advancedMounts:
          wallos:
            app:
              - path: /var/www/html/db
                subPath: db
              - path: /var/www/html/images/uploads/logos
                subPath: logos
