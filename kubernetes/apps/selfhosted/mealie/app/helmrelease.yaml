---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mealie
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # AD-023 vocabulary: envoy-routed (ingress-from-gateway-external + -internal CCNPs) + internet egress (allow-world-egress CCNP)
      labels:
        ingress.home.arpa/allow-gateway-external: "true"
        ingress.home.arpa/allow-gateway-internal: "true"
        egress.home.arpa/allow-world: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      mealie:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/mealie-recipes/mealie
              tag: v3.22.0@sha256:36c28f0642fb6c75fae8997a2d55994631b9b4bcffba3016c208fc132a4c1e69
            env:
              API_DOCS: "false"
              API_PORT: &port 9000
              PUID: "10001"
              PGID: "10001"
              ALLOW_SIGNUP: "false"
              BASE_URL: "https://recipes.${PUBLIC_DOMAIN}"
              # OIDC via Pocket ID (passkey-only). Callback /login; secret via envFrom.
              # email_verified must be true (IdP EMAILS_VERIFIED=true) — mealie enforces it.
              OIDC_AUTH_ENABLED: "true"
              OIDC_CONFIGURATION_URL: "https://idm.${PUBLIC_DOMAIN}/.well-known/openid-configuration"
              OIDC_CLIENT_ID: "mealie"
              OIDC_GROUPS_CLAIM: "groups"
              OIDC_USER_GROUP: "mealie_users"
              OIDC_ADMIN_GROUP: "mealie_admins"
              OIDC_AUTO_REDIRECT: "true"
              ALLOW_PASSWORD_LOGIN: "false"
              # SMTP Configuration
              SMTP_AUTH_STRATEGY: "NONE"
            envFrom:
              - secretRef:
                  name: mealie-secret
            probes:
              liveness: &probes
                custom: true
                enabled: true
                spec:
                  httpGet:
                    path: /api/app/about
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: false
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 320Mi
              limits:
                memory: 1000Mi
    service:
      app:
        controller: mealie
        ports:
          http:
            port: &port 9000
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Mealie
          gethomepage.dev/group: Selfhosted
          gethomepage.dev/icon: mealie.svg
        hostnames:
          - "recipes.${PUBLIC_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: networking
            sectionName: https
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: mealie
        globalMounts:
          - path: /app/data
      tmp:
        type: emptyDir
