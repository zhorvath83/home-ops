---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sure
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: sure
  components:
    - ../../../../components/cnpg/database
    - ../../../../components/volsync
  dependsOn:
    - name: onepassword-connect
      namespace: external-secrets
    - name: democratic-csi
      namespace: kube-system
    - name: postgres
      namespace: database
    - name: dragonfly
      namespace: database
  interval: 1h
  path: ./kubernetes/apps/selfhosted/sure/app
  postBuild:
    substitute:
      APP: sure
      APP_UID: "1000"
      APP_GID: "1000"
      VOLSYNC_CAPACITY: "2Gi"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 5m
  wait: false
