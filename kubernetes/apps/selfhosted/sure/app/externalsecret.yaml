---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: sure-secret
    creationPolicy: Owner
    template:
      data:
        # Rails credentials: generated once, never rotated casually.
        SECRET_KEY_BASE: "{{ .secret_key_base }}"
        ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: "{{ .active_record_encryption_primary_key }}"
        ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: "{{ .active_record_encryption_deterministic_key }}"
        ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: "{{ .active_record_encryption_key_derivation_salt }}"
        # Database password consumed by the CNPG DatabaseRole via the sure-db basic-auth
        # Secret; same 1Password field, assembled here for the app's own login.
        POSTGRES_PASSWORD: "{{ .postgres_password }}"
        # Shared dragonfly (SELECT 2); URL assembled here so the auth password never
        # lands in the HelmRelease manifest.
        REDIS_URL: "redis://:{{ .requirepass }}@dragonfly.database.svc:6379/2"
        # Static bearer for POST /mcp; tools run as the user behind MCP_USER_EMAIL.
        MCP_API_TOKEN: "{{ .mcp_api_token }}"
        MCP_USER_EMAIL: "{{ .mcp_user_email }}"
        # Built-in auth.yml OIDC provider (fixed name openid_connect). Kept here, not in the HR env, so
        # server and worker see identical providers: ProviderLoader shares one cache between them.
        OIDC_ISSUER: "https://idm.${PUBLIC_DOMAIN}"
        OIDC_CLIENT_ID: sure
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        OIDC_REDIRECT_URI: "https://fin.${PUBLIC_DOMAIN}/auth/openid_connect/callback"
        OIDC_BUTTON_LABEL: Sign in with SSO
        OIDC_BUTTON_ICON: shield
        # Local LLM (ai/llama-cpp); here rather than the HR env so server (chat) and worker
        # (rule-driven auto-categorise / merchant detection) use the same provider.
        OPENAI_ACCESS_TOKEN: "{{ .llama_cpp_api_key }}"
        OPENAI_URI_BASE: http://llama-cpp.ai.svc.cluster.local:8080/v1
        OPENAI_MODEL: qwen3.6-35b-a3b
        # CPU prefill of the system prompt + tool schemas outlives the 60 s default.
        OPENAI_REQUEST_TIMEOUT: "600"
  dataFrom:
    - extract:
        key: sure
    - extract:
        key: dragonfly
  data:
    - secretKey: oidc_client_secret
      remoteRef:
        key: pocket-id-clients
        property: sure_client_secret
    - secretKey: llama_cpp_api_key
      remoteRef:
        key: llama-cpp
        property: sure_api_key
