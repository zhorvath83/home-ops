---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# sure (AD-023): egress-only delta — postgres + shared dragonfly in database; world egress
# (bank sync providers, open FQDN list) via the allow-world pod label + CCNP. Ingress comes
# from envoy-internal via the ingress-from-gateway-internal CCNP; no east-west consumers yet.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sure
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: sure
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: database
            cnpg.io/cluster: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: database
            app.kubernetes.io/name: dragonfly
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
