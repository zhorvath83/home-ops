---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: paperless-secret
    creationPolicy: Owner
    template:
      data:
        # OIDC provider config (django-allauth openid_connect). Secret interpolated by ESO;
        # ${PUBLIC_DOMAIN} substituted by Flux. Callback /accounts/oidc/pocket-id/login/callback/.
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: |-
          {"openid_connect":{"OAUTH_PKCE_ENABLED":true,"APPS":[{"provider_id":"pocket-id","name":"Pocket ID","client_id":"paperless","secret":"{{ .oidc_client_secret }}","settings":{"server_url":"https://idm.${PUBLIC_DOMAIN}/.well-known/openid-configuration","fetch_userinfo":true}}],"SCOPE":["openid","profile","email","groups"]}}
        # paperless
        PAPERLESS_SECRET_KEY: "{{ .paperless_secret_key }}"
        PAPERLESS_ADMIN_USER: "{{ .paperless_admin_user }}"
        PAPERLESS_ADMIN_PASSWORD: "{{ .paperless_admin_password }}"
        PAPERLESS_ADMIN_MAIL: "{{ .paperless_admin_mail }}"
        PAPERLESS_PDF_PASSWORDS: "{{ .paperless_pdf_passwords }}"
        # API token for seed job (generate in Paperless UI: My Profile → API Token)
        PAPERLESS_TOKEN: "{{ .paperless_api_token }}"
  dataFrom:
    - extract:
        key: paperless
  data:
    - secretKey: oidc_client_secret
      remoteRef:
        key: pocket-id-clients
        property: paperless_client_secret
