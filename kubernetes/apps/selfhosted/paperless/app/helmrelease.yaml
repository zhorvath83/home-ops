---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      paperless:
        annotations:
          reloader.stakater.com/auto: "true"
        # AD-023 vocabulary on the main pod only; the backup CronJob keeps baseline egress
        pod:
          labels:
            egress.home.arpa/custom-egress: "true"
            egress.home.arpa/allow-gateways: "true"
            ingress.home.arpa/allow-gateway-external: "true"
            ingress.home.arpa/allow-gateway-internal: "true"
        containers:
          # NOTE: Container-level security contexts are NOT used for paperless-ngx containers
          # because the s6-overlay init system requires privileges to fix /run permissions.
          # Adding allowPrivilegeEscalation: false and dropping ALL capabilities breaks startup.
          app:
            dependsOn:
              - valkey
            image: &image
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.1.2@sha256:141dc5d5f15124355523722dc87e141552badd86dccf952d242e63b813906cb6
            env:
              # Application settings
              PAPERLESS_TIME_ZONE: "Europe/Budapest"
              PAPERLESS_URL: "https://docs.${PUBLIC_DOMAIN}"
              PAPERLESS_PORT: "8000"
              PAPERLESS_ENABLE_COMPRESSION: "false"
              PAPERLESS_TRUSTED_PROXIES: "${POD_CIDR},${LAN_SUBNET}"
              # ALLAUTH_TRUSTED_PROXY_COUNT is a hop COUNT, not a CIDR list: paperless defaults it
              # to len(PAPERLESS_TRUSTED_PROXIES)=2, but the LAN path carries 1 XFF entry -> login 500.
              # count=1 fixes LAN (true client IP); external (2 entries) still logs in — its allauth
              # rate-limit key collapses to the tunnel peer, acceptable behind Cloudflare Access.
              PAPERLESS_ALLAUTH_TRUSTED_PROXY_COUNT: "1"
              # Date parsing (Hungarian format: év.hónap.nap)
              PAPERLESS_DATE_ORDER: "YMD"
              # Paths
              PAPERLESS_CONSUMPTION_DIR: "/data/nas/inbox"
              PAPERLESS_EXPORT_DIR: &exportDir "/data/nas/export"
              PAPERLESS_DATA_DIR: &dataDir "/data/local/data"
              PAPERLESS_MEDIA_ROOT: &mediaRoot "/data/local/media"
              PAPERLESS_LOGGING_DIR: "/data/local/logs"
              PAPERLESS_LOGROTATE_MAX_SIZE: "1048576"
              PAPERLESS_LOGROTATE_MAX_BACKUPS: "10"
              PAPERLESS_FILENAME_FORMAT: &filenameFormat "{{ `{{ created_year }}/{{ correspondent | default('uncategorized') | slugify }}/{{ created_year }}-{{ created_month }}-{{ created_day }}_{{ title | slugify }}_{{ doc_pk }}` }}"
              # Configure folder importer
              # v3 ignore patterns are regex and additive to the built-in defaults, which already
              # cover every pattern this app used to list; polling is mandatory on the NFS inbox.
              PAPERLESS_CONSUMER_DELETE_DUPLICATES: "true"
              PAPERLESS_CONSUMER_RECURSIVE: "true"
              PAPERLESS_CONSUMER_POLLING_INTERVAL: "60"
              # Print a Patch-Code-T sheet as a separator page between different documents when scanning.
              # https://www.alliancegroup.co.uk/downloads/patch-code-t.pdf
              # PAPERLESS_CONSUMER_ENABLE_BARCODES: "true"

              # Pre-consume script for PDF processing (decrypt, blank removal, optimization)
              PAPERLESS_PRE_CONSUME_SCRIPT: "/usr/src/paperless/scripts/pre-consume.sh"
              # Database (SQLite)
              PAPERLESS_DBENGINE: &dbEngine "sqlite"
              # Redis/Valkey connection (sidecar)
              PAPERLESS_REDIS: "redis://localhost:6379"
              # OCR settings
              # PAPERLESS_OCR_LANGUAGE: "hun"
              # PAPERLESS_OCR_LANGUAGES: "hun"
              # v3 split OCR control from archive control; auto + never is the documented
              # equivalent of the v2 skip + skip_archive_file=always pair this app used.
              PAPERLESS_OCR_MODE: "auto"
              PAPERLESS_ARCHIVE_FILE_GENERATION: "never"
              PAPERLESS_OCR_CLEAN: "none"
              PAPERLESS_OCR_DESKEW: "false"
              PAPERLESS_OCR_ROTATE_PAGES: "false"
              PAPERLESS_OCR_PAGES: "1"
              # Worker settings - single-threaded processing to reduce memory usage
              PAPERLESS_TASK_WORKERS: "1"
              PAPERLESS_THREADS_PER_WORKER: "1"
              PAPERLESS_WEBSERVER_WORKERS: "1"
              # Disable optional features for reduced resource usage
              PAPERLESS_ENABLE_NLTK: "false"
              PAPERLESS_ENABLE_UPDATE_CHECK: "false"
              PAPERLESS_TRAIN_TASK_CRON: "disable"
              PAPERLESS_EMAIL_TASK_CRON: "disable"
              PAPERLESS_WORKFLOW_SCHEDULED_TASK_CRON: "disable"
              # OIDC via Pocket ID (passkey-only). Regular login disabled, auto-redirect to SSO.
              # PAPERLESS_SOCIALACCOUNT_PROVIDERS (with the client secret) is built in the ES.
              # Callback /accounts/oidc/pocket-id/login/callback/ (provider_id=pocket-id).
              PAPERLESS_APPS: "allauth.socialaccount.providers.openid_connect"
              PAPERLESS_DISABLE_REGULAR_LOGIN: "true"
              PAPERLESS_REDIRECT_LOGIN_TO_SSO: "true"
              PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "true"
              PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
              PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS: "true"
              PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS_CLAIM: "groups"
              # Regular (non-social) account signups stay closed.
              PAPERLESS_ACCOUNT_ALLOW_SIGNUPS: "false"
              # Security
              USERMAP_UID: &uid "1000"
              USERMAP_GID: &gid "1000"
              S6_READ_ONLY_ROOT: 1
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: 1
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              startup:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  # s6 runs DB migrations and the tantivy index rebuild before the webserver starts
                  failureThreshold: 20
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
            securityContext: &paperlessSecurityContext
              privileged: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources: &resources
              requests:
                memory: 800Mi
                cpu: 10m
              limits:
                memory: 5Gi
          valkey:
            image:
              repository: ghcr.io/valkey-io/valkey
              tag: 9.1.2@sha256:929a907a011197b2abd5bfcaaa767420478bd5a42db24c004caf23d27d05a4fe
            args:
              - --port
              - "6379"
              - --maxmemory
              - "96mb"
              - --maxmemory-policy
              - allkeys-lru
              - --save
              - ""
              - --appendonly
              - "no"
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              privileged: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 5m
                memory: 12Mi
              limits:
                memory: 128Mi
      backup:
        type: cronjob
        cronjob:
          concurrencyPolicy: Forbid
          schedule: "30 0 * * *"
          suspend: false
          successfulJobsHistory: 1
          failedJobsHistory: 3
        containers:
          app:
            image: *image
            resources: *resources
            securityContext: *paperlessSecurityContext
            env:
              PAPERLESS_TIME_ZONE: "Europe/Budapest"
              PAPERLESS_EXPORT_DIR: *exportDir
              PAPERLESS_DATA_DIR: *dataDir
              PAPERLESS_MEDIA_ROOT: *mediaRoot
              PAPERLESS_FILENAME_FORMAT: *filenameFormat
              PAPERLESS_DBENGINE: *dbEngine
              USERMAP_UID: *uid
              USERMAP_GID: *gid
            command:
              - "/bin/sh"
              - "-c"
              - |
                echo "Starting paperless-ngx document export..."
                python3 /usr/src/paperless/src/manage.py document_exporter /data/nas/export --compare-checksums --delete --use-filename-format --use-folder-prefix
                echo "Export completed successfully."
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
    service:
      app:
        controller: paperless
        ports:
          http:
            port: &port 8000
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Paperless-NGX
          gethomepage.dev/group: Selfhosted
          gethomepage.dev/icon: paperless-ngx.svg
        hostnames:
          - "docs.${PUBLIC_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: networking
            sectionName: https
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      tmpfs:
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /run
        type: emptyDir
      valkey-data:
        type: emptyDir
        advancedMounts:
          paperless:
            valkey:
              - path: /data
      data:
        existingClaim: paperless
        advancedMounts:
          paperless:
            app: &dataMount
              - path: /data/local
          backup:
            app: *dataMount
      nas-export:
        type: nfs
        server: ${NAS_IP}
        path: /backups/paperless
        advancedMounts:
          paperless:
            app: &exportMount
              - path: /data/nas/export
          backup:
            app: *exportMount
      nas-inbox:
        type: nfs
        server: ${NAS_IP}
        path: /scanner/paperless-inbox
        advancedMounts:
          paperless:
            app:
              - path: /data/nas/inbox
      scripts:
        type: configMap
        name: paperless-scripts
        defaultMode: 0755
        advancedMounts:
          paperless:
            app:
              - path: /usr/src/paperless/scripts/pre-consume.sh
                subPath: pre-consume.sh
                readOnly: true
