---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-gpt
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: paperless-gpt-secret
    creationPolicy: Owner
    template:
      data:
        # mistral
        MISTRAL_API_KEY: "{{ .MISTRAL_API_KEY }}"
        # paperless
        PAPERLESS_API_TOKEN: "{{ .paperless_api_token }}"
        # local LLM (ai/llama-cpp)
        OPENAI_API_KEY: "{{ .llama_cpp_api_key }}"
        CORRESPONDENT_BLACK_LIST: "{{ .paperless_gpt_correspondent_blacklist }}"
  dataFrom:
    - extract:
        key: mistral
    - extract:
        key: paperless
  data:
    - secretKey: llama_cpp_api_key
      remoteRef:
        key: llama-cpp
        property: paperless_gpt_api_key
