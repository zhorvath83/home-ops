---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llama-cpp
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: llama-cpp
  dependsOn:
    - name: onepassword-connect
      namespace: external-secrets
    - name: democratic-csi
      namespace: kube-system
  interval: 1h
  path: ./kubernetes/apps/ai/llama-cpp/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  # The first rollout downloads ~39 GB of GGUF weights in the init container.
  timeout: 1h
  wait: false
