---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/_/persistentvolumeclaim_v1.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-cpp-models
# Standalone PVC, excluded from VolSync: GGUF weights are pinned and re-downloadable.
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: democratic-csi-local-hostpath
