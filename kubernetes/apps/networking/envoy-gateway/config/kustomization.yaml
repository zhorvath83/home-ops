---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./envoy.yaml
  - ./gateway-external.yaml
  - ./gateway-internal.yaml
  - ./gateway-policies.yaml
  - ./validatingadmissionpolicy.yaml
  - ./ciliumnetworkpolicy-external.yaml
  - ./ciliumnetworkpolicy-internal.yaml
  - ./observability.yaml
  - ./prometheusrule.yaml
  - ./grafanadashboard.yaml
configMapGenerator:
  - name: envoy-external-geo-gate-dashboard
    files:
      - ./dashboards/envoy-external-geo-gate.json
generatorOptions:
  disableNameSuffixHash: true
  # Grafana's ${datasource} / $__rate_interval must survive Flux postBuild substitution.
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
