---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
# Replace Envoy's "OAuth flow failed." 401 with a friendly access-denied page.
# source:Local is OIDC-only here (RFC1918 Deny -> 403, rate-limit -> 429)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: oidc-error-page
spec:
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: Gateway
  responseOverride:
    - source: Local
      match:
        statusCodes:
          - type: Value
            value: 401
      response:
        contentType: text/html
        body:
          type: Inline
          inline: |-
            <!doctype html><html lang="hu"><head><meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Bejelentkezés sikertelen</title>
            <style>body{font-family:system-ui,sans-serif;max-width:36rem;margin:4rem auto;padding:0 1rem;line-height:1.5}h1{font-size:1.3rem;margin-bottom:1rem}.hint{color:#555;margin-top:1.5rem;font-size:.9rem}</style></head>
            <body><h1>Bejelentkezés sikertelen</h1>
            <p id="msg">Nincs hozzáférésed ehhez a szolgáltatáshoz, vagy a munkameneted lejárt.</p>
            <p class="hint" id="detail"></p>
            <script>(function(){var p=new URLSearchParams(location.search),err=p.get("error"),desc=p.get("error_description"),msg=document.getElementById("msg"),detail=document.getElementById("detail");if(err==="access_denied"&&desc){msg.textContent="A hozzáférést az azonosítószolgáltató (Pocket ID) megtagadta: "+desc;}else if(err){detail.textContent="Hibakód: "+err+(desc?(" — "+desc):"");}})();</script></body></html>
