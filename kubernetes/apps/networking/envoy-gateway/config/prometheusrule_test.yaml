---
# yaml-language-server: $schema=https://json.schemastore.org/prometheus.rules.test.json
# promtool unit tests for config/prometheusrule.yaml, covering EnvoyProxyDown,
# EnvoyGatewayXDSRejected, EnvoyGatewayPolicyNotAccepted,
# EnvoyGatewayPolicyStatusMissing, EnvoyInternalConnectionsHigh,
# EnvoyExtAuthzErrors, EnvoyRateLimited, GeoIPDatabaseStale, GeoIPReloadFailed and
# GeoGateInactive.
# The EnvoyProxyDown expr
# `count(up{job="networking/envoy-proxy", namespace="networking"} == 1) < 2` aggregates away
# all labels, so exp_labels are alertname + severity only — it fires whenever fewer than 2
# envoy-proxy targets are up: one-down, both-down, and all-vanished (count of an empty vector
# is 0). The 2-up case is the no-fire boundary at count 2 vs 1. for:2m, so every fire case
# evals past 2m (eval at 3m). exp_annotations asserted so the data-plane/control-plane text
# is exercised.
# EnvoyGatewayPolicyStatusMissing (cases l-n) uses absent() — no input series at all
# yields a 1 with no labels, so the fire case carries only alertname + severity, and the
# for:5m hold is exercised by the boundary eval at 4m.
# Run via `just k8s test-prom-rules` (recipe copies this test + .extracted_prometheus_rules.yaml into a temp dir).
rule_files:
  - ./.extracted_prometheus_rules.yaml
evaluation_interval: 1m
tests:
  # === EnvoyProxyDown ===
  # (a) No-fire: both proxies up (count == 2, not < 2).
  - interval: 1m
    input_series:
      - series: 'up{job="networking/envoy-proxy",namespace="networking",pod="envoy-external"}'
        values: '1x4'
      - series: 'up{job="networking/envoy-proxy",namespace="networking",pod="envoy-internal"}'
        values: '1x4'
    alert_rule_test:
      - eval_time: 3m
        alertname: EnvoyProxyDown
        exp_alerts: []
  # (b) Fire: one proxy down (count == 1 < 2). count() strips labels → alertname + severity only.
  - interval: 1m
    input_series:
      - series: 'up{job="networking/envoy-proxy",namespace="networking",pod="envoy-external"}'
        values: '1x4'
      - series: 'up{job="networking/envoy-proxy",namespace="networking",pod="envoy-internal"}'
        values: '0x4'
    alert_rule_test:
      - eval_time: 3m
        alertname: EnvoyProxyDown
        exp_alerts:
          - exp_labels:
              alertname: EnvoyProxyDown
              severity: critical
            exp_annotations:
              summary: Envoy Gateway data plane (proxy) is down
              description: |-
                Fewer than 2 envoy-proxy targets are up — at least one of envoy-external
                (public) or envoy-internal (LAN) is unreachable. The down proxy's traffic
                path is dead. This is the data plane; the envoy-gateway controller (control
                plane) is a separate ServiceMonitor not covered here.
  # (c) Fire: both proxies down (count == 0 < 2).
  - interval: 1m
    input_series:
      - series: 'up{job="networking/envoy-proxy",namespace="networking",pod="envoy-external"}'
        values: '0x4'
      - series: 'up{job="networking/envoy-proxy",namespace="networking",pod="envoy-internal"}'
        values: '0x4'
    alert_rule_test:
      - eval_time: 3m
        alertname: EnvoyProxyDown
        exp_alerts:
          - exp_labels:
              alertname: EnvoyProxyDown
              severity: critical
            exp_annotations:
              summary: Envoy Gateway data plane (proxy) is down
              description: |-
                Fewer than 2 envoy-proxy targets are up — at least one of envoy-external
                (public) or envoy-internal (LAN) is unreachable. The down proxy's traffic
                path is dead. This is the data plane; the envoy-gateway controller (control
                plane) is a separate ServiceMonitor not covered here.
  # (d) Fire: all targets vanished (count of empty vector == 0 < 2) — the scale-to-0 / crashloop case.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 3m
        alertname: EnvoyProxyDown
        exp_alerts:
          - exp_labels:
              alertname: EnvoyProxyDown
              severity: critical
            exp_annotations:
              summary: Envoy Gateway data plane (proxy) is down
              description: |-
                Fewer than 2 envoy-proxy targets are up — at least one of envoy-external
                (public) or envoy-internal (LAN) is unreachable. The down proxy's traffic
                path is dead. This is the data plane; the envoy-gateway controller (control
                plane) is a separate ServiceMonitor not covered here.

  # === EnvoyGatewayXDSRejected ===
  # `increase(...[15m]) > 0`, for: 5m. Fire cases eval at 10m so the 5m hold is exercised.
  # (e) No-fire: counter present and never incremented.
  - interval: 1m
    input_series:
      - series: 'xds_nack_total{job="envoy-gateway",namespace="networking",nodeID="envoy-external-0",typeURL="type.googleapis.com/envoy.config.listener.v3.Listener"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: EnvoyGatewayXDSRejected
        exp_alerts: []
  # (f) Fire: one NACK at t=3m, condition holds past the 5m for.
  - interval: 1m
    input_series:
      - series: 'xds_nack_total{job="envoy-gateway",namespace="networking",nodeID="envoy-external-0",typeURL="type.googleapis.com/envoy.config.listener.v3.Listener"}'
        values: '0 0 0 1x16'
    alert_rule_test:
      - eval_time: 10m
        alertname: EnvoyGatewayXDSRejected
        exp_alerts:
          - exp_labels:
              alertname: EnvoyGatewayXDSRejected
              severity: critical
              job: envoy-gateway
              namespace: networking
              nodeID: envoy-external-0
              typeURL: type.googleapis.com/envoy.config.listener.v3.Listener
            exp_annotations:
              summary: Envoy rejected an xDS config update
              description: |-
                Proxy envoy-external-0 rejected a config update for
                type.googleapis.com/envoy.config.listener.v3.Listener and keeps serving its last known good config.
                Traffic still flows, but that proxy will fail to start on its next
                restart. The rejection reason is in the envoy-gateway controller log.
  # (g) Boundary no-fire: a non-zero counter that stops incrementing — the healed case
  # the raw-counter form would latch on forever.
  - interval: 1m
    input_series:
      - series: 'xds_nack_total{job="envoy-gateway",namespace="networking",nodeID="envoy-external-0",typeURL="type.googleapis.com/envoy.config.listener.v3.Listener"}'
        values: '7x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: EnvoyGatewayXDSRejected
        exp_alerts: []

  # === EnvoyGatewayPolicyNotAccepted ===
  # Metric from kube-state-metrics custom-resource-state: accepted is the Accepted
  # condition status of status.ancestors[0] ("" when no ancestor exists — the silent
  # attach-failure case). expr `accepted!="True"`, for: 5m, so fire cases eval at 7m
  # (past the hold) and the hold itself is a no-fire at 2m.
  # (h) No-fire: policy accepted.
  - interval: 1m
    input_series:
      - series: 'envoy_securitypolicy_info{exported_namespace="networking",name="envoy-internal-rfc1918",accepted="True",reason="Accepted"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 7m
        alertname: EnvoyGatewayPolicyNotAccepted
        exp_alerts: []
  # (i) Boundary no-fire: not-Accepted but only for 2m — the 5m `for` hold not yet elapsed.
  - interval: 1m
    input_series:
      - series: 'envoy_securitypolicy_info{exported_namespace="networking",name="envoy-external-edge",accepted="False",reason="NoMatchingParent"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 2m
        alertname: EnvoyGatewayPolicyNotAccepted
        exp_alerts: []
  # (j) Fire: Accepted condition False.
  - interval: 1m
    input_series:
      - series: 'envoy_securitypolicy_info{exported_namespace="networking",name="envoy-external-edge",accepted="False",reason="NoMatchingParent"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 7m
        alertname: EnvoyGatewayPolicyNotAccepted
        exp_alerts:
          - exp_labels:
              alertname: EnvoyGatewayPolicyNotAccepted
              severity: warning
              exported_namespace: networking
              name: envoy-external-edge
              accepted: "False"
              reason: NoMatchingParent
            exp_annotations:
              summary: Envoy Gateway SecurityPolicy is not accepted
              description: |-
                SecurityPolicy envoy-external-edge (namespace networking)
                is not Accepted (accepted=False); it is silently detached and
                its routes lose the Gateway-level CrowdSec / RFC1918 / geo gates. The rejection
                reason is in the envoy-gateway controller log.
  # (k) Fire: no ancestor at all (accepted="" / reason="") — the missing-ancestorRef case.
  - interval: 1m
    input_series:
      - series: 'envoy_securitypolicy_info{exported_namespace="selfhosted",name="paperless-oidc",accepted="",reason=""}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 7m
        alertname: EnvoyGatewayPolicyNotAccepted
        exp_alerts:
          # Empty accepted/reason are dropped from the alert's label set by Prometheus
          # (the series still matched: accepted!="True" on accepted=""), so only the
          # non-empty labels are asserted here.
          - exp_labels:
              alertname: EnvoyGatewayPolicyNotAccepted
              severity: warning
              exported_namespace: selfhosted
              name: paperless-oidc
            exp_annotations:
              summary: Envoy Gateway SecurityPolicy is not accepted
              description: |-
                SecurityPolicy paperless-oidc (namespace selfhosted)
                is not Accepted (accepted=); it is silently detached and
                its routes lose the Gateway-level CrowdSec / RFC1918 / geo gates. The rejection
                reason is in the envoy-gateway controller log.

  # === EnvoyGatewayPolicyStatusMissing ===
  # absent() fires only when the series is entirely gone — no input series at all, so no
  # labels on the fired alert. for: 5m, so the fire case evals past the hold.
  # (l) No-fire: the metric exists (KSM up, RBAC fine).
  - interval: 1m
    input_series:
      - series: 'envoy_securitypolicy_info{exported_namespace="networking",name="envoy-internal-rfc1918",accepted="True",reason="Accepted"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 7m
        alertname: EnvoyGatewayPolicyStatusMissing
        exp_alerts: []
  # (m) Boundary no-fire: absent() yields 1 from t=0, but the 5m `for` hold not yet elapsed.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 4m
        alertname: EnvoyGatewayPolicyStatusMissing
        exp_alerts: []
  # (n) Fire: the metric path is dead (KSM down / RBAC broken / all policies deleted).
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 7m
        alertname: EnvoyGatewayPolicyStatusMissing
        exp_alerts:
          - exp_labels:
              alertname: EnvoyGatewayPolicyStatusMissing
              severity: critical
            exp_annotations:
              summary: Envoy Gateway SecurityPolicy status metric is missing
              description: |-
                envoy_securitypolicy_info produced no samples for 5m — kube-state-metrics
                is down, its securitypolicies RBAC/CRS entry broke, or every SecurityPolicy
                was deleted. EnvoyGatewayPolicyNotAccepted is now blind and a silently
                detached SecurityPolicy will not alert until this recovers.

  # === EnvoyInternalConnectionsHigh ===
  # Live listener-level gauge for the internal gateway's http/https listeners
  # (admin/stats/readiness on 19001/19003 excluded via the listener_address regex).
  # sum by (pod) collapses the per-listener series; > 512 fires, for: 10m, so the
  # fire case evals past the hold and the boundary no-fire stays short of 10m.
  # (o) No-fire: normal load (sum well under 512).
  - interval: 1m
    input_series:
      - series: 'envoy_listener_downstream_cx_active{namespace="networking",pod="envoy-internal-7b474ddb45-26t5g",envoy_listener_address="0.0.0.0_10443"}'
        values: '2x16'
    alert_rule_test:
      - eval_time: 15m
        alertname: EnvoyInternalConnectionsHigh
        exp_alerts: []
  # (p) Boundary no-fire: above threshold but the 10m `for` hold not yet elapsed.
  - interval: 1m
    input_series:
      - series: 'envoy_listener_downstream_cx_active{namespace="networking",pod="envoy-internal-7b474ddb45-26t5g",envoy_listener_address="0.0.0.0_10443"}'
        values: '1x4 600x6'
    alert_rule_test:
      - eval_time: 9m
        alertname: EnvoyInternalConnectionsHigh
        exp_alerts: []
  # (q) Fire: above threshold sustained past the 10m hold.
  - interval: 1m
    input_series:
      - series: 'envoy_listener_downstream_cx_active{namespace="networking",pod="envoy-internal-7b474ddb45-26t5g",envoy_listener_address="0.0.0.0_10443"}'
        values: '600x16'
    alert_rule_test:
      - eval_time: 15m
        alertname: EnvoyInternalConnectionsHigh
        exp_alerts:
          - exp_labels:
              alertname: EnvoyInternalConnectionsHigh
              severity: warning
              pod: envoy-internal-7b474ddb45-26t5g
            exp_annotations:
              summary: Envoy internal gateway active connections at half the cap
              description: |-
                envoy-internal (envoy-internal-7b474ddb45-26t5g) is at 600 active downstream
                connections — half of the 1024-per-listener connectionLimit. At the cap
                new connections are rejected, so every LAN app behind this gateway fails;
                investigate before it engages.

  # === EnvoyExtAuthzErrors ===
  # Data-plane ext_authz failure counter, both gateways (job=networking/envoy-proxy).
  # sum by (pod) collapses the per-listener (http-10080/https-10443) series; the metric
  # has never been non-zero, so any increase > 0 is real. for: 2m, so the fire case evals
  # past the hold and the boundary no-fire stays short of it.
  # (r) No-fire: both gateways clean (counter constant at 0).
  - interval: 1m
    input_series:
      - series: 'envoy_http_ext_authz_error{job="networking/envoy-proxy",namespace="networking",pod="envoy-external",envoy_http_conn_manager_prefix="https-10443"}'
        values: '0x5'
      - series: 'envoy_http_ext_authz_error{job="networking/envoy-proxy",namespace="networking",pod="envoy-internal",envoy_http_conn_manager_prefix="https-10443"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: EnvoyExtAuthzErrors
        exp_alerts: []
  # (s) Boundary no-fire: an error at t=1m, but the 2m `for` hold not yet elapsed at 2m.
  - interval: 1m
    input_series:
      - series: 'envoy_http_ext_authz_error{job="networking/envoy-proxy",namespace="networking",pod="envoy-external",envoy_http_conn_manager_prefix="https-10443"}'
        values: '0 1x3'
    alert_rule_test:
      - eval_time: 2m
        alertname: EnvoyExtAuthzErrors
        exp_alerts: []
  # (t) Fire: the error sustained past the 2m hold.
  - interval: 1m
    input_series:
      - series: 'envoy_http_ext_authz_error{job="networking/envoy-proxy",namespace="networking",pod="envoy-external",envoy_http_conn_manager_prefix="https-10443"}'
        values: '0 1x3'
    alert_rule_test:
      - eval_time: 3m
        alertname: EnvoyExtAuthzErrors
        exp_alerts:
          - exp_labels:
              alertname: EnvoyExtAuthzErrors
              severity: critical
              pod: envoy-external
            exp_annotations:
              summary: Envoy Gateway ext_authz requests are failing
              description: |-
                Envoy Gateway envoy-external is failing ext_authz requests.
                The chain is fail-closed (no failOpen switch), so every ext_authz error is
                a 503 on the public AND LAN surfaces — exemptIPs cover only 10.0.0.0/8.
                The cause can be the bouncer (up but erroring) or an AppSec outage
                underneath it; CrowdSecBouncerDown only catches a dead pod.
  # === EnvoyRateLimited ===
  # Counter starts at 0, so increase() over the 0→3 step is exactly 3 (no extrapolation).
  # (rl-a) Boundary no-fire: counter flat at 0 on both gateways (increase == 0, not > 0).
  - interval: 1m
    input_series:
      - series: 'envoy_http_local_rate_limit_rate_limited{job="networking/envoy-proxy",namespace="networking",pod="envoy-external"}'
        values: '0x20'
      - series: 'envoy_http_local_rate_limit_rate_limited{job="networking/envoy-proxy",namespace="networking",pod="envoy-internal"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: EnvoyRateLimited
        exp_alerts: []
  # (rl-b) Fire: 3 requests limited on envoy-external only; envoy-internal stays silent.
  - interval: 1m
    input_series:
      - series: 'envoy_http_local_rate_limit_rate_limited{job="networking/envoy-proxy",namespace="networking",pod="envoy-external"}'
        values: '0x10 3x10'
      - series: 'envoy_http_local_rate_limit_rate_limited{job="networking/envoy-proxy",namespace="networking",pod="envoy-internal"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: EnvoyRateLimited
        exp_alerts:
          - exp_labels:
              alertname: EnvoyRateLimited
              severity: warning
              pod: envoy-external
            exp_annotations:
              summary: Envoy Gateway is rate limiting clients
              description: |-
                envoy-external answered 3 requests with 429 in the
                last 15m. Find the client and host in VictoriaLogs:
                kubernetes.pod_name:envoy-* response_code_details:local_rate_limited.
                An attacker needs no action; a legitimate client means its host's tier in
                BackendTrafficPolicy networking/envoy is too low.
  # (rl-c) No-fire: the 15m window has slid past the last limited request.
  - interval: 1m
    input_series:
      - series: 'envoy_http_local_rate_limit_rate_limited{job="networking/envoy-proxy",namespace="networking",pod="envoy-external"}'
        values: '0x5 3x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: EnvoyRateLimited
        exp_alerts: []
  # === GeoIPDatabaseStale ===
  # build_epoch is a negative offset, so age = eval time + |epoch|; threshold 7d, for: 1h.
  # (u) No-fire: a 1-day-old database.
  - interval: 1m
    input_series:
      - series: 'envoy_maxmind_country_db__geoip_GeoLite2_Country_mmdb_db_build_epoch{namespace="networking",pod="envoy-external-abc"}'
        values: '-86400x80'
    alert_rule_test:
      - eval_time: 70m
        alertname: GeoIPDatabaseStale
        exp_alerts: []
  # (v) Boundary no-fire: older than 7d since t=0+, but the 1h `for` hold not yet elapsed.
  - interval: 1m
    input_series:
      - series: 'envoy_maxmind_country_db__geoip_GeoLite2_Country_mmdb_db_build_epoch{namespace="networking",pod="envoy-external-abc"}'
        values: '-604800x80'
    alert_rule_test:
      - eval_time: 30m
        alertname: GeoIPDatabaseStale
        exp_alerts: []
  # (w) Fire: stale past the hold (age 7d + 70m).
  - interval: 1m
    input_series:
      - series: 'envoy_maxmind_country_db__geoip_GeoLite2_Country_mmdb_db_build_epoch{namespace="networking",pod="envoy-external-abc"}'
        values: '-604800x80'
    alert_rule_test:
      - eval_time: 70m
        alertname: GeoIPDatabaseStale
        exp_alerts:
          - exp_labels:
              alertname: GeoIPDatabaseStale
              severity: warning
              namespace: networking
              pod: envoy-external-abc
            exp_annotations:
              summary: GeoIP country database on envoy-external is stale
              description: |-
                The GeoLite2-Country database loaded by envoy-external-abc was built
                7d 1h 10m 0s ago. The geoipupdate Deployment
                (networking) is not delivering updates; check its log and the
                MaxMind credentials in the 1Password item maxmind.
  # === GeoIPReloadFailed ===
  # (x) No-fire: no reload error.
  - interval: 1m
    input_series:
      - series: 'envoy_maxmind_country_db__geoip_GeoLite2_Country_mmdb_db_reload_error{namespace="networking",pod="envoy-external-abc"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 5m
        alertname: GeoIPReloadFailed
        exp_alerts: []
  # (y) Boundary no-fire: an error at 1m has left the 1h window by 70m.
  - interval: 1m
    input_series:
      - series: 'envoy_maxmind_country_db__geoip_GeoLite2_Country_mmdb_db_reload_error{namespace="networking",pod="envoy-external-abc"}'
        values: '0 1x80'
    alert_rule_test:
      - eval_time: 70m
        alertname: GeoIPReloadFailed
        exp_alerts: []
  # (z) Fire: a reload error inside the window.
  - interval: 1m
    input_series:
      - series: 'envoy_maxmind_country_db__geoip_GeoLite2_Country_mmdb_db_reload_error{namespace="networking",pod="envoy-external-abc"}'
        values: '0 1x80'
    alert_rule_test:
      - eval_time: 5m
        alertname: GeoIPReloadFailed
        exp_alerts:
          - exp_labels:
              alertname: GeoIPReloadFailed
              severity: warning
              namespace: networking
              pod: envoy-external-abc
            exp_annotations:
              summary: Envoy failed to reload the GeoIP country database
              description: |-
                envoy-external-abc failed to hot-reload GeoLite2-Country.mmdb and keeps
                the previous database. Check the file written by geoipupdate on the
                geoip PVC.
  # === GeoGateInactive ===
  # (ad) No-fire: healthy — RBAC allows slightly more than is forwarded (ext_authz denies the rest).
  - interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_rq_total{namespace="networking",pod="envoy-external-abc",envoy_cluster_name="httproute/selfhosted/mealie/rule/0"}'
        values: '0+20x30'
      - series: 'envoy_http_rbac_allowed{namespace="networking",pod="envoy-external-abc",envoy_http_conn_manager_prefix="https-10443"}'
        values: '0+21x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: GeoGateInactive
        exp_alerts: []
  # (ae) No-fire: no traffic at all (night floor).
  - interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_rq_total{namespace="networking",pod="envoy-external-abc",envoy_cluster_name="httproute/selfhosted/mealie/rule/0"}'
        values: '0x30'
      - series: 'envoy_http_rbac_allowed{namespace="networking",pod="envoy-external-abc",envoy_http_conn_manager_prefix="https-10443"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: GeoGateInactive
        exp_alerts: []
  # (af) Boundary no-fire: gate gone but only 4 forwarded in 10m (not > 5).
  - interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_rq_total{namespace="networking",pod="envoy-external-abc",envoy_cluster_name="httproute/selfhosted/mealie/rule/0"}'
        values: '0+0.4x30'
      - series: 'envoy_http_rbac_allowed{namespace="networking",pod="envoy-external-abc",envoy_http_conn_manager_prefix="https-10443"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: GeoGateInactive
        exp_alerts: []
  # (ag) Boundary no-fire: allowed exactly half of forwarded (strict <).
  - interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_rq_total{namespace="networking",pod="envoy-external-abc",envoy_cluster_name="httproute/selfhosted/mealie/rule/0"}'
        values: '0+20x30'
      - series: 'envoy_http_rbac_allowed{namespace="networking",pod="envoy-external-abc",envoy_http_conn_manager_prefix="https-10443"}'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: GeoGateInactive
        exp_alerts: []
  # (ah) Boundary no-fire: gate gone, but the 5m `for` hold has not elapsed.
  - interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_rq_total{namespace="networking",pod="envoy-external-abc",envoy_cluster_name="httproute/selfhosted/mealie/rule/0"}'
        values: '0+20x30'
      - series: 'envoy_http_rbac_allowed{namespace="networking",pod="envoy-external-abc",envoy_http_conn_manager_prefix="https-10443"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 4m
        alertname: GeoGateInactive
        exp_alerts: []
  # (ai) Fire: gate gone — 200 forwarded, RBAC flat.
  - interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_rq_total{namespace="networking",pod="envoy-external-abc",envoy_cluster_name="httproute/selfhosted/mealie/rule/0"}'
        values: '0+20x30'
