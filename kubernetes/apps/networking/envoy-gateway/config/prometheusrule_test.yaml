---
# yaml-language-server: $schema=https://json.schemastore.org/prometheus.rules.test.json
# promtool unit tests for config/prometheusrule.yaml, covering EnvoyProxyDown,
# EnvoyGatewayXDSRejected, EnvoyGatewayPolicyNotAccepted,
# EnvoyGatewayPolicyStatusMissing and EnvoyInternalConnectionsHigh. The EnvoyProxyDown expr
# `count(up{job="networking/envoy-proxy", namespace="networking"} == 1) < 2` aggregates away
# all labels, so exp_labels are alertname + severity only — it fires whenever fewer than 2
# envoy-proxy targets are up: one-down, both-down, and all-vanished (count of an empty vector
# is 0). The 2-up case is the no-fire boundary at count 2 vs 1. for:2m, so every fire case
# evals past 2m (eval at 3m). exp_annotations asserted so the data-plane/control-plane text
# is exercised.
# EnvoyGatewayPolicyStatusMissing (cases l-n) uses absent() — no input series at all
# yields a 1 with no labels, so the fire case carries only alertname + severity, and the
# for:5m hold is exercised by the boundary eval at 4m.
# Run via `just k8s test-prom-rules` (recipe copies this test + .extracted_prometheus_rules.yaml into a temp dir).
rule_files:
  - ./.extracted_prometheus_rules.yaml
evaluation_interval: 1m
tests:
  # === EnvoyProxyDown ===
  # (a) No-fire: both proxies up (count == 2, not < 2).
  - interval: 1m
    input_series:
      - series: 'up{job="networking/envoy-proxy",namespace="networking",pod="envoy-external"}'
        values: '1x4'
      - series: 'up{job="networking/envoy-proxy",namespace="networking",pod="envoy-internal"}'
        values: '1x4'
    alert_rule_test:
      - eval_time: 3m
        alertname: EnvoyProxyDown
        exp_alerts: []
  # (b) Fire: one proxy down (count == 1 < 2). count() strips labels → alertname + severity only.
  - interval: 1m
    input_series:
      - series: 'up{job="networking/envoy-proxy",namespace="networking",pod="envoy-external"}'
        values: '1x4'
      - series: 'up{job="networking/envoy-proxy",namespace="networking",pod="envoy-internal"}'
        values: '0x4'
    alert_rule_test:
      - eval_time: 3m
        alertname: EnvoyProxyDown
        exp_alerts:
          - exp_labels:
              alertname: EnvoyProxyDown
              severity: critical
            exp_annotations:
              summary: Envoy Gateway data plane (proxy) is down
              description: |-
                Fewer than 2 envoy-proxy targets are up — at least one of envoy-external
                (public) or envoy-internal (LAN) is unreachable. The down proxy's traffic
                path is dead. This is the data plane; the envoy-gateway controller (control
                plane) is a separate ServiceMonitor not covered here.
  # (c) Fire: both proxies down (count == 0 < 2).
  - interval: 1m
    input_series:
      - series: 'up{job="networking/envoy-proxy",namespace="networking",pod="envoy-external"}'
        values: '0x4'
      - series: 'up{job="networking/envoy-proxy",namespace="networking",pod="envoy-internal"}'
        values: '0x4'
    alert_rule_test:
      - eval_time: 3m
        alertname: EnvoyProxyDown
        exp_alerts:
          - exp_labels:
              alertname: EnvoyProxyDown
              severity: critical
            exp_annotations:
              summary: Envoy Gateway data plane (proxy) is down
              description: |-
                Fewer than 2 envoy-proxy targets are up — at least one of envoy-external
                (public) or envoy-internal (LAN) is unreachable. The down proxy's traffic
                path is dead. This is the data plane; the envoy-gateway controller (control
                plane) is a separate ServiceMonitor not covered here.
  # (d) Fire: all targets vanished (count of empty vector == 0 < 2) — the scale-to-0 / crashloop case.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 3m
        alertname: EnvoyProxyDown
        exp_alerts:
          - exp_labels:
              alertname: EnvoyProxyDown
              severity: critical
            exp_annotations:
              summary: Envoy Gateway data plane (proxy) is down
              description: |-
                Fewer than 2 envoy-proxy targets are up — at least one of envoy-external
                (public) or envoy-internal (LAN) is unreachable. The down proxy's traffic
                path is dead. This is the data plane; the envoy-gateway controller (control
                plane) is a separate ServiceMonitor not covered here.

  # === EnvoyGatewayXDSRejected ===
  # `increase(...[15m]) > 0`, for: 5m. Fire cases eval at 10m so the 5m hold is exercised.
  # (e) No-fire: counter present and never incremented.
  - interval: 1m
    input_series:
      - series: 'xds_nack_total{job="envoy-gateway",namespace="networking",nodeID="envoy-external-0",typeURL="type.googleapis.com/envoy.config.listener.v3.Listener"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: EnvoyGatewayXDSRejected
        exp_alerts: []
  # (f) Fire: one NACK at t=3m, condition holds past the 5m for.
  - interval: 1m
    input_series:
      - series: 'xds_nack_total{job="envoy-gateway",namespace="networking",nodeID="envoy-external-0",typeURL="type.googleapis.com/envoy.config.listener.v3.Listener"}'
        values: '0 0 0 1x16'
    alert_rule_test:
      - eval_time: 10m
        alertname: EnvoyGatewayXDSRejected
        exp_alerts:
          - exp_labels:
              alertname: EnvoyGatewayXDSRejected
              severity: critical
              job: envoy-gateway
              namespace: networking
              nodeID: envoy-external-0
              typeURL: type.googleapis.com/envoy.config.listener.v3.Listener
            exp_annotations:
              summary: Envoy rejected an xDS config update
              description: |-
                Proxy envoy-external-0 rejected a config update for
                type.googleapis.com/envoy.config.listener.v3.Listener and keeps serving its last known good config.
                Traffic still flows, but that proxy will fail to start on its next
                restart. The rejection reason is in the envoy-gateway controller log.
  # (g) Boundary no-fire: a non-zero counter that stops incrementing — the healed case
  # the raw-counter form would latch on forever.
  - interval: 1m
    input_series:
      - series: 'xds_nack_total{job="envoy-gateway",namespace="networking",nodeID="envoy-external-0",typeURL="type.googleapis.com/envoy.config.listener.v3.Listener"}'
        values: '7x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: EnvoyGatewayXDSRejected
        exp_alerts: []

  # === EnvoyGatewayPolicyNotAccepted ===
  # Metric from kube-state-metrics custom-resource-state: accepted is the Accepted
  # condition status of status.ancestors[0] ("" when no ancestor exists — the silent
  # attach-failure case). expr `accepted!="True"`, for: 5m, so fire cases eval at 7m
  # (past the hold) and the hold itself is a no-fire at 2m.
  # (h) No-fire: policy accepted.
  - interval: 1m
    input_series:
      - series: 'envoy_securitypolicy_info{exported_namespace="networking",name="envoy-internal-rfc1918",accepted="True",reason="Accepted"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 7m
        alertname: EnvoyGatewayPolicyNotAccepted
        exp_alerts: []
  # (i) Boundary no-fire: not-Accepted but only for 2m — the 5m `for` hold not yet elapsed.
  - interval: 1m
    input_series:
      - series: 'envoy_securitypolicy_info{exported_namespace="networking",name="envoy-external-crowdsec",accepted="False",reason="NoMatchingParent"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 2m
        alertname: EnvoyGatewayPolicyNotAccepted
        exp_alerts: []
  # (j) Fire: Accepted condition False.
  - interval: 1m
    input_series:
      - series: 'envoy_securitypolicy_info{exported_namespace="networking",name="envoy-external-crowdsec",accepted="False",reason="NoMatchingParent"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 7m
        alertname: EnvoyGatewayPolicyNotAccepted
        exp_alerts:
          - exp_labels:
              alertname: EnvoyGatewayPolicyNotAccepted
              severity: warning
              exported_namespace: networking
              name: envoy-external-crowdsec
              accepted: "False"
              reason: NoMatchingParent
            exp_annotations:
              summary: Envoy Gateway SecurityPolicy is not accepted
              description: |-
                SecurityPolicy envoy-external-crowdsec (namespace networking)
                is not Accepted (accepted=False); it is silently detached and
                its routes lose the Gateway-level CrowdSec / RFC1918 gates. The rejection
                reason is in the envoy-gateway controller log.
  # (k) Fire: no ancestor at all (accepted="" / reason="") — the missing-ancestorRef case.
  - interval: 1m
    input_series:
      - series: 'envoy_securitypolicy_info{exported_namespace="selfhosted",name="paperless-oidc",accepted="",reason=""}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 7m
        alertname: EnvoyGatewayPolicyNotAccepted
        exp_alerts:
          # Empty accepted/reason are dropped from the alert's label set by Prometheus
          # (the series still matched: accepted!="True" on accepted=""), so only the
          # non-empty labels are asserted here.
          - exp_labels:
              alertname: EnvoyGatewayPolicyNotAccepted
              severity: warning
              exported_namespace: selfhosted
              name: paperless-oidc
            exp_annotations:
              summary: Envoy Gateway SecurityPolicy is not accepted
              description: |-
                SecurityPolicy paperless-oidc (namespace selfhosted)
                is not Accepted (accepted=); it is silently detached and
                its routes lose the Gateway-level CrowdSec / RFC1918 gates. The rejection
                reason is in the envoy-gateway controller log.

  # === EnvoyGatewayPolicyStatusMissing ===
  # absent() fires only when the series is entirely gone — no input series at all, so no
  # labels on the fired alert. for: 5m, so the fire case evals past the hold.
  # (l) No-fire: the metric exists (KSM up, RBAC fine).
  - interval: 1m
    input_series:
      - series: 'envoy_securitypolicy_info{exported_namespace="networking",name="envoy-internal-rfc1918",accepted="True",reason="Accepted"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 7m
        alertname: EnvoyGatewayPolicyStatusMissing
        exp_alerts: []
  # (m) Boundary no-fire: absent() yields 1 from t=0, but the 5m `for` hold not yet elapsed.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 4m
        alertname: EnvoyGatewayPolicyStatusMissing
        exp_alerts: []
  # (n) Fire: the metric path is dead (KSM down / RBAC broken / all policies deleted).
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 7m
        alertname: EnvoyGatewayPolicyStatusMissing
        exp_alerts:
          - exp_labels:
              alertname: EnvoyGatewayPolicyStatusMissing
              severity: critical
            exp_annotations:
              summary: Envoy Gateway SecurityPolicy status metric is missing
              description: |-
                envoy_securitypolicy_info produced no samples for 5m — kube-state-metrics
                is down, its securitypolicies RBAC/CRS entry broke, or every SecurityPolicy
                was deleted. EnvoyGatewayPolicyNotAccepted is now blind and a silently
                detached SecurityPolicy will not alert until this recovers.

  # === EnvoyInternalConnectionsHigh ===
  # Live listener-level gauge for the internal gateway's http/https listeners
  # (admin/stats/readiness on 19001/19003 excluded via the listener_address regex).
  # sum by (pod) collapses the per-listener series; > 512 fires, for: 10m, so the
  # fire case evals past the hold and the boundary no-fire stays short of 10m.
  # (o) No-fire: normal load (sum well under 512).
  - interval: 1m
    input_series:
      - series: 'envoy_listener_downstream_cx_active{namespace="networking",pod="envoy-internal-7b474ddb45-26t5g",envoy_listener_address="0.0.0.0_10443"}'
        values: '2x16'
    alert_rule_test:
      - eval_time: 15m
        alertname: EnvoyInternalConnectionsHigh
        exp_alerts: []
  # (p) Boundary no-fire: above threshold but the 10m `for` hold not yet elapsed.
  - interval: 1m
    input_series:
      - series: 'envoy_listener_downstream_cx_active{namespace="networking",pod="envoy-internal-7b474ddb45-26t5g",envoy_listener_address="0.0.0.0_10443"}'
        values: '1x4 600x6'
    alert_rule_test:
      - eval_time: 9m
        alertname: EnvoyInternalConnectionsHigh
        exp_alerts: []
  # (q) Fire: above threshold sustained past the 10m hold.
  - interval: 1m
    input_series:
      - series: 'envoy_listener_downstream_cx_active{namespace="networking",pod="envoy-internal-7b474ddb45-26t5g",envoy_listener_address="0.0.0.0_10443"}'
        values: '600x16'
    alert_rule_test:
      - eval_time: 15m
        alertname: EnvoyInternalConnectionsHigh
        exp_alerts:
          - exp_labels:
              alertname: EnvoyInternalConnectionsHigh
              severity: warning
              pod: envoy-internal-7b474ddb45-26t5g
            exp_annotations:
              summary: Envoy internal gateway active connections at half the cap
              description: |-
                envoy-internal (envoy-internal-7b474ddb45-26t5g) is at 600 active downstream
                connections — half of the 1024-per-listener connectionLimit. At the cap
                new connections are rejected, so every LAN app behind this gateway fails;
                investigate before it engages.
