---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: envoy-proxy
spec:
  groups:
    - name: envoy-proxy
      rules:
        # The envoy proxies are the data plane: envoy-external carries public traffic
        # (Cloudflare Tunnel), envoy-internal carries LAN. Either one down kills its
        # path; both down kills all ingress. Two single-replica proxies share one
        # PodMonitor job, so `up == 0 or absent()` (single-target shape) would miss one
        # proxy vanishing — `absent()` needs every series gone to fire. Counting up==1
        # against the expected 2 covers one-down, both-down, scrape failure, and the
        # all-vanished (scale-to-0 / crashloop) case. `for: 2m` skips a rolling-update
        # blip on the single replica.
        - alert: EnvoyProxyDown
          expr: count(up{job="networking/envoy-proxy", namespace="networking"} == 1) < 2
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Envoy Gateway data plane (proxy) is down
            description: |-
              Fewer than 2 envoy-proxy targets are up — at least one of envoy-external
              (public) or envoy-internal (LAN) is unreachable. The down proxy's traffic
              path is dead. This is the data plane; the envoy-gateway controller (control
              plane) is a separate ServiceMonitor not covered here.
