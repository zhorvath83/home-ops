---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: envoy-proxy
spec:
  groups:
    - name: envoy-proxy
      rules:
        # count() over an empty vector (both proxies down, or all vanished) returns empty, not 0 —
        # `or vector(0)` makes those states fire instead of staying silent in the worst outages.
        - alert: EnvoyProxyDown
          expr: (count(up{job="networking/envoy-proxy", namespace="networking"} == 1) or vector(0)) < 2
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Envoy Gateway data plane (proxy) is down
            description: |-
              Fewer than 2 envoy-proxy targets are up — at least one of envoy-external
              (public) or envoy-internal (LAN) is unreachable. The down proxy's traffic
              path is dead. This is the data plane; the envoy-gateway controller (control
              plane) is a separate ServiceMonitor not covered here.
        # Warn at half the per-listener cap; without an alert the limit would fail silently.
        - alert: EnvoyInternalConnectionsHigh
          expr: sum by (pod) (envoy_listener_downstream_cx_active{namespace="networking", pod=~"envoy-internal-.*", envoy_listener_address=~"0.0.0.0_(10080|10443)"}) > 512
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Envoy internal gateway active connections at half the cap
            description: |-
              envoy-internal ({{ $labels.pod }}) is at {{ $value }} active downstream
              connections — half of the 1024-per-listener connectionLimit. At the cap
              new connections are rejected, so every LAN app behind this gateway fails;
              investigate before it engages.
        # CrowdSecBouncerDown only sees the pod; this measures the ext_authz failure
        # itself — fail-closed, so any error is a 503 on public + LAN surfaces (bouncer
        # up-but-erroring or AppSec outage alike). Never been non-zero, so any hit is real.
        - alert: EnvoyExtAuthzErrors
          expr: sum by (pod) (increase(envoy_http_ext_authz_error{job="networking/envoy-proxy", namespace="networking"}[5m])) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Envoy Gateway ext_authz requests are failing
            description: |-
              Envoy Gateway {{ $labels.pod }} is failing ext_authz requests.
              The chain is fail-closed (no failOpen switch), so every ext_authz error is
              a 503 on the public AND LAN surfaces — exemptIPs cover only 10.0.0.0/8.
              The cause can be the bouncer (up but erroring) or an AppSec outage
              underneath it; CrowdSecBouncerDown only catches a dead pod.
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: envoy-gateway
spec:
  groups:
    - name: envoy-gateway
      rules:
        # xds_nack_total (new in EG v1.9.0) is the only signal for a rejected config push:
        # the proxy keeps serving its last known good config, so nothing is visible in
        # traffic until it restarts and fails to load. increase() rather than the raw
        # counter, so a healed NACK stops alerting instead of latching forever.
        - alert: EnvoyGatewayXDSRejected
          expr: increase(xds_nack_total{job="envoy-gateway", namespace="networking"}[15m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Envoy rejected an xDS config update
            description: |-
              Proxy {{ $labels.nodeID }} rejected a config update for
              {{ $labels.typeURL }} and keeps serving its last known good config.
              Traffic still flows, but that proxy will fail to start on its next
              restart. The rejection reason is in the envoy-gateway controller log.
        # SecurityPolicy attachment status comes from kube-state-metrics
        # custom-resource-state (envoy_securitypolicy_info) — EG itself exposes no
        # per-policy status metric. Not-Accepted, or no ancestor at all (accepted=""),
        # means the policy silently detached and its routes lost the Gateway-level
        # CrowdSec/RFC1918 gates while traffic kept flowing.
        - alert: EnvoyGatewayPolicyNotAccepted
          expr: envoy_securitypolicy_info{accepted!="True"}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Envoy Gateway SecurityPolicy is not accepted
            description: |-
              SecurityPolicy {{ $labels.name }} (namespace {{ $labels.exported_namespace }})
              is not Accepted (accepted={{ $labels.accepted }}); it is silently detached and
              its routes lose the Gateway-level CrowdSec / RFC1918 gates. The rejection
              reason is in the envoy-gateway controller log.
        # Sentinel on the guardrail: envoy_securitypolicy_info vanishing (KSM down, its
        # securitypolicies RBAC/CRS entry broken, all policies deleted) silently blinds
        # the NotAccepted alert — the mute failure a missing RBAC rule caused on 2026-08-15.
        - alert: EnvoyGatewayPolicyStatusMissing
          expr: absent(envoy_securitypolicy_info)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Envoy Gateway SecurityPolicy status metric is missing
            description: |-
              envoy_securitypolicy_info produced no samples for 5m — kube-state-metrics
              is down, its securitypolicies RBAC/CRS entry broke, or every SecurityPolicy
              was deleted. EnvoyGatewayPolicyNotAccepted is now blind and a silently
              detached SecurityPolicy will not alert until this recovers.
