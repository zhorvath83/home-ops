---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
# In-repo JSON (core panels only, Prometheus via a datasource variable — no mapping needed).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: envoy-external-geo-gate
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  allowCrossNamespaceImport: true
  folderRef: networking
  configMapRef:
    name: envoy-external-geo-gate-dashboard
    key: envoy-external-geo-gate.json
