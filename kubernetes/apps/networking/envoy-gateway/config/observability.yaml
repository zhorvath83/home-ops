---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-proxy
spec:
  jobLabel: envoy-proxy
  namespaceSelector:
    matchNames:
      - networking
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
      honorLabels: true
      metricRelabelings:
        # P1.2/P1.2b: drop unconsumed envoy-proxy histograms (envoy-proxy-global
        # uses upstream_rq_time + http_downstream_rq_time only).
        - sourceLabels:
            - __name__
          regex: "envoy_cluster_update_duration_bucket|envoy_sds_update_duration_bucket"
          action: drop
        - sourceLabels:
            - __name__
          regex: "envoy_cluster_upstream_(rq_per_cx|cx_length_ms|cx_connect_ms)_bucket|envoy_listener_(downstream_cx_length_ms|connections_accepted_per_socket_event)_bucket"
          action: drop
  selector:
    matchLabels:
      app.kubernetes.io/component: proxy
      app.kubernetes.io/name: envoy
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: envoy-gateway
spec:
  endpoints:
    - port: metrics
      path: /metrics
      honorLabels: true
      metricRelabelings:
        # P1.6: drop unconsumed rest_client histograms (envoy-gateway-global uses
        # watchable/status_update/resource_apply; rest_client only feeds flux dashboards).
        - sourceLabels:
            - __name__
          regex: "rest_client_(request_duration_seconds|rate_limiter_duration_seconds|request_size_bytes|response_size_bytes)_(bucket|sum|count)"
          action: drop
  jobLabel: envoy-gateway
  namespaceSelector:
    matchNames:
      - networking
  selector:
    matchLabels:
      control-plane: envoy-gateway
