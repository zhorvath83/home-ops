---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/_/persistentvolumeclaim_v1.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: geoip
# Not in VolSync: regenerable. Shared with the envoy-external proxy pod (same node, RWO).
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
  storageClassName: democratic-csi-local-hostpath
