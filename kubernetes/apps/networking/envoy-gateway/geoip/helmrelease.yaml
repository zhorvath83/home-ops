---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: geoipupdate
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      labels:
        egress.home.arpa/custom-egress: "true"
        ingress.home.arpa/none: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      geoipupdate:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/maxmind/geoipupdate
              tag: v8.0.0@sha256:51e70dd6f16cd3e4d845ac02d09940b10772a75b9d741427d235a78570923c1d
            env:
              GEOIPUPDATE_EDITION_IDS: GeoLite2-Country
              GEOIPUPDATE_DB_DIR: &dbDir /usr/share/GeoIP
            envFrom:
              - secretRef:
                  name: geoipupdate-secret
            # Replaces entry.sh, which exits on the first failed update: a MaxMind outage must not
            # CrashLoop the pod and stall envoy-gateway-config. GeoIPDatabaseStale catches a lasting failure.
            # Downloads on start (DR seed), then daily; tmp + rename triggers Envoy's inotify hot reload.
            command:
              - /bin/sh
              - -c
            args:
              - |
                trap 'exit 0' TERM
                while true; do
                  if /usr/bin/geoipupdate --verbose; then
                    echo "geoipupdate: ok"
                  else
                    echo "geoipupdate: update failed, keeping the current database" >&2
                  fi
                  sleep 86400 &
                  wait $!
                done
            probes:
              # Ready only once the mmdb exists: envoy-gateway-config depends on this, because
              # Envoy rejects a geoIP provider whose database file is missing.
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - "test"
                      - "-s"
                      - "/usr/share/GeoIP/GeoLite2-Country.mmdb"
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - "test"
                      - "-s"
                      - "/usr/share/GeoIP/GeoLite2-Country.mmdb"
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
    persistence:
      geoip:
        existingClaim: geoip
        globalMounts:
          - path: *dbDir
      tmp:
        type: emptyDir
    networkpolicies:
      main:
        type: cilium
        egress:
          # download.maxmind.com 302-redirects to its R2 bucket for the tarball.
          - toFQDNs:
              - matchName: "download.maxmind.com"
              - matchPattern: "*.maxmind.com"
              - matchName: "mm-prod-geoip-databases.a2649acb697e2c09b632799562c076f2.r2.cloudflarestorage.com"
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
