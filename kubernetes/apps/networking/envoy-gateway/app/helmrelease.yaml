---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  interval: 15m
  values:
    global:
      imageRegistry: mirror.gcr.io
    config:
      envoyGateway:
        extensionApis:
          enableEnvoyPatchPolicy: true
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              type: GatewayNamespace
    deployment:
      envoyGateway:
        # No securityContext override: the chart hardens the controller container by
        # default (read-only root filesystem, non-root 65532, drop ALL, no privilege
        # escalation, RuntimeDefault seccomp). Restating it here would only invite drift
        # from upstream — audit `helm show values` before adding anything back.
        resources:
          requests:
            cpu: 5m
            memory: 192Mi
          limits:
            memory: 1024Mi
        # Single-node: a rolling update would need a surge replica to schedule first.
        strategy:
          type: Recreate
