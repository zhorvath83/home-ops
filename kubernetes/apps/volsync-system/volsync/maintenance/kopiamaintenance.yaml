---
apiVersion: volsync.backube/v1alpha1
kind: KopiaMaintenance
metadata:
  name: kopia-daily-maintenance
spec:
  enabled: true
  # Kopia maintenance jobs never call the K8s API (they talk to OVH S3 + the Kopia
  # repo, auth from volsync-secret). Use a dedicated tokenless SA so no API token
  # is mounted. Honored on the schedule-trigger (CronJob) path; the operator's
  # manual-trigger Job path ignores serviceAccountName — we use trigger.schedule.
  serviceAccountName: kopia-maintenance
  # podSecurityContext replaces the operator default (replace, not merge — verified
  # in kopiamaintenance_controller.go ensureCronJob), so replicate its runAsNonRoot/
  # runAsUser/fsGroup 1000 and add seccomp. Container secctx stays at operator defaults.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  # AD-023: kopia maintenance pods talk to OVH S3 (world egress)
  moverPodLabels:
    egress.home.arpa/allow-world: "true"
  repository:
    repository: volsync-secret
  trigger:
    # "30 */6 * * *" = minute 30 past every 6th hour (00:30, 06:30, 12:30, 18:30 UTC), 4 runs/day.
    schedule: "30 */6 * * *"
