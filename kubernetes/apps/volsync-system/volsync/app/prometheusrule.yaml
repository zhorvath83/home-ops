---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: volsync
spec:
  groups:
    - name: volsync.rules
      rules:
        - alert: VolSyncComponentAbsent
          annotations:
            summary: VolSync component has disappeared from Prometheus target discovery.
          expr: |
            absent(up{job="volsync-metrics"})
          for: 15m
          labels:
            severity: critical
        - alert: VolSyncVolumeOutOfSync
          annotations:
            summary: >-
              {{ $labels.obj_namespace }}/{{ $labels.obj_name }} volume
              is out of sync.
          expr: |
            volsync_volume_out_of_sync == 1
          for: 15m
          labels:
            severity: critical
        # Missed scheduled sync interval — a DR-plane signal the existing
        # exporter-down / out-of-sync rules do not cover. volsync_missed_intervals_total is a
        # COUNTER, so increase() is correct here (unlike the TSDB blocks_bytes gauge, which
        # uses delta). Identity labels are obj_name/obj_namespace (NOT name).
        - alert: VolSyncMissedInterval
          annotations:
            summary: >-
              {{ $labels.obj_namespace }}/{{ $labels.obj_name }} missed a
              scheduled sync interval.
          expr: |
            increase(volsync_missed_intervals_total[1h]) > 0
          for: 15m
          labels:
            severity: warning
