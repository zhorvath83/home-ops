---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: volsync
spec:
  groups:
    - name: volsync.rules
      rules:
        - alert: VolSyncComponentAbsent
          annotations:
            summary: VolSync component has disappeared from Prometheus target discovery.
          expr: |
            absent(up{job="volsync-metrics"})
          for: 15m
          labels:
            severity: critical
        - alert: VolSyncVolumeOutOfSync
          annotations:
            summary: >-
              {{ $labels.obj_namespace }}/{{ $labels.obj_name }} volume
              is out of sync.
          expr: |
            volsync_volume_out_of_sync == 1
          for: 15m
          labels:
            severity: critical
        # Missed scheduled sync interval — a DR-plane signal the existing
        # exporter-down / out-of-sync rules do not cover. volsync_missed_intervals_total is a
        # COUNTER, so increase() is correct here (unlike the TSDB blocks_bytes gauge, which
        # uses delta). Identity labels are obj_name/obj_namespace (NOT name).
        - alert: VolSyncMissedInterval
          annotations:
            summary: >-
              {{ $labels.obj_namespace }}/{{ $labels.obj_name }} missed a
              scheduled sync interval.
          expr: |
            increase(volsync_missed_intervals_total[1h]) > 0
          for: 15m
          labels:
            severity: warning
        # KopiaMaintenance staleness — the sync-plane rules above watch VolSync sync, not the
        # KopiaMaintenance CR's compaction/GC jobs. max_over_time[2d] holds the last completion
        # past Job history GC (successfulJobsHistoryLimit=3); the outer max() drops job_name/
        # namespace labels, so the summary carries no $labels. 43200 = 12h = 2 missed 6-hourly runs.
        - alert: KopiaMaintenanceStale
          expr: |
            time() - max(max_over_time(kube_job_status_completion_time{namespace="volsync-system",job_name=~"kopia-maint-kopia-daily-maintenance-.*"}[2d])) > 43200
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Kopia maintenance kopia-daily-maintenance has not completed in over 12h"
            description: "No KopiaMaintenance kopia-daily-maintenance Job has completed in volsync-system in the last 12h (2 of its 4 scheduled 6-hourly runs missed). Compaction/GC may have stopped — slow backup-integrity risk. VolSync sync alerts cover sync, not maintenance."
