---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
spec:
  chartRef:
    kind: OCIRepository
    name: volsync
  interval: 30m
  values:
    fullnameOverride: volsync # Required for volsync-perfectra1n fork
    image: &image
      repository: ghcr.io/perfectra1n/volsync
      tag: v0.17.11
    kopia: *image
    rclone: *image
    restic: *image
    rsync: *image
    rsync-tls: *image
    syncthing: *image
    manageCRDs: true
    metrics:
      disableAuth: true
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 5m
        memory: 140Mi
      limits:
        memory: 1024Mi
  # P1.8: chart ServiceMonitor is hardcoded (no metricRelabelings hook), so patch
  # via postRenderers. Full endpoint included for CRD list-merge safety — kustomize
  # merges by port: https, preserving interval/tlsConfig while adding metricRelabelings.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ServiceMonitor
              name: volsync
            patch: |-
              apiVersion: monitoring.coreos.com/v1
              kind: ServiceMonitor
              metadata:
                name: volsync
              spec:
                endpoints:
                  - interval: 30s
                    path: /metrics
                    port: https
                    scheme: https
                    tlsConfig:
                      insecureSkipVerify: true
                    metricRelabelings:
                      - sourceLabels:
                          - __name__
                        regex: "controller_runtime_reconcile_time_seconds_bucket|workqueue_(work|queue)_duration_seconds_bucket"
                        action: drop
