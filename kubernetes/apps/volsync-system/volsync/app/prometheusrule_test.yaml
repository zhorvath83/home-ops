---
# yaml-language-server: $schema=https://json.schemastore.org/prometheus.rules.test.json
# promtool unit tests for app/prometheusrule.yaml, covering VolSyncComponentAbsent and
# VolSyncVolumeOutOfSync. ComponentAbsent is bare `absent(up{job="volsync-metrics"})` — no
# `up == 0` branch, so it fires only when the series vanishes (an up==0 scrape failure is a
# present series and must NOT fire). VolumeOutOfSync is `== 1` strict equality, so the
# boundary pair is 1 fire / 0 no-fire / 2 no-fire (2 proves it is ==, not >=). Both for:15m,
# so every fire case evals past 15m (eval at 16m). exp_annotations asserted so the
# $labels.obj_namespace/obj_name template is exercised.
# Run via `just k8s test-prom-rules` (recipe copies this test + .extracted_prometheus_rules.yaml into a temp dir).
rule_files:
  - ./.extracted_prometheus_rules.yaml
evaluation_interval: 1m
tests:
  # === VolSyncComponentAbsent ===
  # (a) Fire: series absent (volsync-metrics gone from discovery). absent() carries the
  # matcher label (job) into the result vector; fires after 15m for.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 16m
        alertname: VolSyncComponentAbsent
        exp_alerts:
          - exp_labels:
              alertname: VolSyncComponentAbsent
              severity: critical
              job: volsync-metrics
            exp_annotations:
              summary: VolSync component has disappeared from Prometheus target discovery.
  # (b) No-fire: up == 1 — the series is present so absent() is empty.
  - interval: 1m
    input_series:
      - series: 'up{job="volsync-metrics"}'
        values: '1x17'
    alert_rule_test:
      - eval_time: 16m
        alertname: VolSyncComponentAbsent
        exp_alerts: []
  # (c) No-fire: up == 0 (scrape failed but present) — absent() is empty because the series exists.
  - interval: 1m
    input_series:
      - series: 'up{job="volsync-metrics"}'
        values: '0x17'
    alert_rule_test:
      - eval_time: 16m
        alertname: VolSyncComponentAbsent
        exp_alerts: []
  # === VolSyncVolumeOutOfSync ===
  # (d) Fire: out_of_sync == 1 (boundary low). exp_labels carry obj_namespace + obj_name;
  # summary renders them via $labels.
  - interval: 1m
    input_series:
      - series: 'volsync_volume_out_of_sync{obj_namespace="backup",obj_name="paperless"}'
        values: '1x17'
    alert_rule_test:
      - eval_time: 16m
        alertname: VolSyncVolumeOutOfSync
        exp_alerts:
          - exp_labels:
              alertname: VolSyncVolumeOutOfSync
              severity: critical
              obj_namespace: backup
              obj_name: paperless
            exp_annotations:
              summary: backup/paperless volume is out of sync.
  # (e) No-fire: out_of_sync == 0 — strict == 1 does not match 0.
  - interval: 1m
    input_series:
      - series: 'volsync_volume_out_of_sync{obj_namespace="backup",obj_name="paperless"}'
        values: '0x17'
    alert_rule_test:
      - eval_time: 16m
        alertname: VolSyncVolumeOutOfSync
        exp_alerts: []
  # (f) No-fire: out_of_sync == 2 — proves the alert is == 1, not >= 1.
  - interval: 1m
    input_series:
      - series: 'volsync_volume_out_of_sync{obj_namespace="backup",obj_name="paperless"}'
        values: '2x17'
    alert_rule_test:
      - eval_time: 16m
        alertname: VolSyncVolumeOutOfSync
        exp_alerts: []
  # === VolSyncMissedInterval ===
  # expr: increase(volsync_missed_intervals_total[1h]) > 0, for:15m. volsync_missed_intervals_total
  # is a COUNTER, so increase() is correct (NOT delta — that is the TSDB gauge's rule). The > 0
  # threshold is robust to increase()'s range-extrapolation: any positive increment fires, and a
  # flat counter (zero or steady non-zero) extrapolates to 0 and does not. Identity labels are
  # obj_name/obj_namespace (NOT name — see roadmap correction #2); summary renders them via
  # $labels. Every fire case evals past for:15m.
  # (g) Fire: counter increments 0->1 at t=1 (`0x1 1x20`); increase[1h] > 0 from t=1, holds, fires
  # after for:15m at 16m, eval at 20m -> firing.
  - interval: 1m
    input_series:
      - series: 'volsync_missed_intervals_total{obj_namespace="backup",obj_name="paperless"}'
        values: '0x1 1x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: VolSyncMissedInterval
        exp_alerts:
          - exp_labels:
              alertname: VolSyncMissedInterval
              severity: warning
              obj_namespace: backup
              obj_name: paperless
            exp_annotations:
              summary: backup/paperless missed a scheduled sync interval.
  # (h) No-fire: counter flat at 0 — no increment, increase[1h] == 0.
  - interval: 1m
    input_series:
      - series: 'volsync_missed_intervals_total{obj_namespace="backup",obj_name="paperless"}'
        values: '0x21'
    alert_rule_test:
      - eval_time: 20m
        alertname: VolSyncMissedInterval
        exp_alerts: []
  # (i) No-fire: counter flat at a steady 5 (a backlog, but NOT growing) — increase[1h] == 0 even
  # though the absolute value is non-zero. Proves the alert is increase>0, not a threshold on the
  # absolute missed-interval count.
  - interval: 1m
    input_series:
      - series: 'volsync_missed_intervals_total{obj_namespace="backup",obj_name="paperless"}'
        values: '5x21'
    alert_rule_test:
      - eval_time: 20m
        alertname: VolSyncMissedInterval
        exp_alerts: []
