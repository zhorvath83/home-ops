---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onepassword-connect
spec:
  chartRef:
    kind: OCIRepository
    name: onepassword-connect
  interval: 30m
  values:
    # Chart defaults handle security: seccompProfile=RuntimeDefault, runAsNonRoot,
    # readOnlyRootFilesystem, drop ALL caps, UID/GID 999.
    connect:
      podLabels:
        egress.home.arpa/custom-egress: "true"
        ingress.home.arpa/allow-prometheus: "true"
      annotations:
        reloader.stakater.com/auto: "true"
      api:
        httpPort: 8080
        imageRepository: ghcr.io/1password/connect-api
        resources:
          requests:
            cpu: 2m
            memory: 32Mi
          limits:
            memory: 128M
        serviceMonitor:
          enabled: true
      sync:
        imageRepository: ghcr.io/1password/connect-sync
        resources:
          requests:
            cpu: 2m
            memory: 16M
          limits:
            memory: 128M
      credentialsName: onepassword-connect-credentials-secret
  # Connect (connect-api + connect-sync) never calls the K8s API — it serves ESO
  # from its local encrypted cache — so it needs no ServiceAccount token. The
  # connect chart exposes no automount value (verified in chart v2.4.1 source),
  # so patch the rendered Deployment to drop the projected token at pod level.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: onepassword-connect
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: onepassword-connect
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
