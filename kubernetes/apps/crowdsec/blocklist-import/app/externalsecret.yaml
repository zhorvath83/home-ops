---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blocklist-import
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: blocklist-import-secret
    creationPolicy: Owner
  data:
    # Bouncer key (X-Api-Key) — read access to /v1/decisions. Same value the LAPI
    # auto-registers via BOUNCER_KEY_blocklist_import in the crowdsec-secret.
    - secretKey: CROWDSEC_LAPI_KEY
      remoteRef:
        key: crowdsec
        property: BLOCKLIST_IMPORT_BOUNCER_KEY
    # Machine credentials — write access (JWT via /v1/watchers/login). The matching
    # machine is registered by the LAPI postStart hook with this password.
    - secretKey: CROWDSEC_MACHINE_PASSWORD
      remoteRef:
        key: crowdsec
        property: BLOCKLIST_IMPORT_MACHINE_PASSWORD
