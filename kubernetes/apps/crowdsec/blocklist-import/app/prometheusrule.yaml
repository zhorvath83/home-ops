---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: blocklist-import
spec:
  groups:
    - name: blocklist-import
      rules:
        # Daily 04:00 CronJob, backoffLimit 3, failedJobsHistory 3 keeps failed Job
        # objects queryable. A failed Job means decisions may be stale.
        - alert: CrowdSecBlocklistImportFailed
          expr: kube_job_status_failed{namespace="crowdsec", job_name=~"blocklist-import-.*"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: CrowdSec blocklist-import CronJob failed
            description: |-
              The blocklist-import CronJob has a failed Job, so new malicious IPs are not being
              imported and existing decisions may be stale. Check the Job logs — common causes
              are LAPI auth failure (machine not registered or rotated bouncer key), a feed FQDN
              blocked by the CNP, or a malformed feed.
