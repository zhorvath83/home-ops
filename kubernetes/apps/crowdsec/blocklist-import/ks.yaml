---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: blocklist-import
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: blocklist-import
  dependsOn:
    - name: onepassword-connect
      namespace: external-secrets
    # LAPI must be up and the blocklist-import bouncer/machine registered first.
    - name: crowdsec
      namespace: crowdsec
  interval: 1h
  path: ./kubernetes/apps/crowdsec/blocklist-import/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: crowdsec
  timeout: 5m
  wait: false
