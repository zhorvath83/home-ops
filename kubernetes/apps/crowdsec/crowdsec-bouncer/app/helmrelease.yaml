---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec-bouncer
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: crowdsec-bouncer
  values:
    nameOverride: crowdsec-bouncer
    fullnameOverride: crowdsec-bouncer
    replicaCount: 1
    image:
      tag: v0.6.3@sha256:85c9f802eca3ad32aa4a8cb5b63e5c5a5642b07cff623beca0bab634c2128020
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    # The chart drops capabilities as lowercase `all`, which PSS restricted does not accept
    # (it matches the literal "ALL"); the rest of its container securityContext is fine.
    securityContext:
      capabilities:
        drop:
          - "ALL"
    config:
      server:
        logLevel: info
      # Envoy already resolved the client IP (CF-Connecting-IP externally, TCP source on
      # the LAN gateway) and stamps it here, so no XFF walking or proxy CIDR list.
      trustedIPHeader: X-Envoy-External-Address
      # Cluster-internal callers only (pod + service CIDR): in-cluster probes and OIDC
      # hairpins must never be evaluated. LAN clients stay in scope so the WAF applies
      # to them on envoy-internal.
      exemptIPs:
        - 10.0.0.0/8
      bouncer:
        enabled: true
        lapiURL: http://crowdsec-service.crowdsec.svc.cluster.local:8080
        apiKeySecretRef:
          name: crowdsec-bouncer-secret
          key: BOUNCER_API_KEY
      waf:
        enabled: true
        appSecURL: http://crowdsec-appsec-service.crowdsec.svc.cluster.local:7422
        apiKeySecretRef:
          name: crowdsec-bouncer-secret
          key: BOUNCER_API_KEY
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
    grafana:
      dashboard:
        enabled: true
    # Lets the SecurityPolicy in `networking` reference this Service cross-namespace.
    referenceGrant:
      create: true
      fromNamespaces:
        - networking
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi
  # envoy-proxy-bouncer exposes no Deployment-metadata annotation hook (only podAnnotations,
  # which Reloader does not read), and adds no config checksum to the pod template either — so a
  # bouncer ConfigMap change never rolls the pod. Inject the Reloader trigger the chart omits,
  # matching crowdsec-lapi and crowdsec-web-ui which both carry it on Deployment metadata.
  # Chart exposes no service-account token-mount key either; harden the pod spec here too.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: crowdsec-bouncer
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: crowdsec-bouncer
                annotations:
                  reloader.stakater.com/auto: "true"
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
                    enableServiceLinks: false
