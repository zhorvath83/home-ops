---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: crowdsec-bouncer
spec:
  groups:
    - name: crowdsec-bouncer
      rules:
        # The bouncer is a single-replica ext_authz service configured fail-closed, so
        # while a SecurityPolicy is attached its outage 5xx-es every route on that gateway.
        # `up == 0` only catches a scrape that ran and failed; scale-to-0, crashloop, or a
        # readiness-split pod drops the target from the scrape pool and the `up` series
        # vanishes, so `absent()` is the branch that fires for those — without it the alert
        # never goes off for the common outage shapes.
        - alert: CrowdSecBouncerDown
          expr: up{job="crowdsec-bouncer", namespace="crowdsec"} == 0 or absent(up{job="crowdsec-bouncer", namespace="crowdsec"})
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: CrowdSec Envoy bouncer is down
            description: |-
              The ext_authz bouncer is unreachable. If a bouncer SecurityPolicy is attached
              to a Gateway, every route on it now fails closed (5xx). Remove that
              SecurityPolicy to restore traffic, then fix the bouncer.
