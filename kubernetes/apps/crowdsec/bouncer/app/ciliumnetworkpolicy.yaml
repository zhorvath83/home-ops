---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Only the two envoy proxies may call the ext_authz gRPC port; prometheus arrives through
# the matching CCNP. The chart offers no podLabels, so the gateway ingress is spelled out
# here instead of using the ingress.home.arpa/* vocabulary.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crowdsec-bouncer
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: crowdsec-bouncer
      app.kubernetes.io/instance: crowdsec-bouncer
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
