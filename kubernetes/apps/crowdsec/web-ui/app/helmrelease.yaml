---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec-web-ui
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # LAN-only dashboard: no envoy-external parent, so no external gateway ingress.
      labels:
        ingress.home.arpa/allow-gateway-internal: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      crowdsec-web-ui:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # renovate: datasource=docker depName=ghcr.io/theduffman85/crowdsec-web-ui
              repository: ghcr.io/theduffman85/crowdsec-web-ui
              tag: 2026.7.25@sha256:16edc60a9d3bf4f933e55ba15a22b9d8be1b3a40d1944941873e6c0a4847d04b
            env:
              CONFIG_SERVER_PORT: &port 3000
              CONFIG_UI_TIME_ZONE: "Europe/Budapest"
              CONFIG_UPDATES_ENABLED: "false"
              CONFIG_INSTANCE_NAME: home-ops
              CONFIG_INSTANCE_LAPI_URL: http://crowdsec-service.crowdsec.svc.cluster.local:8080
              CONFIG_INSTANCE_LAPI_AUTH_USERNAME: crowdsec-web-ui
              # Web-ui shows one endpoint at a time and cannot merge; Prometheus already
              # scrapes all three, so index 0 is the federate aggregate (the UI default).
              # The three direct :6060 endpoints stay as a real-time fallback.
              CONFIG_INSTANCES_0_METRICS_0_ID: all
              CONFIG_INSTANCES_0_METRICS_0_NAME: All (Prometheus)
              CONFIG_INSTANCES_0_METRICS_0_URL: "http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/federate?match[]=%7B__name__%3D~%22cs_.*%22%7D"
              CONFIG_INSTANCES_0_METRICS_1_ID: lapi
              CONFIG_INSTANCES_0_METRICS_1_NAME: LAPI
              CONFIG_INSTANCES_0_METRICS_1_URL: http://crowdsec-service.crowdsec.svc.cluster.local:6060/metrics
              CONFIG_INSTANCES_0_METRICS_2_ID: agent
              CONFIG_INSTANCES_0_METRICS_2_NAME: Agent
              CONFIG_INSTANCES_0_METRICS_2_URL: http://crowdsec-agent-service.crowdsec.svc.cluster.local:6060/metrics
              CONFIG_INSTANCES_0_METRICS_3_ID: appsec
              CONFIG_INSTANCES_0_METRICS_3_NAME: AppSec
              CONFIG_INSTANCES_0_METRICS_3_URL: http://crowdsec-appsec-service.crowdsec.svc.cluster.local:6060/metrics
              # App-level OIDC (like grafana) — this route deliberately carries no
              # gateway-oidc SecurityPolicy, which would double-gate the login.
              CONFIG_AUTH_OIDC_ISSUER_URL: "https://idm.${PUBLIC_DOMAIN}"
              CONFIG_AUTH_OIDC_CLIENT_ID: crowdsec-web-ui
              CONFIG_AUTH_OIDC_SCOPE: openid profile email groups
              CONFIG_AUTH_OIDC_GROUPS_CLAIM: groups
              CONFIG_AUTH_OIDC_ADMIN_GROUPS_0: infra_admins
              CONFIG_AUTH_OIDC_UNMATCHED_ROLE: deny
            envFrom:
              - secretRef:
                  name: crowdsec-web-ui-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 384Mi
    service:
      app:
        controller: crowdsec-web-ui
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: CrowdSec
          gethomepage.dev/group: Security
          gethomepage.dev/icon: crowdsec
        hostnames:
          - "crowdsec.${PUBLIC_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: democratic-csi-local-hostpath
        globalMounts:
          - path: /app/data
      tmp:
        type: emptyDir
