---
# yaml-language-server: $schema=https://json.schemastore.org/prometheus-test
# promtool unit tests for app/prometheusrule.yaml, covering CrowdSecAgentDown and
# CrowdSecAppsecDown only. Both follow the CrowdSecLAPIDown shape: `up == 0 or absent(up{...})`,
# so the `absent()` branch covers scale-to-0 / crashloop / evicted where the `up` series
# vanishes — that is the branch the tests exercise most, since `up == 0` alone would never
# fire for those outage shapes. for:5m, so every fire case evals past 5m (eval at 6m).
# Run via `just k8s test-prom-rules` (recipe extracts .spec into ./_extracted_rules.yaml).
rule_files:
  - ./_extracted_rules.yaml
evaluation_interval: 1m
tests:
  # === CrowdSecAgentDown ===
  # (a) Fire: series absent (DaemonSet gone / scaled to 0). absent() carries the matcher labels
  # (job, namespace) into the result vector; fires after 5m for.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 6m
        alertname: CrowdSecAgentDown
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecAgentDown
              severity: critical
              job: crowdsec-agent-service
              namespace: crowdsec
            exp_annotations:
              summary: CrowdSec agent is down
              description: |-
                The crowdsec-agent DaemonSet has no scrapeable target, so envoy container logs
                are not parsed and no local decisions are issued. CAPI blocklists still apply via
                the LAPI, but scenario-based detection is stopped. Check the crowdsec-agent DaemonSet.
  # (b) Fire: up == 0 (scrape ran and failed) — the left branch of the `or`. exp_labels carry
  # job + namespace from the up series.
  - interval: 1m
    input_series:
      - series: 'up{job="crowdsec-agent-service",namespace="crowdsec"}'
        values: '0x7'
    alert_rule_test:
      - eval_time: 6m
        alertname: CrowdSecAgentDown
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecAgentDown
              severity: critical
              job: crowdsec-agent-service
              namespace: crowdsec
            exp_annotations:
              summary: CrowdSec agent is down
              description: |-
                The crowdsec-agent DaemonSet has no scrapeable target, so envoy container logs
                are not parsed and no local decisions are issued. CAPI blocklists still apply via
                the LAPI, but scenario-based detection is stopped. Check the crowdsec-agent DaemonSet.
  # (c) No-fire: up == 1 — `up == 0` is empty and the series is present so absent() is empty too.
  - interval: 1m
    input_series:
      - series: 'up{job="crowdsec-agent-service",namespace="crowdsec"}'
        values: '1x7'
    alert_rule_test:
      - eval_time: 6m
        alertname: CrowdSecAgentDown
        exp_alerts: []
  # === CrowdSecAppsecDown ===
  # (d) Fire: series absent — same shape as (a); job label is the appsec ServiceMonitor name.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 6m
        alertname: CrowdSecAppsecDown
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecAppsecDown
              severity: critical
              job: crowdsec-appsec-service
              namespace: crowdsec
            exp_annotations:
              summary: CrowdSec AppSec is down
              description: |-
                The crowdsec-appsec Deployment has no scrapeable target, so in-band AppSec rule
                evaluation is not running. Requests routed through appsec are no longer inspected
                for app-level signals. Check the crowdsec-appsec Deployment.
  # (e) Fire: up == 0 — left branch of the `or`.
  - interval: 1m
    input_series:
      - series: 'up{job="crowdsec-appsec-service",namespace="crowdsec"}'
        values: '0x7'
    alert_rule_test:
      - eval_time: 6m
        alertname: CrowdSecAppsecDown
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecAppsecDown
              severity: critical
              job: crowdsec-appsec-service
              namespace: crowdsec
            exp_annotations:
              summary: CrowdSec AppSec is down
              description: |-
                The crowdsec-appsec Deployment has no scrapeable target, so in-band AppSec rule
                evaluation is not running. Requests routed through appsec are no longer inspected
                for app-level signals. Check the crowdsec-appsec Deployment.
  # (f) No-fire: up == 1 — both branches empty, stays quiet through for:5m.
  - interval: 1m
    input_series:
      - series: 'up{job="crowdsec-appsec-service",namespace="crowdsec"}'
        values: '1x7'
    alert_rule_test:
      - eval_time: 6m
        alertname: CrowdSecAppsecDown
        exp_alerts: []
  # === CrowdSecDecisionBudgetNearCap ===
  # expr is sum() with NO by(), so every label is aggregated away — exp_labels carry ONLY
  # alertname + severity (no job/namespace, unlike every sibling case above). Annotations are
  # static (no $labels/$value), asserted verbatim. for:30m + evaluation_interval:1m -> fire at 31m.
  # The 63750 threshold is hand-computed 85% of MAX_DECISIONS (75000), which lives in a different
  # file (crowdsec-blocklist-import/app/helmrelease.yaml) with nothing linking them — these tests are the
  # only artifact pinning the relationship (crowdsec's first threshold alert).
  # (1) Boundary NO-fire: total exactly 63750. `>` is strict, so 63750 > 63750 is false; no fire
  # even after for:30m (eval at 31m).
  - interval: 1m
    input_series:
      - series: 'cs_active_decisions{job="crowdsec-service",namespace="crowdsec",origin="CAPI"}'
        values: '63750x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: CrowdSecDecisionBudgetNearCap
        exp_alerts: []
  # (2) Boundary FIRE: total 63751 (one above threshold). Fires at 31m; labels = alertname + severity only.
  - interval: 1m
    input_series:
      - series: 'cs_active_decisions{job="crowdsec-service",namespace="crowdsec",origin="CAPI"}'
        values: '63751x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: CrowdSecDecisionBudgetNearCap
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecDecisionBudgetNearCap
              severity: warning
            exp_annotations:
              summary: CrowdSec decisions approaching the MAX_DECISIONS cap
              description: |-
                Total active LAPI decisions (all origins, CAPI included) are above 85% of the
                blocklist-import MAX_DECISIONS cap (75000). When the cap is reached the importer
                logs "skipping remaining sources" and exits 0, so KubeJobFailed never fires and
                the tail feeds (Cybercrime Tracker, VXVault) drop silently. Raise MAX_DECISIONS
                or prune a feed before that happens. keep_firing_for: 48h latches the alert: once
                the count drops below the threshold it stays firing for ~48h (≥ the daily 24h-TTL
                sawtooth) before resolving — not minutes — so a peak crossing does not flap.
  # (3) `for` not yet met: same 63751 series at eval 29m, before 30m elapses — pins for:30m.
  - interval: 1m
    input_series:
      - series: 'cs_active_decisions{job="crowdsec-service",namespace="crowdsec",origin="CAPI"}'
        values: '63751x40'
    alert_rule_test:
      - eval_time: 29m
        alertname: CrowdSecDecisionBudgetNearCap
        exp_alerts: []
  # (4) CROSS-ORIGIN SUM: CAPI 60000 + blocklist-import 4948 = 64948 > 63750. Proves the rule
  # aggregates across origins — the entire justification for a total-cap threshold (CAPI alone at
  # 60000 would not fire). Fires at 31m.
  - interval: 1m
    input_series:
      - series: 'cs_active_decisions{job="crowdsec-service",namespace="crowdsec",origin="CAPI"}'
        values: '60000x40'
      - series: 'cs_active_decisions{job="crowdsec-service",namespace="crowdsec",origin="blocklist-import"}'
        values: '4948x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: CrowdSecDecisionBudgetNearCap
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecDecisionBudgetNearCap
              severity: warning
            exp_annotations:
              summary: CrowdSec decisions approaching the MAX_DECISIONS cap
              description: |-
                Total active LAPI decisions (all origins, CAPI included) are above 85% of the
                blocklist-import MAX_DECISIONS cap (75000). When the cap is reached the importer
                logs "skipping remaining sources" and exits 0, so KubeJobFailed never fires and
                the tail feeds (Cybercrime Tracker, VXVault) drop silently. Raise MAX_DECISIONS
                or prune a feed before that happens. keep_firing_for: 48h latches the alert: once
                the count drops below the threshold it stays firing for ~48h (≥ the daily 24h-TTL
                sawtooth) before resolving — not minutes — so a peak crossing does not flap.
  # (5) Negative, current operating region: CAPI 58000 + blocklist-import 4948 = 62948 < 63750 — no
  # fire at 31m. Mirrors today's ~39k live total (well under the alert).
  - interval: 1m
    input_series:
      - series: 'cs_active_decisions{job="crowdsec-service",namespace="crowdsec",origin="CAPI"}'
        values: '58000x40'
      - series: 'cs_active_decisions{job="crowdsec-service",namespace="crowdsec",origin="blocklist-import"}'
        values: '4948x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: CrowdSecDecisionBudgetNearCap
        exp_alerts: []
  # (6) Selector pin: the metric on the wrong job (crowdsec-agent-service) does not match the
  # job="crowdsec-service" matcher — 70000 must not fire. Pins the job matcher.
  - interval: 1m
    input_series:
      - series: 'cs_active_decisions{job="crowdsec-agent-service",namespace="crowdsec",origin="CAPI"}'
        values: '70000x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: CrowdSecDecisionBudgetNearCap
        exp_alerts: []
  # (7) keep_firing_for pin: 63751 for 40m (fires at 31m), then 0 for 30m. At eval 60m the
  # condition has been false since 41m, so WITHOUT keep_firing_for the alert would have
  # resolved and returned got:[] — it stays firing here ONLY because keep_firing_for: 48h
  # latches it for 48h after the condition drops. This is the one mutation the suite did not
  # catch (removing keep_firing_for left the other 12 cases green); pinned by mutation test.
  - interval: 1m
    input_series:
      - series: 'cs_active_decisions{job="crowdsec-service",namespace="crowdsec",origin="CAPI"}'
        values: '63751x40 0x30'
    alert_rule_test:
      - eval_time: 60m
        alertname: CrowdSecDecisionBudgetNearCap
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecDecisionBudgetNearCap
              severity: warning
            exp_annotations:
              summary: CrowdSec decisions approaching the MAX_DECISIONS cap
              description: |-
                Total active LAPI decisions (all origins, CAPI included) are above 85% of the
                blocklist-import MAX_DECISIONS cap (75000). When the cap is reached the importer
                logs "skipping remaining sources" and exits 0, so KubeJobFailed never fires and
                the tail feeds (Cybercrime Tracker, VXVault) drop silently. Raise MAX_DECISIONS
                or prune a feed before that happens. keep_firing_for: 48h latches the alert: once
                the count drops below the threshold it stays firing for ~48h (≥ the daily 24h-TTL
                sawtooth) before resolving — not minutes — so a peak crossing does not flap.
  # === CrowdSecBlocklistImportSourceFailing ===
  # expr aggregates max by(source) so exp_labels carry alertname + severity + source (job/instance
  # dropped). for:48h; the test group interval MUST equal the file's evaluation_interval (1m) —
  # promtool advances the `for` timer on the global evaluation_interval ticks, so a coarser group
  # interval (1h/30m) never satisfies for:48h and the alert never fires. The Pushgateway retains
  # the last pushed value between daily runs, so 0xN is a continuous N-minute failure; 48h = 2880m
  # = 2 consecutive failed daily runs (24h schedule). keep_firing_for:24h latches past recovery.
  # (8) FIRE: source_status 0 for 48h1m (2 failed daily runs). max by(source)==0 holds 2881m ->
  # fires at 48h1m (for:48h + 1m, same for+1m pattern as CrowdSecDecisionBudgetNearCap case 2).
  - interval: 1m
    input_series:
      - series: 'blocklist_import_source_status{job="crowdsec-blocklist-import",source="Cybercrime Tracker"}'
        values: '0x2882'
    alert_rule_test:
      - eval_time: 48h1m
        alertname: CrowdSecBlocklistImportSourceFailing
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecBlocklistImportSourceFailing
              severity: warning
              source: Cybercrime Tracker
            exp_annotations:
              summary: A blocklist-import feed failed to fetch
              description: |-
                blocklist-import source Cybercrime Tracker reported fetch status 0 (failed) for
                ~2 consecutive daily runs. The job exits 0 as long as ≥1 source succeeds, so
                feed-rot is invisible to KubeJobFailed. Check the importer logs and the feed URL;
                prune or disable the feed if it is dead.
  # (9) NO-FIRE: source_status 1 (healthy) for 48h1m — max by(source)==1, condition false, stays quiet.
  - interval: 1m
    input_series:
      - series: 'blocklist_import_source_status{job="crowdsec-blocklist-import",source="Cybercrime Tracker"}'
        values: '1x2882'
    alert_rule_test:
      - eval_time: 48h1m
        alertname: CrowdSecBlocklistImportSourceFailing
        exp_alerts: []
  # (10) NO-FIRE transient: 0 for 24h (one failed run) then 1 (recovered next run). The condition
  # never holds 48h continuously and is false at 48h1m — a single transient fetch failure does not page.
  - interval: 1m
    input_series:
      - series: 'blocklist_import_source_status{job="crowdsec-blocklist-import",source="Cybercrime Tracker"}'
        values: '0x1440 1x1442'
    alert_rule_test:
      - eval_time: 48h1m
        alertname: CrowdSecBlocklistImportSourceFailing
        exp_alerts: []
  # (11) keep_firing_for pin: 0 for 50h (fires at 48h1m), then 1 for 23h. At eval 73h the condition has
  # been false since 50h (23h < 24h keep_firing_for), so it stays firing — removing keep_firing_for:24h
  # would resolve it and return got:[]. Mutation pin, same pattern as case (7).
  - interval: 1m
    input_series:
      - series: 'blocklist_import_source_status{job="crowdsec-blocklist-import",source="Cybercrime Tracker"}'
        values: '0x3000 1x1381'
    alert_rule_test:
      - eval_time: 73h
        alertname: CrowdSecBlocklistImportSourceFailing
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecBlocklistImportSourceFailing
              severity: warning
              source: Cybercrime Tracker
            exp_annotations:
              summary: A blocklist-import feed failed to fetch
              description: |-
                blocklist-import source Cybercrime Tracker reported fetch status 0 (failed) for
                ~2 consecutive daily runs. The job exits 0 as long as ≥1 source succeeds, so
                feed-rot is invisible to KubeJobFailed. Check the importer logs and the feed URL;
                prune or disable the feed if it is dead.
  # === CrowdSecBlocklistImportMetricsAbsent ===
  # absent() carries the selector's job label into the result -> exp_labels carry alertname +
  # severity + job. for:1h with interval:1m -> fire at 61m. Pins the "whole freshness signal dead" case.
  # (12) FIRE: no source_status series at all. absent() returns {job="crowdsec-blocklist-import"}=1;
  # fires at 61m.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 61m
        alertname: CrowdSecBlocklistImportMetricsAbsent
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecBlocklistImportMetricsAbsent
              severity: warning
              job: crowdsec-blocklist-import
            exp_annotations:
              summary: blocklist-import freshness metrics are absent
              description: |-
                No blocklist_import_source_status series has been scraped for 1h — the per-source
                freshness signal is dead. Likely causes: METRICS_ENABLED disabled, the Pushgateway
                unreachable or down, or the importer crashing before its metrics push. The
                CrowdSecBlocklistImportSourceFailing alert cannot fire while this is absent, so
                treat as a monitoring outage of the feed-rot detection plane.
  # (13) NO-FIRE: a source_status series is present (value 1) — absent() is empty, stays quiet at 61m.
  - interval: 1m
    input_series:
      - series: 'blocklist_import_source_status{job="crowdsec-blocklist-import",source="Spamhaus DROP"}'
        values: '1x62'
    alert_rule_test:
      - eval_time: 61m
        alertname: CrowdSecBlocklistImportMetricsAbsent
        exp_alerts: []
  # (14) NO-FIRE for-not-met: no series but eval at 30m (< for:1h) — pending, does not fire. Pins for:1h.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 30m
        alertname: CrowdSecBlocklistImportMetricsAbsent
        exp_alerts: []
