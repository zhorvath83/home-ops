---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: crowdsec
spec:
  groups:
    - name: crowdsec
      rules:
        # `absent()` covers scale-to-0 / crashloop / readiness-split, where the `up` series
        # vanishes and `up == 0` alone would never fire — same shape as the bouncer rule.
        - alert: CrowdSecLAPIDown
          expr: up{job="crowdsec-service", namespace="crowdsec"} == 0 or absent(up{job="crowdsec-service", namespace="crowdsec"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: CrowdSec LAPI is down
            description: |-
              The CrowdSec LAPI is unreachable, so no decision can be issued or queried.
              Once the bouncer SecurityPolicy is attached this also fails requests closed
              on the affected gateway.
        # DaemonSet down: `absent()` covers scale-to-0 / crashloop / evicted where `up` vanishes
        # — same shape as CrowdSecLAPIDown. AcquisitionStalled catches the slower "blind" case.
        - alert: CrowdSecAgentDown
          expr: up{job="crowdsec-agent-service", namespace="crowdsec"} == 0 or absent(up{job="crowdsec-agent-service", namespace="crowdsec"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: CrowdSec agent is down
            description: |-
              The crowdsec-agent DaemonSet has no scrapeable target, so envoy container logs
              are not parsed and no local decisions are issued. CAPI blocklists still apply via
              the LAPI, but scenario-based detection is stopped. Check the crowdsec-agent DaemonSet.
        # AppSec Deployment down: in-band appsec evaluation stops. `absent()` covers crashloop /
        # scale-to-0 / evicted, same shape as the LAPI/agent rules.
        - alert: CrowdSecAppsecDown
          expr: up{job="crowdsec-appsec-service", namespace="crowdsec"} == 0 or absent(up{job="crowdsec-appsec-service", namespace="crowdsec"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: CrowdSec AppSec is down
            description: |-
              The crowdsec-appsec Deployment has no scrapeable target, so in-band AppSec rule
              evaluation is not running. Requests routed through appsec are no longer inspected
              for app-level signals. Check the crowdsec-appsec Deployment.
        # Symmetric 6h windows + keep_firing_for: measured over 7d the envoy counter has
        # zero-traffic gaps (21% of 2h, 7% of 4h, 3.5% of 6h windows, longest 6h gap 2.9h),
        # which is what made the 1h version self-resolve mid-stall; 12h misses an 8h stall.
        # `hits_ok` is the only parse-success signal; `or vector(0)` — absent until the 1st hit.
        - alert: CrowdSecAcquisitionStalled
          expr: |
            sum(increase(envoy_http_downstream_rq_total{job="networking/envoy-proxy", namespace="networking", envoy_http_conn_manager_prefix=~"https?-.*"}[6h])) > 0
              and
            (sum(increase(cs_parser_hits_ok_total{job="crowdsec-agent-service", namespace="crowdsec", acquis_type="containerd", source=~"/var/log/containers/envoy-.*"}[6h])) or vector(0)) == 0
          for: 10m
          keep_firing_for: 3h
          labels:
            severity: warning
          annotations:
            summary: CrowdSec parses no envoy request
            description: |-
              Envoy served requests but the agent parsed none, so no local decision is being
              created. Likely causes: the agent DaemonSet is down or crash-looping, the
              /var/log/containers/envoy-* glob matches nothing (envoy pods recreated with
              new names mid-window), or the parser chain cri-logs -> envoy-logs broke.
              Remediation: check the agent DaemonSet and its acquisition, then restart it.
        # Non-CAPI origin = a locally issued ban (agent scenario / appsec / cscli / console),
        # excluding the noisy ~25k community blocklist (CAPI), console blocklists (lists),
        # and the blocklist-import CronJob (its decisions are expected and high-volume).
        # The gauge is Reset() each scrape, so for/keep_firing_for debounce a resolve->refire
        # without lagging a 4h ban's real end.
        - alert: CrowdSecBanActive
          expr: sum by (reason, origin, action) (cs_active_decisions{job="crowdsec-service", namespace="crowdsec", origin!~"CAPI|lists(:.*)?|blocklist-import"}) > 0
          for: 1m
          keep_firing_for: 5m
          labels:
            severity: critical
          annotations:
            summary: CrowdSec banned a source
            description: |-
              CrowdSec banned a source after the scenario below tripped. The ban lasts 4h
              and doubles for each repeat offence; no action is needed. If it was you,
              clear it with `cscli decisions delete <ip>`.
        # MAX_DECISIONS is a TOTAL cap (CAPI included); on budget exhaustion the importer
        # exits 0 (KubeJobFailed never fires), so this predicts silent truncation. 85% of 75000.
        - alert: CrowdSecDecisionBudgetNearCap
          expr: sum(cs_active_decisions{job="crowdsec-service", namespace="crowdsec"}) > 63750
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: CrowdSec decisions approaching the MAX_DECISIONS cap
            description: |-
              Total active LAPI decisions (all origins, CAPI included) are above 85% of the
              blocklist-import MAX_DECISIONS cap (75000). When the cap is reached the importer
              logs "skipping remaining sources" and exits 0, so KubeJobFailed never fires and
              the tail feeds (Cybercrime Tracker, VXVault) drop silently. Raise MAX_DECISIONS
              or prune a feed before that happens. Self-resolves when the count drops back.
