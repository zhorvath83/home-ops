---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: crowdsec
spec:
  groups:
    - name: crowdsec
      rules:
        # `absent()` covers scale-to-0 / crashloop / readiness-split, where the `up` series
        # vanishes and `up == 0` alone would never fire — same shape as the bouncer rule.
        - alert: CrowdSecLAPIDown
          expr: up{job="crowdsec", namespace="crowdsec"} == 0 or absent(up{job="crowdsec", namespace="crowdsec"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: CrowdSec LAPI is down
            description: |-
              The CrowdSec LAPI is unreachable, so no decision can be issued or queried.
              Once the bouncer SecurityPolicy is attached this also fails requests closed
              on the affected gateway.
        # Gate on envoy's own counter (prefix filter drops eg-ready-http, which ticks when idle):
        # a broken LogsQL query reads zero lines, which no crowdsec metric can see. `hits_ok` is
        # the only parse-success signal (`hits_total` counts entry); `or vector(0)` — absent till 1st hit.
        - alert: CrowdSecAcquisitionStalled
          expr: |
            sum(increase(envoy_http_downstream_rq_total{job="networking/envoy-proxy", namespace="networking", envoy_http_conn_manager_prefix=~"https?-.*"}[1h])) > 0
              and
            (sum(increase(cs_parser_hits_ok_total{job="crowdsec", namespace="crowdsec", acquis_type="envoy"}[1h])) or vector(0)) == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: CrowdSec parses no envoy request
            description: |-
              Envoy served requests in the last hour but CrowdSec parsed none — the LogsQL
              acquisition query or the envoy parser no longer matches. Check `cscli metrics`
              and re-run the query in acquis.yaml against victoria-logs.
