---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: crowdsec
spec:
  groups:
    - name: crowdsec
      rules:
        - alert: CrowdSecLAPIDown
          expr: up{job="crowdsec", namespace="crowdsec"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: CrowdSec LAPI is down
            description: |-
              The CrowdSec LAPI is unreachable, so no decision can be issued or queried.
              Once the bouncer SecurityPolicy is attached this also fails requests closed
              on the affected gateway.
        # Acquisition runs over a LogsQL query that reconstructs the envoy access log
        # line; a VictoriaLogs field rename or collector change breaks it silently, and
        # zero parse hits is the only symptom.
        - alert: CrowdSecAcquisitionStalled
          expr: sum(rate(cs_parser_hits_total{job="crowdsec", namespace="crowdsec"}[30m])) == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: CrowdSec has parsed no log line for an hour
            description: |-
              No parser hits for 1h — the victoria-logs acquisition query probably no longer
              matches the envoy access-log fields. Check `cscli metrics` and re-run the
              LogsQL query against victoria-logs.
