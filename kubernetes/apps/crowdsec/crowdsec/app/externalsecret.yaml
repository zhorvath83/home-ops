---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: crowdsec-secret
    creationPolicy: Owner
    template:
      data:
        # docker_start.sh registers a bouncer per BOUNCER_KEY_* env var, and one extra
        # machine from AGENT_USERNAME/AGENT_PASSWORD — both idempotent on restart.
        BOUNCER_KEY_envoy: "{{ .BOUNCER_API_KEY }}"
        AGENT_PASSWORD: "{{ .WEBUI_LAPI_PASSWORD }}"
  dataFrom:
    - extract:
        key: crowdsec
