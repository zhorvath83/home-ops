---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: crowdsec-secret
    creationPolicy: Owner
    template:
      data:
        # docker_start.sh registers a bouncer per BOUNCER_KEY_* env var, and one extra
        # machine from AGENT_USERNAME/AGENT_PASSWORD — both idempotent on restart.
        BOUNCER_KEY_envoy: "{{ .BOUNCER_API_KEY }}"
        AGENT_PASSWORD: "{{ .WEBUI_LAPI_PASSWORD }}"
        # Console enrollment; re-running it is a no-op once accepted. Pulled as an
        # explicit remoteRef so a missing field fails this ExternalSecret loudly instead
        # of feeding a bogus token to `cscli console enroll`, which would crashloop.
        ENROLL_KEY: "{{ .capi_enroll_token }}"
  dataFrom:
    - extract:
        key: crowdsec
  data:
    - secretKey: capi_enroll_token
      remoteRef:
        key: crowdsec
        property: CAPI_ENROLL_TOKEN
