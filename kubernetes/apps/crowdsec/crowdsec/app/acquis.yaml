---
# VictoriaLogs stores the envoy JSON access log decomposed into flat fields and leaves
# _msg as its "missing _msg field" placeholder, while the crowdsec victorialogs
# datasource only ever forwards _msg to the parser. copy+pack_json rebuilds a line the
# yanis-kouidri/envoy parser can grok, using the field names that parser expects.
# The response_code/method filter drops connection-level records (no HTTP request).
source: victorialogs
mode: tail
url: http://victoria-logs-server.observability.svc.cluster.local:9428
query: >-
  kubernetes.pod_namespace:networking AND kubernetes.container_name:envoy AND response_code:* AND method:*
  | copy path as "x-envoy-origin-path", user_agent as "user-agent", authority as ":authority", x_forwarded_for as "x-forwarded-for"
  | pack_json fields (start_time, method, "x-envoy-origin-path", response_code, "user-agent", downstream_remote_address, ":authority", "x-forwarded-for")
labels:
  type: envoy
---
source: appsec
listen_addr: 0.0.0.0:7422
path: /
appsec_config: crowdsecurity/appsec-default
labels:
  type: appsec
