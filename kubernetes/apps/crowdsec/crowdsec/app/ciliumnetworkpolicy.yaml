---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# LAPI/AppSec are only ever called by the bouncer and the Web UI; prometheus arrives
# through the matching CCNP. Egress stays on the cluster baseline (envoy access logs are
# pulled from victoria-logs in-cluster) plus the crowdsec hub/CAPI endpoints.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crowdsec
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: crowdsec
      app.kubernetes.io/instance: crowdsec
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: crowdsec-bouncer
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "7422"
              protocol: TCP
    # 8080 is the LAPI; 6060 backs the Web UI's own metrics page (not the Prometheus scrape).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: crowdsec-web-ui
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "6060"
              protocol: TCP
  egress:
    # One vendor domain covering every endpoint cscli reaches: cdn-hub (index/items),
    # hub-data (GeoLite2 mmdb — no MaxMind account needed), version, and api/papi for the
    # community blocklist. Enumerating them broke the startup hub update on version.crowdsec.net.
    - toFQDNs:
        - matchName: "crowdsec.net"
        - matchPattern: "*.crowdsec.net"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
