---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Vendor egress is shared by all three pods: the agent has no data PVC, so it and AppSec
# re-download hub items and the GeoLite2 mmdb on every start, just like the LAPI.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crowdsec
spec:
  endpointSelector:
    matchLabels:
      k8s-app: crowdsec
  egress:
    # One vendor domain covering every endpoint cscli reaches: cdn-hub (index/items),
    # hub-data (GeoLite2 mmdb — no MaxMind account needed), version, and api/papi for the
    # community blocklist. Enumerating them broke the startup hub update on version.crowdsec.net.
    # matchPattern spans one label only, so the two-label papi.api and blocklists.api hosts
    # each need their own entry; blocklists.api serves the CAPI community-blocklist files.
    # The 10s PAPI poller otherwise hangs on blocked connections instead of taking a clean
    # 402, and `cscli papi status` reports a timeout rather than the real reason.
    - toFQDNs:
        - matchName: "crowdsec.net"
        - matchName: "papi.api.crowdsec.net"
        - matchName: "blocklists.api.crowdsec.net"
        - matchPattern: "*.crowdsec.net"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crowdsec-lapi
spec:
  endpointSelector:
    matchLabels:
      k8s-app: crowdsec
      type: lapi
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: crowdsec-bouncer
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # 8080 is the LAPI; 6060 backs the Web UI's own metrics page (not the Prometheus scrape).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: crowdsec-web-ui
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "6060"
              protocol: TCP
    # Agent and AppSec register with and stream from the LAPI over 8080 — load-bearing:
    # before the split everything lived in one pod, so this rule never existed.
    - fromEndpoints:
        - matchLabels:
            k8s-app: crowdsec
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # blocklist-import CronJob reads existing decisions (bouncer key) and writes new
    # ones (machine JWT) over 8080; like the agent, it had no rule before the split.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: blocklist-import
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Single-rule doc on purpose: the clusterwide ingress-from-prometheus CCNP selects these
# pods via the global prometheus label and flips their ingress to default-deny, so without
# this doc the web-ui metrics scrape of 6060 would be dropped.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crowdsec-agent
spec:
  endpointSelector:
    matchLabels:
      k8s-app: crowdsec
      type: agent
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: crowdsec-web-ui
      toPorts:
        - ports:
            - port: "6060"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crowdsec-appsec
spec:
  endpointSelector:
    matchLabels:
      k8s-app: crowdsec
      type: appsec
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: crowdsec-bouncer
      toPorts:
        - ports:
            - port: "7422"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: crowdsec-web-ui
      toPorts:
        - ports:
            - port: "6060"
              protocol: TCP
