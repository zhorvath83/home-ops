---
# Upstream defaults plus duration_expr: a repeat offender's ban grows 4h -> 8h -> 12h.
# GetDecisionsCount also counts CAPI decisions, so an IP already on the community
# blocklist starts one step up. duration_expr is a profile-level field, not a decision one.
name: default_ip_remediation
filters:
  - Alert.Remediation == true && Alert.GetScope() == "Ip"
decisions:
  - type: ban
    duration: 4h
duration_expr: "Sprintf('%dh', (GetDecisionsCount(Alert.GetValue()) + 1) * 4)"
on_success: break
---
name: default_range_remediation
filters:
  - Alert.Remediation == true && Alert.GetScope() == "Range"
decisions:
  - type: ban
    duration: 4h
duration_expr: "Sprintf('%dh', (GetDecisionsCount(Alert.GetValue()) + 1) * 4)"
on_success: break
