---
# yaml-language-server: $schema=https://json.schemastore.org/prometheus.rules.test.json
# promtool unit tests for app/prometheusrule.yaml, covering CrowdSecLAPIDown,
# CrowdSecAgentDown, CrowdSecAppsecDown, CrowdSecBanActive, CrowdSecAcquisitionStalled,
# CrowdSecDecisionBudgetNearCap, CrowdSecBlocklistImportSourceFailing, and
# CrowdSecBlocklistImportMetricsAbsent. The three `*Down` alerts share the shape
# `up == 0 or absent(up{...})`, so the `absent()` branch covers scale-to-0 / crashloop /
# evicted where the `up` series vanishes — that is the branch the tests exercise most,
# since `up == 0` alone would never fire for those outage shapes. for:5m, so every fire
# case evals past 5m (eval at 6m). CrowdSecBanActive and CrowdSecAcquisitionStalled carry
# keep_firing_for latches; each has a past-latch case mutation-verified (remove
# keep_firing_for from the rule -> exactly that case fails with got:[]).
# Run via `just k8s test-prom-rules` (recipe copies this test + .extracted_prometheus_rules.yaml into a temp dir).
rule_files:
  - ./.extracted_prometheus_rules.yaml
evaluation_interval: 1m
tests:
  # === CrowdSecAgentDown ===
  # (a) Fire: series absent (DaemonSet gone / scaled to 0). absent() carries the matcher labels
  # (job, namespace) into the result vector; fires after 5m for.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 6m
        alertname: CrowdSecAgentDown
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecAgentDown
              severity: critical
              job: crowdsec-agent-service
              namespace: crowdsec
            exp_annotations:
              summary: CrowdSec agent is down
              description: |-
                The crowdsec-agent DaemonSet has no scrapeable target, so envoy container logs
                are not parsed and no local decisions are issued. CAPI blocklists still apply via
                the LAPI, but scenario-based detection is stopped. Check the crowdsec-agent DaemonSet.
  # (b) Fire: up == 0 (scrape ran and failed) — the left branch of the `or`. exp_labels carry
  # job + namespace from the up series.
  - interval: 1m
    input_series:
      - series: 'up{job="crowdsec-agent-service",namespace="crowdsec"}'
        values: '0x7'
    alert_rule_test:
      - eval_time: 6m
        alertname: CrowdSecAgentDown
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecAgentDown
              severity: critical
              job: crowdsec-agent-service
              namespace: crowdsec
            exp_annotations:
              summary: CrowdSec agent is down
              description: |-
                The crowdsec-agent DaemonSet has no scrapeable target, so envoy container logs
                are not parsed and no local decisions are issued. CAPI blocklists still apply via
                the LAPI, but scenario-based detection is stopped. Check the crowdsec-agent DaemonSet.
  # (c) No-fire: up == 1 — `up == 0` is empty and the series is present so absent() is empty too.
  - interval: 1m
    input_series:
      - series: 'up{job="crowdsec-agent-service",namespace="crowdsec"}'
        values: '1x7'
    alert_rule_test:
      - eval_time: 6m
        alertname: CrowdSecAgentDown
        exp_alerts: []
  # === CrowdSecAppsecDown ===
  # (d) Fire: series absent — same shape as (a); job label is the appsec ServiceMonitor name.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 6m
        alertname: CrowdSecAppsecDown
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecAppsecDown
              severity: critical
              job: crowdsec-appsec-service
              namespace: crowdsec
            exp_annotations:
              summary: CrowdSec AppSec is down
              description: |-
                The crowdsec-appsec Deployment has no scrapeable target, so in-band AppSec rule
                evaluation is not running. Requests routed through appsec are no longer inspected
                for app-level signals. Check the crowdsec-appsec Deployment.
  # (e) Fire: up == 0 — left branch of the `or`.
  - interval: 1m
    input_series:
      - series: 'up{job="crowdsec-appsec-service",namespace="crowdsec"}'
        values: '0x7'
    alert_rule_test:
      - eval_time: 6m
        alertname: CrowdSecAppsecDown
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecAppsecDown
              severity: critical
              job: crowdsec-appsec-service
              namespace: crowdsec
            exp_annotations:
              summary: CrowdSec AppSec is down
              description: |-
                The crowdsec-appsec Deployment has no scrapeable target, so in-band AppSec rule
                evaluation is not running. Requests routed through appsec are no longer inspected
                for app-level signals. Check the crowdsec-appsec Deployment.
  # (f) No-fire: up == 1 — both branches empty, stays quiet through for:5m.
  - interval: 1m
    input_series:
      - series: 'up{job="crowdsec-appsec-service",namespace="crowdsec"}'
        values: '1x7'
    alert_rule_test:
      - eval_time: 6m
        alertname: CrowdSecAppsecDown
        exp_alerts: []
  # === CrowdSecDecisionBudgetNearCap ===
  # expr is sum() with NO by(), so every label is aggregated away — exp_labels carry ONLY
  # alertname + severity (no job/namespace, unlike every sibling case above). Annotations are
  # static (no $labels/$value), asserted verbatim. for:30m + evaluation_interval:1m -> fire at 31m.
  # The 63750 threshold is hand-computed 85% of MAX_DECISIONS (75000), which lives in a different
  # file (crowdsec-blocklist-import/app/helmrelease.yaml) with nothing linking them — these tests are the
  # only artifact pinning the relationship (crowdsec's first threshold alert).
  # (1) Boundary NO-fire: total exactly 63750. `>` is strict, so 63750 > 63750 is false; no fire
  # even after for:30m (eval at 31m).
  - interval: 1m
    input_series:
      - series: 'cs_active_decisions{job="crowdsec-service",namespace="crowdsec",origin="CAPI"}'
        values: '63750x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: CrowdSecDecisionBudgetNearCap
        exp_alerts: []
  # (2) Boundary FIRE: total 63751 (one above threshold). Fires at 31m; labels = alertname + severity only.
  - interval: 1m
    input_series:
      - series: 'cs_active_decisions{job="crowdsec-service",namespace="crowdsec",origin="CAPI"}'
        values: '63751x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: CrowdSecDecisionBudgetNearCap
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecDecisionBudgetNearCap
              severity: warning
            exp_annotations:
              summary: CrowdSec decisions approaching the MAX_DECISIONS cap
              description: |-
                Total active LAPI decisions (all origins, CAPI included) are above 85% of the
                blocklist-import MAX_DECISIONS cap (75000). When the cap is reached the importer
                logs "skipping remaining sources" and exits 0, so KubeJobFailed never fires and
                the tail feeds (Cybercrime Tracker, VXVault) drop silently. Raise MAX_DECISIONS
                or prune a feed before that happens. keep_firing_for: 48h latches the alert: once
                the count drops below the threshold it stays firing for ~48h (≥ the daily 24h-TTL
                sawtooth) before resolving — not minutes — so a peak crossing does not flap.
  # (3) `for` not yet met: same 63751 series at eval 29m, before 30m elapses — pins for:30m.
  - interval: 1m
    input_series:
      - series: 'cs_active_decisions{job="crowdsec-service",namespace="crowdsec",origin="CAPI"}'
        values: '63751x40'
    alert_rule_test:
      - eval_time: 29m
        alertname: CrowdSecDecisionBudgetNearCap
        exp_alerts: []
  # (4) CROSS-ORIGIN SUM: CAPI 60000 + blocklist-import 4948 = 64948 > 63750. Proves the rule
  # aggregates across origins — the entire justification for a total-cap threshold (CAPI alone at
  # 60000 would not fire). Fires at 31m.
  - interval: 1m
    input_series:
      - series: 'cs_active_decisions{job="crowdsec-service",namespace="crowdsec",origin="CAPI"}'
        values: '60000x40'
      - series: 'cs_active_decisions{job="crowdsec-service",namespace="crowdsec",origin="blocklist-import"}'
        values: '4948x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: CrowdSecDecisionBudgetNearCap
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecDecisionBudgetNearCap
              severity: warning
            exp_annotations:
              summary: CrowdSec decisions approaching the MAX_DECISIONS cap
              description: |-
                Total active LAPI decisions (all origins, CAPI included) are above 85% of the
                blocklist-import MAX_DECISIONS cap (75000). When the cap is reached the importer
                logs "skipping remaining sources" and exits 0, so KubeJobFailed never fires and
                the tail feeds (Cybercrime Tracker, VXVault) drop silently. Raise MAX_DECISIONS
                or prune a feed before that happens. keep_firing_for: 48h latches the alert: once
                the count drops below the threshold it stays firing for ~48h (≥ the daily 24h-TTL
                sawtooth) before resolving — not minutes — so a peak crossing does not flap.
  # (5) Negative, current operating region: CAPI 58000 + blocklist-import 4948 = 62948 < 63750 — no
  # fire at 31m. Mirrors today's ~39k live total (well under the alert).
  - interval: 1m
    input_series:
      - series: 'cs_active_decisions{job="crowdsec-service",namespace="crowdsec",origin="CAPI"}'
        values: '58000x40'
      - series: 'cs_active_decisions{job="crowdsec-service",namespace="crowdsec",origin="blocklist-import"}'
        values: '4948x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: CrowdSecDecisionBudgetNearCap
        exp_alerts: []
  # (6) Selector pin: the metric on the wrong job (crowdsec-agent-service) does not match the
  # job="crowdsec-service" matcher — 70000 must not fire. Pins the job matcher.
  - interval: 1m
    input_series:
      - series: 'cs_active_decisions{job="crowdsec-agent-service",namespace="crowdsec",origin="CAPI"}'
        values: '70000x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: CrowdSecDecisionBudgetNearCap
        exp_alerts: []
  # (7) keep_firing_for pin: 63751 for 40m (fires at 31m), then 0 for 30m. At eval 60m the
  # condition has been false since 41m, so WITHOUT keep_firing_for the alert would have
  # resolved and returned got:[] — it stays firing here ONLY because keep_firing_for: 48h
  # latches it for 48h after the condition drops. This is the one mutation the suite did not
  # catch (removing keep_firing_for left the other 12 cases green); pinned by mutation test.
  - interval: 1m
    input_series:
      - series: 'cs_active_decisions{job="crowdsec-service",namespace="crowdsec",origin="CAPI"}'
        values: '63751x40 0x30'
    alert_rule_test:
      - eval_time: 60m
        alertname: CrowdSecDecisionBudgetNearCap
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecDecisionBudgetNearCap
              severity: warning
            exp_annotations:
              summary: CrowdSec decisions approaching the MAX_DECISIONS cap
              description: |-
                Total active LAPI decisions (all origins, CAPI included) are above 85% of the
                blocklist-import MAX_DECISIONS cap (75000). When the cap is reached the importer
                logs "skipping remaining sources" and exits 0, so KubeJobFailed never fires and
                the tail feeds (Cybercrime Tracker, VXVault) drop silently. Raise MAX_DECISIONS
                or prune a feed before that happens. keep_firing_for: 48h latches the alert: once
                the count drops below the threshold it stays firing for ~48h (≥ the daily 24h-TTL
                sawtooth) before resolving — not minutes — so a peak crossing does not flap.
  # === CrowdSecBlocklistImportSourceFailing ===
  # expr: max by(source)(max_over_time(blocklist_import_source_status{...}[50h])) == 0 — TSDB-sourced,
  # no `for:`. exp_labels carry alertname + severity + source (job/instance dropped). The group
  # interval MUST equal the file evaluation_interval (1m): keep_firing_for ticks on those ticks.
  # 50h = 3000m. A fresh all-0 series fires at t=0 (partial window all-0), so the meaningful cases
  # model a HEALTHY prefix (1xN) then a failure — only then does the 50h window gate the fire.
  # (8) FIRE: healthy 50h, then 0 for 50h1m. max_over_time[50h]==0 first holds at t=100h (50h after
  # the failure starts, when the last healthy 1 ages out of the window); eval at 100h1m -> firing.
  - interval: 1m
    input_series:
      - series: 'blocklist_import_source_status{job="crowdsec-blocklist-import",source="Cybercrime Tracker"}'
        values: '1x3000 0x3001'
    alert_rule_test:
      - eval_time: 100h1m
        alertname: CrowdSecBlocklistImportSourceFailing
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecBlocklistImportSourceFailing
              severity: warning
              source: Cybercrime Tracker
            exp_annotations:
              summary: A blocklist-import feed failed to fetch
              description: |-
                blocklist-import source Cybercrime Tracker reported fetch status 0 (failed) for
                every scrape across ~2 consecutive daily runs (max_over_time[50h] == 0). The job
                exits 0 as long as ≥1 source succeeds, so feed-rot is invisible to KubeJobFailed.
                Check the importer logs and the feed URL; prune or disable the feed if it is dead.
  # (9) NO-FIRE: healthy (1) for 100h1m — max_over_time[50h]=1, condition false, stays quiet.
  - interval: 1m
    input_series:
      - series: 'blocklist_import_source_status{job="crowdsec-blocklist-import",source="Cybercrime Tracker"}'
        values: '1x6001'
    alert_rule_test:
      - eval_time: 100h1m
        alertname: CrowdSecBlocklistImportSourceFailing
        exp_alerts: []
  # (10) NO-FIRE transient: healthy 50h, then 0 for 24h (one failed run), then 1 (recovered). The
  # 24h failure can never fill a 50h all-0 window while prior healthy 1s are still in it, so
  # max_over_time[50h] stays 1 and the alert never fires — a single transient fetch failure does not page.
  - interval: 1m
    input_series:
      - series: 'blocklist_import_source_status{job="crowdsec-blocklist-import",source="Cybercrime Tracker"}'
        values: '1x3000 0x1440 1x1561'
    alert_rule_test:
      - eval_time: 100h1m
        alertname: CrowdSecBlocklistImportSourceFailing
        exp_alerts: []
  # (11) keep_firing_for pin: healthy 50h, then 0 for 50h1m (fires at t=100h when the window fills),
  # then 1 (recovered at 100h1m). At eval 123h the condition has been false since 100h1m (~23h <
  # 24h keep_firing_for), so it stays firing — removing keep_firing_for:24h would resolve it and
  # return got:[]. Mutation pin, same pattern as case (7).
  - interval: 1m
    input_series:
      - series: 'blocklist_import_source_status{job="crowdsec-blocklist-import",source="Cybercrime Tracker"}'
        values: '1x3000 0x3001 1x1380'
    alert_rule_test:
      - eval_time: 123h
        alertname: CrowdSecBlocklistImportSourceFailing
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecBlocklistImportSourceFailing
              severity: warning
              source: Cybercrime Tracker
            exp_annotations:
              summary: A blocklist-import feed failed to fetch
              description: |-
                blocklist-import source Cybercrime Tracker reported fetch status 0 (failed) for
                every scrape across ~2 consecutive daily runs (max_over_time[50h] == 0). The job
                exits 0 as long as ≥1 source succeeds, so feed-rot is invisible to KubeJobFailed.
                Check the importer logs and the feed URL; prune or disable the feed if it is dead.
  # === CrowdSecBlocklistImportMetricsAbsent ===
  # expr: absent_over_time(blocklist_import_source_status{...}[26h]) — TSDB-sourced, no `for:`.
  # absent_over_time carries the selector's job label -> exp_labels carry alertname + severity + job.
  # 26h = 1560m > one 24h daily run. With no series at all the range is empty at any eval (fires
  # immediately); the 26h window gates only the "was present, then stopped" case (14).
  # (12) FIRE: no source_status series at all. absent_over_time[26h] returns {job=...}=1; fires.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 26h1m
        alertname: CrowdSecBlocklistImportMetricsAbsent
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecBlocklistImportMetricsAbsent
              severity: warning
              job: crowdsec-blocklist-import
            exp_annotations:
              summary: blocklist-import freshness metrics are absent
              description: |-
                No blocklist_import_source_status sample has been scraped for ~26h (absent_over_time[26h]),
                so the per-source freshness signal is dead — a daily run was missed. Likely causes:
                METRICS_ENABLED disabled, the Pushgateway unreachable, or the importer crashing before
                its metrics push. The CrowdSecBlocklistImportSourceFailing alert cannot fire while this
                is absent, so treat as a monitoring outage of the feed-rot detection plane.
  # (13) NO-FIRE: a source_status series is present (value 1) across the 26h window — absent_over_time
  # is empty, stays quiet at 26h1m.
  - interval: 1m
    input_series:
      - series: 'blocklist_import_source_status{job="crowdsec-blocklist-import",source="Spamhaus DROP"}'
        values: '1x1562'
    alert_rule_test:
      - eval_time: 26h1m
        alertname: CrowdSecBlocklistImportMetricsAbsent
        exp_alerts: []
  # (14) 26h-window-boundary pin: a single sample at t=0, then nothing. At eval 25h the sample is
  # still inside the [t-26h,t] window -> absent_over_time empty -> no fire. At eval 27h the sample
  # has aged out -> absent_over_time=1 -> fires. Pins the 26h range window (successor to for:1h pin).
  - interval: 1m
    input_series:
      - series: 'blocklist_import_source_status{job="crowdsec-blocklist-import",source="Spamhaus DROP"}'
        values: '1x1'
    alert_rule_test:
      - eval_time: 25h
        alertname: CrowdSecBlocklistImportMetricsAbsent
        exp_alerts: []
      - eval_time: 27h
        alertname: CrowdSecBlocklistImportMetricsAbsent
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecBlocklistImportMetricsAbsent
              severity: warning
              job: crowdsec-blocklist-import
            exp_annotations:
              summary: blocklist-import freshness metrics are absent
              description: |-
                No blocklist_import_source_status sample has been scraped for ~26h (absent_over_time[26h]),
                so the per-source freshness signal is dead — a daily run was missed. Likely causes:
                METRICS_ENABLED disabled, the Pushgateway unreachable, or the importer crashing before
                its metrics push. The CrowdSecBlocklistImportSourceFailing alert cannot fire while this
                is absent, so treat as a monitoring outage of the feed-rot detection plane.
  # === CrowdSecLAPIDown === `up == 0 or absent(up{job="crowdsec-service",namespace="crowdsec"})`,
  # for:5m. Same shape as the already-covered CrowdSecAgentDown / CrowdSecAppsecDown; the
  # exp_annotations (with the bouncer SecurityPolicy follow-on) are the reason this file exists.
  # (15) Fire: series absent (LAPI pod gone / scaled to 0). absent() carries job+namespace; fires at 6m.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 6m
        alertname: CrowdSecLAPIDown
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecLAPIDown
              severity: critical
              job: crowdsec-service
              namespace: crowdsec
            exp_annotations:
              summary: CrowdSec LAPI is down
              description: |-
                The CrowdSec LAPI is unreachable, so no decision can be issued or queried.
                Once the bouncer SecurityPolicy is attached this also fails requests closed
                on the affected gateway.
  # (16) Fire: up == 0 (scrape ran and failed) — the left branch of the `or`.
  - interval: 1m
    input_series:
      - series: 'up{job="crowdsec-service",namespace="crowdsec"}'
        values: '0x7'
    alert_rule_test:
      - eval_time: 6m
        alertname: CrowdSecLAPIDown
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecLAPIDown
              severity: critical
              job: crowdsec-service
              namespace: crowdsec
            exp_annotations:
              summary: CrowdSec LAPI is down
              description: |-
                The CrowdSec LAPI is unreachable, so no decision can be issued or queried.
                Once the bouncer SecurityPolicy is attached this also fails requests closed
                on the affected gateway.
  # (17) No-fire: up == 1 — `up == 0` empty and present so absent() empty too.
  - interval: 1m
    input_series:
      - series: 'up{job="crowdsec-service",namespace="crowdsec"}'
        values: '1x7'
    alert_rule_test:
      - eval_time: 6m
        alertname: CrowdSecLAPIDown
        exp_alerts: []
  # === CrowdSecBanActive === sum by(reason,origin,action)(cs_active_decisions{...,origin!~"CAPI|
  # lists(:.*)?|blocklist-import"}) > 0, for:1m, keep_firing_for:5m. `sum by` keeps reason/origin/
  # action and drops job/namespace, so exp_labels = alertname + severity + reason + origin + action.
  # Annotations are static (no $labels/$value), asserted verbatim. The gauge is Reset() each scrape,
  # so for + keep_firing_for debounce a resolve->refire without lagging a 4h ban's real end.
  # (18) FIRE: non-CAPI origin (cscli) value 1, for:1m met, eval at 2m. Asserts the by() label set.
  - interval: 1m
    input_series:
      - series: 'cs_active_decisions{job="crowdsec-service",namespace="crowdsec",origin="cscli",reason="ip",action="ban"}'
        values: '1x3'
    alert_rule_test:
      - eval_time: 2m
        alertname: CrowdSecBanActive
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecBanActive
              severity: critical
              reason: ip
              origin: cscli
              action: ban
            exp_annotations:
              summary: CrowdSec banned a source
              description: |-
                CrowdSec banned a source after the scenario below tripped. The ban lasts 4h
                and doubles for each repeat offence; no action is needed. If it was you,
                clear it with `cscli decisions delete <ip>`.
  # (19) No-fire, origin exclusion load-bearing: CAPI origin (excluded by origin!~"CAPI|...") with a
  # high value must NOT fire — the ~25k community blocklist is expected noise, not a paged ban.
  - interval: 1m
    input_series:
      - series: 'cs_active_decisions{job="crowdsec-service",namespace="crowdsec",origin="CAPI",reason="ip",action="ban"}'
        values: '100x3'
    alert_rule_test:
      - eval_time: 2m
        alertname: CrowdSecBanActive
        exp_alerts: []
  # (20) No-fire, threshold: value 0, `> 0` strict false even past for:1m.
  - interval: 1m
    input_series:
      - series: 'cs_active_decisions{job="crowdsec-service",namespace="crowdsec",origin="cscli",reason="ip",action="ban"}'
        values: '0x3'
    alert_rule_test:
      - eval_time: 2m
        alertname: CrowdSecBanActive
        exp_alerts: []
  # (21) keep_firing_for:5m past-latch pin (mutation-verified). value 1 for t=0..9m (fires ~1m once
  # for:1m met), then 0 from t=10m. At eval 13m the condition has been false for 3m (< the 5m latch),
  # so the alert STAYS firing here ONLY because keep_firing_for:5m latches it — removing
  # keep_firing_for resolves it and returns got:[] (mutation proof pasted in the completion signal).
  # Modeled on the CrowdSecDecisionBudgetNearCap case (7) latch pattern.
  - interval: 1m
    input_series:
      - series: 'cs_active_decisions{job="crowdsec-service",namespace="crowdsec",origin="cscli",reason="ip",action="ban"}'
        values: '1x10 0x4'
    alert_rule_test:
      - eval_time: 13m
        alertname: CrowdSecBanActive
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecBanActive
              severity: critical
              reason: ip
              origin: cscli
              action: ban
            exp_annotations:
              summary: CrowdSec banned a source
              description: |-
                CrowdSec banned a source after the scenario below tripped. The ban lasts 4h
                and doubles for each repeat offence; no action is needed. If it was you,
                clear it with `cscli decisions delete <ip>`.
  # === CrowdSecAcquisitionStalled === envoy 6h increase > 0 AND parser 6h increase == 0, for:10m,
  # keep_firing_for:3h. Both halves are sum() with NO by(), so exp_labels = alertname + severity
  # only. The `or vector(0)` makes parser absence read as 0 (== 0 true); the parser-constant-0
  # cases below cover the present-but-stalled shape. 6h = 360m. Annotations static, verbatim.
  # (22) FIRE: envoy incrementing (0+1x15 -> increase[6h] > 0 from t=1m), parser constant 0.
  # Condition true from t=1m; for:10m -> fires at 11m; eval 12m. Asserts both halves hold.
  - interval: 1m
    input_series:
      - series: 'envoy_http_downstream_rq_total{job="networking/envoy-proxy",namespace="networking",envoy_http_conn_manager_prefix="https-default"}'
        values: '0+1x15'
      - series: 'cs_parser_hits_ok_total{job="crowdsec-agent-service",namespace="crowdsec",acquis_type="containerd",source="/var/log/containers/envoy-external-abc"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: CrowdSecAcquisitionStalled
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecAcquisitionStalled
              severity: warning
            exp_annotations:
              summary: CrowdSec parses no envoy request
              description: |-
                Envoy served requests but the agent parsed none, so no local decision is being
                created. Likely causes: the agent DaemonSet is down or crash-looping, the
                /var/log/containers/envoy-* glob matches nothing (envoy pods recreated with
                new names mid-window), or the parser chain cri-logs -> envoy-logs broke.
                Remediation: check the agent DaemonSet and its acquisition, then restart it.
  # (23) No-fire, envoy half load-bearing: quiet cluster — envoy 0 (no traffic), parser 0. LHS
  # (envoy increase > 0) is false -> `and` empty -> no fire. A silent cluster is not a stall.
  - interval: 1m
    input_series:
      - series: 'envoy_http_downstream_rq_total{job="networking/envoy-proxy",namespace="networking",envoy_http_conn_manager_prefix="https-default"}'
        values: '0x15'
      - series: 'cs_parser_hits_ok_total{job="crowdsec-agent-service",namespace="crowdsec",acquis_type="containerd",source="/var/log/containers/envoy-external-abc"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: CrowdSecAcquisitionStalled
        exp_alerts: []
  # (24) No-fire, parser half load-bearing: envoy incrementing AND parser incrementing. Parser
  # increase[6h] > 0 -> RHS `== 0` false -> `and` empty -> no fire. Proves parsing happening = healthy.
  - interval: 1m
    input_series:
      - series: 'envoy_http_downstream_rq_total{job="networking/envoy-proxy",namespace="networking",envoy_http_conn_manager_prefix="https-default"}'
        values: '0+1x15'
      - series: 'cs_parser_hits_ok_total{job="crowdsec-agent-service",namespace="crowdsec",acquis_type="containerd",source="/var/log/containers/envoy-external-abc"}'
        values: '0+1x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: CrowdSecAcquisitionStalled
        exp_alerts: []
  # (25) for:10m pin: stall condition true (envoy incr, parser 0) but eval at 8m (< 10m) -> pending,
  # not firing. Pins for:10m (without it this would fire at 8m).
  - interval: 1m
    input_series:
      - series: 'envoy_http_downstream_rq_total{job="networking/envoy-proxy",namespace="networking",envoy_http_conn_manager_prefix="https-default"}'
        values: '0+1x10'
      - series: 'cs_parser_hits_ok_total{job="crowdsec-agent-service",namespace="crowdsec",acquis_type="containerd",source="/var/log/containers/envoy-external-abc"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: CrowdSecAcquisitionStalled
        exp_alerts: []
  # (26) keep_firing_for:3h past-latch pin (mutation-verified). envoy incrementing throughout
  # (0+1x301 -> increase[6h] > 0 always). parser 0 for t=0..199m then incrementing from t=200m:
  # the stall holds t=1m..200m (parser increase[6h] == 0), so the alert fires (~11m); the parser
  # increment enters the 6h window at t=201m (parser increase[6h] > 0) -> condition false from
  # t=201m. At eval 300m (5h) the condition has been false for 99m (< the 3h=180m latch), so the
  # alert STAYS firing ONLY because keep_firing_for:3h latches it — removing keep_firing_for
  # resolves it and returns got:[] (mutation proof pasted in the completion signal). The 6h-window
  # arithmetic is modeled on the CrowdSecBlocklistImportSourceFailing 50h-window case (8).
  - interval: 1m
    input_series:
      - series: 'envoy_http_downstream_rq_total{job="networking/envoy-proxy",namespace="networking",envoy_http_conn_manager_prefix="https-default"}'
        values: '0+1x301'
      - series: 'cs_parser_hits_ok_total{job="crowdsec-agent-service",namespace="crowdsec",acquis_type="containerd",source="/var/log/containers/envoy-external-abc"}'
        values: '0x200 0+1x101'
    alert_rule_test:
      - eval_time: 300m
        alertname: CrowdSecAcquisitionStalled
        exp_alerts:
          - exp_labels:
              alertname: CrowdSecAcquisitionStalled
              severity: warning
            exp_annotations:
              summary: CrowdSec parses no envoy request
              description: |-
                Envoy served requests but the agent parsed none, so no local decision is being
                created. Likely causes: the agent DaemonSet is down or crash-looping, the
                /var/log/containers/envoy-* glob matches nothing (envoy pods recreated with
                new names mid-window), or the parser chain cri-logs -> envoy-logs broke.
                Remediation: check the agent DaemonSet and its acquisition, then restart it.
