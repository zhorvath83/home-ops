---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# ServiceAccount `pod-gc-sweeper` (chart-generated) is bound to a least-priv
# ClusterRole (pods list/delete) for the sweep CronJob. The `pod-garbage-collector`
# SA is the Helm-adopted KCM bootstrap SA, kept but NOT bound here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-garbage-collector
rules:
  - apiGroups:
      - ""
    resources:
      - "pods"
    verbs:
      - "list"
      - "delete"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-garbage-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-garbage-collector
subjects:
  - kind: ServiceAccount
    name: pod-gc-sweeper
    namespace: kube-system
