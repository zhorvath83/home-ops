---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# ServiceAccount `pod-garbage-collector` is generated by the app-template chart
# (default name = release name); this file binds it to a least-priv ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-garbage-collector
rules:
  - apiGroups:
      - ""
    resources:
      - "pods"
    verbs:
      - "list"
      - "delete"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-garbage-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-garbage-collector
subjects:
  - kind: ServiceAccount
    name: pod-garbage-collector
    namespace: kube-system
