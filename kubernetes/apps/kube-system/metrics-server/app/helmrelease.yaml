---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: metrics-server
  values:
    # Chart defaults: seccompProfile=RuntimeDefault, runAsNonRoot, readOnlyRootFS, drop ALL.
    args:
      - --kubelet-insecure-tls
      - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
      - --kubelet-use-node-status-port
      - --metric-resolution=15s
      - --kubelet-request-timeout=2s
    resources:
      requests:
        cpu: 5m
        memory: 64Mi
      limits:
        memory: 256Mi
    metrics:
      enabled: true
    serviceMonitor:
      enabled: true
      # P1.9: drop unconsumed metrics-server histograms (flux-k8s-api-performance
      # keeps apiserver_request_{duration,slo,sli}; these others have no consumer).
      metricRelabelings:
        - sourceLabels:
            - __name__
          regex: "apiserver_response_sizes_bucket|field_validation_request_duration_seconds_bucket|metrics_server_.*_bucket|authentication_duration_seconds_bucket|authorization_duration_seconds_bucket|rest_client_.*_bucket"
          action: drop
