---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  chartRef:
    kind: OCIRepository
    name: cilium
  interval: 1h
  values:
    autoDirectNodeRoutes: true
    bandwidthManager:
      enabled: true
      bbr: true
    bgpControlPlane:
      enabled: false
    bpf:
      datapathMode: netkit
      masquerade: true
      preallocateMaps: true
    cgroup:
      automount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    cni:
      exclusive: false
    dashboards:
      enabled: true
    devices: bond+
    enableIPv4BIGTCP: true
    endpointRoutes:
      enabled: true
    envoy:
      enabled: false
    hubble:
      enabled: true
      relay:
        enabled: true
        rollOutPods: true
      ui:
        enabled: true
        rollOutPods: true
        # Selects the hubble-ui pod for the cluster-wide ingress-from-gateway-internal
        # CCNP, restricting its ingress to envoy-internal pods only so the OIDC
        # SecurityPolicy cannot be bypassed via the in-cluster Service.
        podLabels:
          ingress.home.arpa/allow-gateway-internal: "true"
      metrics:
        enabled:
          - dns:labelsContext=source_namespace,source_pod,source_workload
          - drop:labelsContext=source_namespace,source_pod,source_workload,source_ip,destination_namespace,destination_pod,destination_workload,destination_ip,traffic_direction
          - tcp
          - flow
          - port-distribution
          - icmp
          - httpV2
        serviceMonitor:
          enabled: true
          # Phase 3 safe subset: hubble 10s -> 60s. cilium-agent/operator intervals
          # are DEFERRED — their chart dashboards hardcode [1m]/[30s] ranges that
          # blank at 60s (see docs/roadmap/kube-prometheus-stack-hygiene).
          interval: 60s
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: ${POD_CIDR}
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    l2announcements:
      enabled: true
    loadBalancer:
      algorithm: maglev
      mode: dsr
    localRedirectPolicies:
      enabled: true
    operator:
      dashboards:
        enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
          # P1.5: drop unconsumed cilium-operator latency histograms
          # (operator-dashboard uses process/ipam gauges + ipam_resync_total).
          metricRelabelings:
            - sourceLabels:
                - __name__
              regex: "cilium_operator_k8s_client_api_latency_time_seconds_bucket|cilium_k8s_workqueue_(work|queue)_duration_seconds_bucket|cilium_operator_(lbipam_event_processing_time|ipam_resync_latency|ipam_resync_duration|ipam_k8s_sync_latency|ipam_k8s_sync_duration|ipam_deficit_resolver_latency|ipam_deficit_resolver_duration|hive_jobs_observer_run_duration)_seconds_bucket"
              action: drop
      replicas: 1
      rollOutPods: true
    pmtuDiscovery:
      enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
        # P1.4: drop unconsumed cilium-agent latency histograms (cilium-dashboard
        # uses endpoint_regeneration/proxy_upstream_reply/policy_implementation_delay only).
        metricRelabelings:
          - sourceLabels:
              - __name__
            regex: "cilium_(hive_jobs_timer_run_duration|k8s_client_api_latency_time|agent_api_process_time|k8s_workqueue_work_duration|k8s_workqueue_queue_duration|node_health_connectivity_latency|hive_jobs_observer_run_duration|policy_selector_cache_operation_duration|datapath_conntrack_gc_duration)_seconds_bucket"
            action: drop
    rollOutCiliumPods: true
    routingMode: native
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
    socketLB:
      enabled: true
      # hostNamespaceOnly: true was a copy from older Talos/Istio bootstrap templates.
      # With bpf.datapathMode: netkit, that setting forces service IP translation to
      # the per-packet tc-LB BPF program, which records the Service ClusterIP into
      # the conntrack entry. When the SYN-ACK comes back from the backend pod, its
      # source IP appears as the Service IP, the CT reply lookup fails, and the
      # ingress policy on the originating pod drops the return flow (seen on the
      # envoy-external -> envoy-gateway xDS stream after 4f4b76eec landed).
      # The chart default (false) keeps service translation at connect() time via
      # cgroup BPF, so the CT entry holds the real backend pod IP — the return
      # flow matches stateful CT correctly. Istio compatibility is the only reason
      # to flip it back to true, and we do not run Istio.
      hostNamespaceOnly: false
    tls:
      secretsNamespace:
        # Keep true: the secure default (readSecretsOnlyFromSecretsNamespace) always
        # renders agent/operator RBAC into this ns, so create:false wedges helm upgrades.
        create: true
