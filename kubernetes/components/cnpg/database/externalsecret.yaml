---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Repo's first kubernetes.io/basic-auth Secret: DatabaseRole reconciles the role
# password from it, and the cnpg.io/reload label makes password changes immediate.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "${APP}-db"
  namespace: database
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: "${APP}-db"
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "${APP}"
        password: "{{ .postgres_password }}"
  dataFrom:
    - extract:
        key: ${APP}
