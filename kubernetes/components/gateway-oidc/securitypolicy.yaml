---
# Reusable Envoy-native OIDC login gate.
# Consumers set APP (+ optional APP_SUBDOMAIN, HTTPROUTE_NAME) via Flux
# postBuild.substitute. Per-app group ACL is enforced at Pocket ID (client
# allowed_user_groups) — this policy carries no authorization block.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ${APP}-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ${HTTPROUTE_NAME:=${APP}}
  # Without this the most specific policy simply wins and the Gateway-level policy stops
  # applying to this route — which had been quietly excluding these routes from the
  # envoy-internal RFC1918 allowlist, and would exclude them from the CrowdSec gate too.
  mergeType: StrategicMerge
  oidc:
    provider:
      # Pocket ID has one issuer for every client; the endpoints come from discovery.
      issuer: "https://idm.${PUBLIC_DOMAIN}"
    clientIDRef:
      name: ${APP}-oidc-secret
    clientSecret:
      name: ${APP}-oidc-secret
    redirectURL: "https://${APP_SUBDOMAIN:=${APP}}.${PUBLIC_DOMAIN}/oauth2/callback"
    logoutPath: "/oauth2/logout"
    scopes:
      - "openid"
      - "profile"
      - "email"
    cookieNames:
      idToken: ${APP}-id-token
      accessToken: ${APP}-access-token
    cookieConfig:
      # Strict: closes cross-site top-level GET forced-logout; safe, idm.* and app.* share eTLD+1.
      sameSite: Strict
